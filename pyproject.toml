[project]
name = "homelab-infra"
version = "0.1.0"
description = "Homelab & Cloud Infrastructure managed by OpenTofu and Ansible"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ansible-core>=2.17.0",
    "google-auth>=2.29.0",
    "requests>=2.31.0",
    "jmespath>=1.0.1",
    "cryptography>=42.0.0",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.4.0",
    "ansible-lint>=24.2.0",
    "molecule>=24.0.0",
    "molecule-plugins[docker]>=23.5.0",
    "pytest-testinfra>=10.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".agent",
    ".agents",
    ".ruff_cache",
    ".venv",
    ".worktrees"
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "ARG", "PTH", "RUF"]
ignore = []
