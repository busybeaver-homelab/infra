[project]
name = "homelab-infra"
version = "0.1.0"
description = "Homelab & Cloud Infrastructure managed by OpenTofu and Ansible"
readme = "README.md"
requires-python = "~=3.15.0"
dependencies = [
    "ansible-core==2.21.5",
    "google-auth==2.62.0",
    "requests==2.34.2",
    "jmespath==1.1.0",
    "cryptography==50.0.2",
]

[tool.uv]
dev-dependencies = [
    "ruff==0.17.0",
    "ansible-lint==26.10.1",
    "molecule==26.10.0",
    "molecule-plugins[docker]==26.10.12",
    "pytest-testinfra==10.2.2",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".agent",
    ".agents",
    ".ruff_cache",
    ".venv",
    ".worktrees"
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "ARG", "PTH", "RUF"]
ignore = []
