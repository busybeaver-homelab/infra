[defaults]
# Default paths for inventory files, directories, and playbooks
inventory = configuration/inventories/
roles_path = configuration/roles:configuration/.galaxy/roles
collections_path = configuration/.galaxy/collections

# Enforce host key checking for strict security verification
host_key_checking = True
interpreter_python = /usr/bin/python3

# Modern stdout callback configuration
stdout_callback = ansible.builtin.default
callback_result_format = yaml

# Deprecation warnings management
deprecation_warnings = True

# Enable the community.sops vars plugin for automatic decryption of *.sops.yml variable files
vars_plugins_enabled = host_group_vars, community.sops.sops

# Fact gathering & caching optimization
gathering = smart
fact_caching = ansible.builtin.jsonfile
fact_caching_connection = .cache/ansible/facts
fact_caching_timeout = 86400

[inventory]
# Enable specific inventory plugins, including our dynamic terraform plugin
enable_plugins = host_list, script, auto, yaml, ini, toml, cloud.terraform.terraform_state
ignore_patterns = fixtures, .*test.*, README\.md, .*\.terraform_state\.yml
any_unparsed_is_failed = True

[ssh_connection]
pipelining = True


