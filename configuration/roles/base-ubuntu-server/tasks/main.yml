---
# Base hardening tasks for Ubuntu Server 26.04.

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - jq
      - unzip
      - ca-certificates
      - gnupg
      - python3-pip
      - tzdata
    state: present
  become: true

- name: Set timezone
  community.general.timezone:
    name: "{{ base_timezone }}"
  become: true

- name: Configure host firewall and Docker chain isolation
  ansible.builtin.include_tasks: firewall.yml
