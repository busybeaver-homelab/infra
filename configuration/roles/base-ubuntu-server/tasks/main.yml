---
# Base hardening tasks for Ubuntu Server 22.04.
# NOTE: Ubuntu Core support requires a separate role with snap-based package management.
# See meta/main.yml for the Ubuntu Core tracking note.

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - jq
      - unzip
      - ca-certificates
      - gnupg
      - python3-pip
      - tzdata
    state: present
  become: true

- name: Set timezone
  community.general.timezone:
    name: "{{ base_timezone }}"
  become: true
