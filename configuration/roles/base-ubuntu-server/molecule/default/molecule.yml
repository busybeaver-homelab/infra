---
dependency:
  name: galaxy

driver:
  name: docker
  # NOTE: Ubuntu Core requires Vagrant or LXD driver (snapd is not supported in Docker).
  # Current scope: Ubuntu Server 22.04 only.

platforms:
  - name: ubuntu-server-22
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /lib/systemd/systemd

provisioner:
  name: ansible
  config_options:
    defaults:
      callbacks_enabled: profile_tasks
      remote_tmp: /tmp

verifier:
  name: ansible
