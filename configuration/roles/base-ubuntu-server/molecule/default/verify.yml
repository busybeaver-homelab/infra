---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify base packages are installed
      ansible.builtin.package:
        name:
          - curl
          - wget
          - jq
          - unzip
          - ca-certificates
        state: present
      check_mode: true
      register: pkg_check
      failed_when: pkg_check.changed
