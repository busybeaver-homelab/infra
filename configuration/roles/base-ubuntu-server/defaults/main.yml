---
# Default variables for base-ubuntu-server role.
# Sensitive values (SSH keys, passwords) are loaded via community.sops vars plugin
# from secrets/credentials.ci.sops.yaml (CI) or secrets/credentials.sops.yaml (prod).

base_timezone: "UTC"

# Firewall settings (UFW & Docker chain isolation)
base_firewall_enabled: true
base_firewall_default_incoming: "deny"
base_firewall_default_outgoing: "allow"
base_firewall_allow_tailscale: true
base_firewall_allow_openssh: false
base_firewall_docker_isolation: true

# SSH daemon state verification
base_verify_ssh_running: false
