---
- name: Verify
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Verify restic package is installed
      ansible.builtin.package:
        name: restic
        state: present
      check_mode: true
      register: restic_backup_pkg_check
      failed_when: restic_backup_pkg_check.changed

    - name: Verify restic binary execution
      ansible.builtin.command: restic version
      register: restic_backup_binary_version
      changed_when: false
      failed_when: "'restic' not in restic_backup_binary_version.stdout"

    - name: Stat restic config directory
      ansible.builtin.stat:
        path: /etc/restic
      register: restic_backup_dir_stat

    - name: Assert restic config directory permissions
      ansible.builtin.assert:
        that:
          - restic_backup_dir_stat.stat.exists
          - restic_backup_dir_stat.stat.mode == '0700'
          - restic_backup_dir_stat.stat.pw_name == 'root'

    - name: Stat restic backup.env
      ansible.builtin.stat:
        path: /etc/restic/backup.env
      register: restic_backup_env_stat

    - name: Assert backup.env permissions and ownership
      ansible.builtin.assert:
        that:
          - restic_backup_env_stat.stat.exists
          - restic_backup_env_stat.stat.mode == '0600'
          - restic_backup_env_stat.stat.pw_name == 'root'
          - restic_backup_env_stat.stat.gr_name == 'root'

    - name: Stat restic primary.env
      ansible.builtin.stat:
        path: /etc/restic/primary.env
      register: restic_backup_primary_env_stat

    - name: Assert primary.env permissions and ownership
      ansible.builtin.assert:
        that:
          - restic_backup_primary_env_stat.stat.exists
          - restic_backup_primary_env_stat.stat.mode == '0600'
          - restic_backup_primary_env_stat.stat.pw_name == 'root'

    - name: Stat restic secondary.env
      ansible.builtin.stat:
        path: /etc/restic/secondary.env
      register: restic_backup_secondary_env_stat

    - name: Assert secondary.env permissions and ownership
      ansible.builtin.assert:
        that:
          - restic_backup_secondary_env_stat.stat.exists
          - restic_backup_secondary_env_stat.stat.mode == '0600'
          - restic_backup_secondary_env_stat.stat.pw_name == 'root'

    - name: Stat restic password file
      ansible.builtin.stat:
        path: /etc/restic/password
      register: restic_backup_password_stat

    - name: Assert password file permissions and ownership
      ansible.builtin.assert:
        that:
          - restic_backup_password_stat.stat.exists
          - restic_backup_password_stat.stat.mode == '0400'
          - restic_backup_password_stat.stat.pw_name == 'root'
          - restic_backup_password_stat.stat.gr_name == 'root'

    - name: Stat restic password-secondary file
      ansible.builtin.stat:
        path: /etc/restic/password-secondary
      register: restic_backup_secondary_password_stat

    - name: Assert password-secondary file permissions and ownership
      ansible.builtin.assert:
        that:
          - restic_backup_secondary_password_stat.stat.exists
          - restic_backup_secondary_password_stat.stat.mode == '0400'
          - restic_backup_secondary_password_stat.stat.pw_name == 'root'

    - name: Stat restic failure unit
      ansible.builtin.stat:
        path: /etc/systemd/system/restic-backup-failure@.service
      register: restic_backup_failure_unit_stat

    - name: Assert failure unit exists and permissions
      ansible.builtin.assert:
        that:
          - restic_backup_failure_unit_stat.stat.exists
          - restic_backup_failure_unit_stat.stat.mode == '0644'

    - name: Slurp restic service unit file
      ansible.builtin.slurp:
        src: /etc/systemd/system/restic-backup.service
      register: restic_backup_service_content

    - name: Assert systemd sandboxing and OnFailure directive
      ansible.builtin.assert:
        that:
          - "'CapabilityBoundingSet=' in (restic_backup_service_content.content | b64decode)"
          - "'SystemCallFilter=@system-service' in (restic_backup_service_content.content | b64decode)"
          - "'OnFailure=restic-backup-failure@%n.service' in (restic_backup_service_content.content | b64decode)"

    - name: Stat runner script
      ansible.builtin.stat:
        path: /usr/local/sbin/restic-backup-runner.sh
      register: restic_backup_runner_stat

    - name: Assert runner script permissions
      ansible.builtin.assert:
        that:
          - restic_backup_runner_stat.stat.exists
          - restic_backup_runner_stat.stat.mode == '0750'
          - restic_backup_runner_stat.stat.pw_name == 'root'

    - name: Verify restic-backup.timer is started and enabled
      ansible.builtin.systemd_service:
        name: restic-backup.timer
        state: started
        enabled: true
      check_mode: true
      register: restic_backup_timer_stat
      failed_when: restic_backup_timer_stat.changed

    - name: Verify systemd unit configurations
      ansible.builtin.command: systemd-analyze verify /etc/systemd/system/restic-backup.service /etc/systemd/system/restic-backup.timer
      changed_when: false

    - name: Trigger restic backup service via systemd
      ansible.builtin.systemd_service:
        name: restic-backup.service
        state: started

    - name: Verify primary restic snapshot was recorded
      ansible.builtin.command: restic snapshots
      environment:
        RESTIC_REPOSITORY: "/var/cache/restic/primary-repo"
        RESTIC_PASSWORD_FILE: "/etc/restic/password"
      register: restic_backup_primary_snapshots_stat
      changed_when: false

    - name: Assert primary snapshot contains scheduled and primary tags
      ansible.builtin.assert:
        that:
          - "'scheduled' in restic_backup_primary_snapshots_stat.stdout"
          - "'primary' in restic_backup_primary_snapshots_stat.stdout"

    - name: Verify secondary restic snapshot was recorded
      ansible.builtin.command: restic snapshots
      environment:
        RESTIC_REPOSITORY: "/var/cache/restic/secondary-repo"
        RESTIC_PASSWORD_FILE: "/etc/restic/password-secondary"
      register: restic_backup_secondary_snapshots_stat
      changed_when: false

    - name: Assert secondary snapshot contains scheduled and secondary tags
      ansible.builtin.assert:
        that:
          - "'scheduled' in restic_backup_secondary_snapshots_stat.stdout"
          - "'secondary' in restic_backup_secondary_snapshots_stat.stdout"
