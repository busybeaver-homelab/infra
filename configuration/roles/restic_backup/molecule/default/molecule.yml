---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: ubuntu-server-26
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /lib/systemd/systemd

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../..
  config_options:
    defaults:
      callbacks_enabled: profile_tasks
      remote_tmp: /tmp

verifier:
  name: ansible
