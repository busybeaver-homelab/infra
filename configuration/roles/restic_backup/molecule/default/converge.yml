---
- name: Converge
  hosts: all
  gather_facts: true
  become: true
  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure test directory exists in backup path
      ansible.builtin.file:
        path: /opt/containers/web
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Ensure non-root container data directory exists (database-style 999:999, 0700)
      ansible.builtin.file:
        path: /opt/containers/db/data
        state: directory
        owner: "999"
        group: "999"
        mode: "0700"

    - name: Create non-root container data file readable only by its owner
      ansible.builtin.copy:
        content: "16\n"
        dest: /opt/containers/db/data/PG_VERSION
        owner: "999"
        group: "999"
        mode: "0600"

    - name: Create test file for backup verification
      ansible.builtin.copy:
        content: "test file for encrypted restic backup\n"
        dest: /opt/containers/web/docker-compose.yml
        owner: root
        group: root
        mode: "0644"

  vars:
    restic_backup_auto_init: true
    restic_backup_repository: "/var/cache/restic/primary-repo"
    restic_backup_password: >-
      {{ lookup('ansible.builtin.password', '/tmp/molecule-restic-primary-pass', length=32, chars=['ascii_letters', 'digits']) }}
    restic_backup_secondary_enabled: true
    restic_backup_secondary_repository: "/var/cache/restic/secondary-repo"
    restic_backup_secondary_password: >-
      {{ lookup('ansible.builtin.password', '/tmp/molecule-restic-dr-pass', length=32, chars=['ascii_letters', 'digits']) }}
    # Local stub listener started by verify.yml; proves heartbeat and /fail delivery.
    restic_backup_healthchecks_ping_url: "http://127.0.0.1:18080/molecule-check"
    restic_backup_paths:
      - "/etc"
      - "/opt/containers"
      - "/var/backups/containers"

  roles:
    - role: restic_backup
