---
# Tasks for restic_backup role

- name: Assert required restic_backup arguments are non-empty
  ansible.builtin.assert:
    that:
      - restic_backup_repository is defined
      - restic_backup_repository | string | length > 0
      - restic_backup_password is defined
      - restic_backup_password | string | length > 0
    fail_msg: "restic_backup_repository and restic_backup_password must be defined and non-empty."
    quiet: true
  no_log: true

- name: Install restic and curl packages
  ansible.builtin.apt:
    name:
      - restic
      - curl
    state: present
    update_cache: false
  become: true

- name: Create restic configuration and state directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ restic_backup_config_dir }}", mode: "0700" }
    - { path: "{{ restic_backup_config_dir }}/hooks.d", mode: "0750" }
    - { path: "{{ restic_backup_config_dir }}/hooks.d/pre.d", mode: "0750" }
    - { path: "{{ restic_backup_config_dir }}/hooks.d/post.d", mode: "0750" }
    - { path: "{{ restic_backup_cache_dir }}", mode: "0700" }
    - { path: "{{ restic_backup_log_dir }}", mode: "0750" }
    - { path: "{{ restic_backup_credstore_dir }}", mode: "0700" }
    - { path: "{{ restic_backup_libexec_dir }}", mode: "0755" }
    - { path: "/opt/containers", mode: "0755" }
    - { path: "/var/backups/containers", mode: "0700" }
  become: true

- name: Deploy restic pre-backup container database dump hook
  ansible.builtin.copy:
    src: 10-container-db-dumps.sh
    dest: "{{ restic_backup_config_dir }}/hooks.d/pre.d/10-container-db-dumps.sh"
    owner: root
    group: root
    mode: "0750"
  become: true

- name: Deploy restic helper scripts
  ansible.builtin.copy:
    src: "{{ item }}.sh"
    dest: "{{ restic_backup_libexec_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0750"
  loop:
    - restic-credential-sync
    - restic-backup-notify
  become: true

# Secrets are stored as systemd encrypted credentials (AES-256-GCM, bound to the
# host key in /var/lib/systemd/credential.secret). They survive reboots, are never
# written to disk in plaintext and are only decrypted into the service's private
# $CREDENTIALS_DIRECTORY at start (LoadCredentialEncrypted=).
- name: Encrypt restic credentials into the systemd credential store
  ansible.builtin.command:
    argv:
      - "{{ restic_backup_libexec_dir }}/restic-credential-sync"
      - "{{ item.name }}"
      - "{{ restic_backup_credstore_dir }}"
      - "{{ restic_backup_credential_key }}"
    stdin: "{{ item.value }}"
    stdin_add_newline: false
  loop: "{{ restic_backup_credentials }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.enabled | bool
  register: restic_backup_credential_sync
  changed_when: restic_backup_credential_sync.stdout == 'changed'
  no_log: true
  become: true

- name: Remove disabled restic credentials from the credential store
  ansible.builtin.file:
    path: "{{ restic_backup_credstore_dir }}/{{ item.name }}"
    state: absent
  loop: "{{ restic_backup_credentials }}"
  loop_control:
    label: "{{ item.name }}"
  when: not (item.enabled | bool)
  become: true

- name: Remove legacy plaintext and tmpfs secret files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ restic_backup_legacy_secret_paths }}"
  become: true

- name: Deploy restic common backup environment file
  ansible.builtin.template:
    src: backup.env.j2
    dest: "{{ restic_backup_config_dir }}/backup.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  become: true

- name: Deploy primary restic backup environment file
  ansible.builtin.template:
    src: primary.env.j2
    dest: "{{ restic_backup_config_dir }}/primary.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  become: true

- name: Deploy restic backup exclusion patterns
  ansible.builtin.template:
    src: excludes.txt.j2
    dest: "{{ restic_backup_config_dir }}/excludes.txt"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Deploy restic backup runner script
  ansible.builtin.template:
    src: restic-backup-runner.sh.j2
    dest: "{{ restic_backup_runner_script_path }}"
    owner: root
    group: root
    mode: "0750"
    validate: bash -n %s
  become: true

- name: Deploy restic backup failure systemd service unit
  ansible.builtin.template:
    src: restic-backup-failure.service.j2
    dest: /etc/systemd/system/restic-backup-failure@.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for restic_backup units
  become: true

- name: Deploy restic backup systemd service unit
  ansible.builtin.template:
    src: restic-backup.service.j2
    dest: /etc/systemd/system/restic-backup.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for restic_backup units
  become: true

- name: Deploy restic backup systemd timer unit
  ansible.builtin.template:
    src: restic-backup.timer.j2
    dest: /etc/systemd/system/restic-backup.timer
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for restic_backup units
    - Restart restic backup timer for restic_backup
  become: true

- name: Flush handlers to ensure systemd is reloaded
  ansible.builtin.meta: flush_handlers

- name: Ensure restic-backup timer is enabled and started
  ansible.builtin.systemd:
    name: restic-backup.timer
    enabled: true
    state: started
  become: true
