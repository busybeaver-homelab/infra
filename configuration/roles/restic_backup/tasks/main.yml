---
# Tasks for restic_backup role

- name: Validate restic_backup role arguments
  ansible.builtin.validate_argument_spec:
    argument_spec: "{{ (lookup('ansible.builtin.file', role_path ~ '/meta/argument_specs.yml') | from_yaml).argument_specs.main.options }}"

- name: Install restic and curl packages
  ansible.builtin.apt:
    name:
      - restic
      - curl
    state: present
    update_cache: false
  become: true

- name: Create restic configuration and state directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ restic_backup_config_dir }}", mode: "0700" }
    - { path: "{{ restic_backup_config_dir }}/hooks.d", mode: "0750" }
    - { path: "{{ restic_backup_config_dir }}/hooks.d/pre.d", mode: "0750" }
    - { path: "{{ restic_backup_config_dir }}/hooks.d/post.d", mode: "0750" }
    - { path: "{{ restic_backup_cache_dir }}", mode: "0700" }
    - { path: "{{ restic_backup_log_dir }}", mode: "0750" }
    - { path: "{{ restic_backup_secrets_dir }}", mode: "0700" }
    - { path: "/opt/containers", mode: "0755" }
  become: true

- name: Deploy restic backup password file
  ansible.builtin.template:
    src: password.j2
    dest: "{{ restic_backup_password_file_path }}"
    owner: root
    group: root
    mode: "0400"
  no_log: true
  diff: false
  become: true

- name: Deploy secondary restic backup password file
  ansible.builtin.template:
    src: password-secondary.j2
    dest: "{{ restic_backup_secondary_password_file_path }}"
    owner: root
    group: root
    mode: "0400"
  no_log: true
  diff: false
  when: restic_backup_secondary_enabled | bool
  become: true

- name: Remove secondary restic backup password file when disabled
  ansible.builtin.file:
    path: "{{ restic_backup_secondary_password_file_path }}"
    state: absent
  when: not (restic_backup_secondary_enabled | bool)
  become: true

- name: Deploy primary S3 secret access key file
  ansible.builtin.copy:
    content: "{{ restic_backup_s3_secret_key }}\n"
    dest: "{{ restic_backup_secrets_dir }}/oci_s3_secret_key"
    owner: root
    group: root
    mode: "0400"
  no_log: true
  diff: false
  when: restic_backup_s3_secret_key | default('') | length > 0
  become: true

- name: Remove primary S3 secret access key file when unset
  ansible.builtin.file:
    path: "{{ restic_backup_secrets_dir }}/oci_s3_secret_key"
    state: absent
  when: not (restic_backup_s3_secret_key | default('') | length > 0)
  become: true

- name: Deploy secondary S3 secret access key file
  ansible.builtin.copy:
    content: "{{ restic_backup_secondary_s3_secret_key }}\n"
    dest: "{{ restic_backup_secrets_dir }}/cloudflare_s3_secret_key"
    owner: root
    group: root
    mode: "0400"
  no_log: true
  diff: false
  when:
    - restic_backup_secondary_enabled | bool
    - restic_backup_secondary_s3_secret_key | default('') | length > 0
  become: true

- name: Remove secondary S3 secret access key file when disabled or unset
  ansible.builtin.file:
    path: "{{ restic_backup_secrets_dir }}/cloudflare_s3_secret_key"
    state: absent
  when: >-
    not (restic_backup_secondary_enabled | bool) or
    not (restic_backup_secondary_s3_secret_key | default('') | length > 0)
  become: true

- name: Deploy healthchecks ping URL file
  ansible.builtin.copy:
    content: "{{ (restic_backup_healthchecks_ping_url | default('')) ~ ('\n' if (restic_backup_healthchecks_ping_url | default('') | length > 0) else '') }}"
    dest: "{{ restic_backup_secrets_dir }}/healthchecks_ping_url"
    owner: root
    group: root
    mode: "0400"
  no_log: true
  diff: false
  become: true

- name: Clean up legacy persistent disk password files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ restic_backup_config_dir }}/password"
    - "{{ restic_backup_config_dir }}/password-secondary"
  when: restic_backup_password_file_path != (restic_backup_config_dir ~ '/password')
  become: true

- name: Deploy restic common backup environment file
  ansible.builtin.template:
    src: backup.env.j2
    dest: "{{ restic_backup_config_dir }}/backup.env"
    owner: root
    group: root
    mode: "0600"
  become: true

- name: Deploy primary restic backup environment file
  ansible.builtin.template:
    src: primary.env.j2
    dest: "{{ restic_backup_config_dir }}/primary.env"
    owner: root
    group: root
    mode: "0600"
  become: true

- name: Deploy secondary restic backup environment file
  ansible.builtin.template:
    src: secondary.env.j2
    dest: "{{ restic_backup_config_dir }}/secondary.env"
    owner: root
    group: root
    mode: "0600"
  when: restic_backup_secondary_enabled | bool
  become: true

- name: Remove secondary restic backup environment file when disabled
  ansible.builtin.file:
    path: "{{ restic_backup_config_dir }}/secondary.env"
    state: absent
  when: not (restic_backup_secondary_enabled | bool)
  become: true

- name: Deploy restic backup exclusion patterns
  ansible.builtin.template:
    src: excludes.txt.j2
    dest: "{{ restic_backup_config_dir }}/excludes.txt"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Deploy restic backup runner script
  ansible.builtin.template:
    src: restic-backup-runner.sh.j2
    dest: "{{ restic_backup_runner_script_path }}"
    owner: root
    group: root
    mode: "0750"
  become: true

- name: Deploy restic backup failure systemd service unit
  ansible.builtin.template:
    src: restic-backup-failure.service.j2
    dest: /etc/systemd/system/restic-backup-failure@.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd daemon
  become: true

- name: Deploy restic backup systemd service unit
  ansible.builtin.template:
    src: restic-backup.service.j2
    dest: /etc/systemd/system/restic-backup.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd daemon
  become: true

- name: Deploy restic backup systemd timer unit
  ansible.builtin.template:
    src: restic-backup.timer.j2
    dest: /etc/systemd/system/restic-backup.timer
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd daemon
    - Restart restic backup timer
  become: true

- name: Flush handlers to ensure systemd is reloaded
  ansible.builtin.meta: flush_handlers

- name: Ensure restic-backup timer is enabled and started
  ansible.builtin.systemd:
    name: restic-backup.timer
    enabled: true
    state: started
  become: true
