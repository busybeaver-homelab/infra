---
# Defaults for docker_compose_service role

# Master feature toggle (disabled by default until upstream signed releases exist)
docker_compose_service_enabled: false

# Whether this role writes /etc/docker/daemon.json directly.
# Set to false on cloud hosts where geerlingguy.docker manages daemon.json via docker_daemon_options;
# set to true on homelab hosts where geerlingguy.docker does not run.
docker_compose_service_manage_daemon_json: false

# Whether macvlan/ipvlan networks and mac_address settings are permitted in the compose manifest.
# False on cloud targets (bridge-only); true only on homelab hosts.
docker_compose_service_allow_macvlan: false

# SOPS-backed host-to-target list and per-target interpolation maps (design §2.3)
docker_compose_service_hosts: "{{ (compose | default({})).hosts | default([]) }}"
docker_compose_service_targets: "{{ (compose | default({})).targets | default({}) }}"

# Optional explicit overrides (resolved automatically from docker_compose_service_hosts/targets when empty)
docker_compose_service_target: ""
docker_compose_service_env: {}
docker_compose_service_healthchecks_ping_url: ""

# Reconciler runtime settings
docker_compose_service_project_name: "homelab"
docker_compose_service_wait_timeout: 180
docker_compose_service_keep_releases: 5
docker_compose_service_release_api_url: "https://api.github.com/repos/busybeaver/homelab-services/releases/latest"
docker_compose_service_curl_proto: "=https"

# Pinned Sigstore cosign v3 release and per-architecture SHA-256 checksums
# renovate: datasource=github-releases depName=sigstore/cosign
docker_compose_service_cosign_version: "v3.1.3"
docker_compose_service_cosign_sha256:
  x86_64: "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71"
  aarch64: "c5d324e091826b0d7a78eb16fef316450b4eb9aaec045611c08ba06f5e73220a"

# Cosign binary and public key paths
docker_compose_service_cosign_bin: "/usr/local/bin/cosign"
docker_compose_service_cosign_public_key_path: "/etc/containers/cosign.pub"
docker_compose_service_cosign_public_key_src: "cosign.pub"
docker_compose_service_cosign_public_key_remote_src: false
docker_compose_service_cosign_next_public_key_path: "/etc/containers/cosign-next.pub"
docker_compose_service_cosign_next_public_key: ""

# Host filesystem paths
docker_compose_service_env_file_path: "/etc/default/homelab-compose"
docker_compose_service_credstore_dir: "/etc/credstore.encrypted"
docker_compose_service_credential_key: "host"
docker_compose_service_base_dir: "/opt/containers"
docker_compose_service_state_dir: "/var/lib/homelab-compose"
docker_compose_service_libexec_dir: "/usr/local/libexec"
docker_compose_service_daemon_json_path: "/etc/docker/daemon.json"

# Systemd timer schedules
docker_compose_service_reconcile_calendar: "*:0/15"
docker_compose_service_reconcile_randomized_delay_sec: "3m"
docker_compose_service_cleanup_calendar: "Sun *-*-* 03:30:00"
docker_compose_service_cleanup_randomized_delay_sec: "30m"
