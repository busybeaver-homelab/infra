---
- name: Verify
  hosts: all
  gather_facts: true
  become: true
  vars:
    docker_compose_service_test_secret_token: >-
      {{
        lookup(
          'ansible.builtin.password',
          lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') ~ '/app_secret_token',
          length=24,
          chars=['ascii_letters', 'digits']
        )
      }}
    docker_compose_service_test_credstore: /etc/credstore.encrypted
    docker_compose_service_test_stub_log: /tmp/hc-stub/requests.log
    docker_compose_service_test_ping_url: "http://127.0.0.1:18080/molecule-compose-check"
    docker_compose_service_test_fixtures_dir: /tmp/molecule-fixtures
    docker_compose_service_test_state_dir: /var/lib/homelab-compose
    docker_compose_service_test_base_env:
      APP_MARKER: "molecule-healthy-v1"
      APP_SECRET_TOKEN: "{{ docker_compose_service_test_secret_token }}"
      SERVICE_DOMAIN: "app.example.test"
    # Role inputs shared with converge.yml, so that include_role below re-applies the same host settings.
    docker_compose_service_enabled: true
    docker_compose_service_manage_daemon_json: true
    docker_compose_service_release_api_url: "http://127.0.0.1:18081/repos/busybeaver-homelab/services/releases/latest"
    docker_compose_service_curl_proto: "=http,https"
    docker_compose_service_cosign_public_key_src: "/tmp/molecule-fixtures/keys/cosign.pub"
    docker_compose_service_cosign_public_key_remote_src: true
    docker_compose_service_targets:
      gcp:
        env: "{{ docker_compose_service_test_base_env }}"
    docker_compose_service_healthchecks_ping_url: "{{ docker_compose_service_test_ping_url }}"
    docker_compose_service_hosts:
      - host: "{{ inventory_hostname }}"
        target: gcp
  tasks:
    # --- 1. Docker daemon.json & Cosign binary/key verification ---------------------

    - name: Stat /etc/docker/daemon.json
      ansible.builtin.stat:
        path: /etc/docker/daemon.json
      register: docker_compose_service_daemon_stat

    - name: Read /etc/docker/daemon.json
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: docker_compose_service_daemon_content

    - name: Parse /etc/docker/daemon.json
      ansible.builtin.set_fact:
        docker_compose_service_daemon_parsed: "{{ docker_compose_service_daemon_content.content | b64decode | from_json }}"

    - name: Assert /etc/docker/daemon.json permissions and log rotation settings
      ansible.builtin.assert:
        that:
          - docker_compose_service_daemon_stat.stat.exists
          - docker_compose_service_daemon_stat.stat.mode == '0644'
          - docker_compose_service_daemon_stat.stat.pw_name == 'root'
          - docker_compose_service_daemon_stat.stat.gr_name == 'root'
          - docker_compose_service_daemon_parsed['log-driver'] == 'json-file'
          - docker_compose_service_daemon_parsed['log-opts']['max-size'] == '10m'
          - docker_compose_service_daemon_parsed['log-opts']['max-file'] == '3'
          - docker_compose_service_daemon_parsed['live-restore'] == true

    - name: Stat /etc/containers/cosign.pub and /usr/local/bin/cosign
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/containers/cosign.pub
        - /usr/local/bin/cosign
      register: docker_compose_service_cosign_stats

    - name: Assert cosign public key and binary permissions
      ansible.builtin.assert:
        that:
          - docker_compose_service_cosign_stats.results[0].stat.exists
          - docker_compose_service_cosign_stats.results[0].stat.mode == '0444'
          - docker_compose_service_cosign_stats.results[0].stat.pw_name == 'root'
          - docker_compose_service_cosign_stats.results[1].stat.exists
          - docker_compose_service_cosign_stats.results[1].stat.mode == '0755'
          - docker_compose_service_cosign_stats.results[1].stat.pw_name == 'root'

    - name: Check installed cosign version
      ansible.builtin.command:
        argv:
          - /usr/local/bin/cosign
          - version
      register: docker_compose_service_cosign_version_out
      changed_when: false

    - name: Assert cosign version matches pinned release
      ansible.builtin.assert:
        that:
          - "'v3.1.3' in docker_compose_service_cosign_version_out.stdout"

    # --- 2. Non-secret environment file & systemd encrypted credentials -------------

    - name: Stat /etc/default/homelab-compose
      ansible.builtin.stat:
        path: /etc/default/homelab-compose
      register: docker_compose_service_env_stat

    - name: Read /etc/default/homelab-compose
      ansible.builtin.slurp:
        src: /etc/default/homelab-compose
      register: docker_compose_service_env_content

    - name: Assert /etc/default/homelab-compose permissions and absence of secrets
      ansible.builtin.assert:
        that:
          - docker_compose_service_env_stat.stat.exists
          - docker_compose_service_env_stat.stat.mode == '0644'
          - docker_compose_service_env_stat.stat.pw_name == 'root'
          - "'COMPOSE_TARGET=' in (docker_compose_service_env_content.content | b64decode)"
          - "'APP_SECRET_TOKEN' not in (docker_compose_service_env_content.content | b64decode)"
          - "'molecule-compose-check' not in (docker_compose_service_env_content.content | b64decode)"

    - name: Stat encrypted credential store and credential files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ docker_compose_service_test_credstore }}"
        - "{{ docker_compose_service_test_credstore }}/homelab_compose_env"
        - "{{ docker_compose_service_test_credstore }}/compose_healthchecks_ping_url"
        - "{{ docker_compose_service_test_credstore }}/homelab_compose_env.staged"
        - "{{ docker_compose_service_test_credstore }}/homelab_compose_env.previous"
      register: docker_compose_service_cred_stats

    - name: Assert encrypted credential store and file permissions
      ansible.builtin.assert:
        that:
          - docker_compose_service_cred_stats.results[0].stat.isdir
          - docker_compose_service_cred_stats.results[0].stat.mode == '0700'
          - docker_compose_service_cred_stats.results[1].stat.exists
          - docker_compose_service_cred_stats.results[1].stat.mode == '0400'
          - docker_compose_service_cred_stats.results[2].stat.exists
          - docker_compose_service_cred_stats.results[2].stat.mode == '0400'
          - docker_compose_service_cred_stats.results[3].stat.exists
          - docker_compose_service_cred_stats.results[3].stat.mode == '0400'
          - not docker_compose_service_cred_stats.results[4].stat.exists

    - name: Read encrypted homelab_compose_env ciphertext
      ansible.builtin.slurp:
        src: "{{ docker_compose_service_test_credstore }}/homelab_compose_env"
      register: docker_compose_service_env_ciphertext

    - name: Assert secret token is not stored in plaintext in credstore
      ansible.builtin.assert:
        that:
          - docker_compose_service_test_secret_token not in (docker_compose_service_env_ciphertext.content | b64decode)
        quiet: true

    - name: Decrypt homelab_compose_env credential with host key
      ansible.builtin.command:
        argv:
          - systemd-creds
          - decrypt
          - --name=homelab_compose_env
          - "{{ docker_compose_service_test_credstore }}/homelab_compose_env"
          - "-"
      register: docker_compose_service_env_decrypted
      changed_when: false
      no_log: true

    - name: Decrypt compose_healthchecks_ping_url credential with host key
      ansible.builtin.command:
        argv:
          - systemd-creds
          - decrypt
          - "{{ docker_compose_service_test_credstore }}/compose_healthchecks_ping_url"
          - "-"
      register: docker_compose_service_ping_decrypted
      changed_when: false
      no_log: true

    - name: Assert decrypted credentials match expected synthetic inputs
      ansible.builtin.assert:
        that:
          - "'APP_MARKER=' in docker_compose_service_env_decrypted.stdout"
          - "docker_compose_service_test_secret_token in docker_compose_service_env_decrypted.stdout"
          - "docker_compose_service_ping_decrypted.stdout == docker_compose_service_test_ping_url"
        quiet: true

    - name: Decrypt the staged homelab_compose_env credential under the active credential name
      ansible.builtin.command:
        argv:
          - systemd-creds
          - decrypt
          - --name=homelab_compose_env
          - "{{ docker_compose_service_test_credstore }}/homelab_compose_env.staged"
          - "-"
      register: docker_compose_service_staged_decrypted
      changed_when: false
      no_log: true

    - name: Assert the staged and active settings are identical after a converge
      ansible.builtin.assert:
        that:
          - docker_compose_service_staged_decrypted.stdout == docker_compose_service_env_decrypted.stdout
        quiet: true

    # --- 3. Systemd units & timers verification -------------------------------------

    - name: Verify systemd unit files with systemd-analyze verify
      ansible.builtin.command:
        argv:
          - systemd-analyze
          - verify
          - /etc/systemd/system/homelab-compose-check.service
          - /etc/systemd/system/homelab-compose-reconcile.service
          - /etc/systemd/system/homelab-compose-reconcile.timer
          - /etc/systemd/system/homelab-compose-failure@.service
          - /etc/systemd/system/homelab-docker-cleanup.service
          - /etc/systemd/system/homelab-docker-cleanup.timer
      changed_when: false

    - name: Read the failure hook of the non-paging check unit
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - homelab-compose-check.service
          - --property=OnFailure
      register: docker_compose_service_check_unit_props
      changed_when: false

    - name: Read the check unit definition
      ansible.builtin.command:
        argv:
          - systemctl
          - cat
          - homelab-compose-check.service
      register: docker_compose_service_check_unit_cat
      changed_when: false

    - name: Assert the check unit never pages and reads only the staged credential
      ansible.builtin.assert:
        that:
          - docker_compose_service_check_unit_props.stdout_lines == ['OnFailure=']
          - "'LoadCredentialEncrypted=homelab_compose_env:/etc/credstore.encrypted/homelab_compose_env.staged' in docker_compose_service_check_unit_cat.stdout"

    # --- 4. Steady state after the staged converge (first deploy already happened) --

    - name: Read timer enablement after the staged converge
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - homelab-compose-reconcile.timer
          - homelab-docker-cleanup.timer
      register: docker_compose_service_converge_timers
      changed_when: false

    # The reconcile timer (*:0/15, Persistent=true) is enabled and would fire during the cases
    # below. Stop it so only the explicit starts of this play run the reconciler. Each include_role
    # starts the timers again (the role does that on every run); the cases that depend on it stop
    # it once more, and section 10 asserts the timers are enabled and started after a re-enable.
    - name: Stop the reconcile timer so it cannot race the explicit reconciler starts below
      ansible.builtin.command:
        argv:
          - systemctl
          - stop
          - homelab-compose-reconcile.timer
      changed_when: true

    - name: Stat /opt/containers/current symlink and the redeploy marker after converge
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /opt/containers/current
        - "{{ docker_compose_service_test_state_dir }}/redeploy-requested"
      register: docker_compose_service_current_stat

    - name: Read Healthchecks stub log written by the first deploy during converge
      ansible.builtin.slurp:
        src: "{{ docker_compose_service_test_stub_log }}"
      register: docker_compose_service_stub_after_first_deploy

    - name: Assert converge deployed v2026.10.16-1 and pinged success, and enabled the timers
      ansible.builtin.assert:
        that:
          - docker_compose_service_converge_timers.stdout_lines == ['enabled', 'enabled']
          - docker_compose_service_current_stat.results[0].stat.islnk
          - docker_compose_service_current_stat.results[0].stat.lnk_source == '/opt/containers/releases/v2026.10.16-1'
          - not docker_compose_service_current_stat.results[1].stat.exists
          - "'POST /molecule-compose-check\n' in (docker_compose_service_stub_after_first_deploy.content | b64decode)"

    - name: Snapshot reconcile start time and credential and unit mtimes before an unchanged re-run
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - homelab-compose-reconcile.service
          - --property=ExecMainStartTimestamp
          - --property=InvocationID
      register: docker_compose_service_unchanged_before
      changed_when: false

    - name: Stat credential slots and unit files before an unchanged re-run
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ docker_compose_service_test_credstore }}/homelab_compose_env"
        - "{{ docker_compose_service_test_credstore }}/homelab_compose_env.staged"
        - "{{ docker_compose_service_test_credstore }}/compose_healthchecks_ping_url"
        - /etc/systemd/system/homelab-compose-check.service
        - /etc/systemd/system/homelab-compose-reconcile.service
      register: docker_compose_service_unchanged_stats_before

    - name: Re-apply the role with unchanged settings
      ansible.builtin.include_role:
        name: docker_compose_service

    - name: Read reconcile start time after an unchanged re-run
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - homelab-compose-reconcile.service
          - --property=ExecMainStartTimestamp
          - --property=InvocationID
      register: docker_compose_service_unchanged_after
      changed_when: false

    - name: Stat credential slots and unit files after an unchanged re-run
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ docker_compose_service_test_credstore }}/homelab_compose_env"
        - "{{ docker_compose_service_test_credstore }}/homelab_compose_env.staged"
        - "{{ docker_compose_service_test_credstore }}/compose_healthchecks_ping_url"
        - /etc/systemd/system/homelab-compose-check.service
        - /etc/systemd/system/homelab-compose-reconcile.service
      register: docker_compose_service_unchanged_stats_after

    - name: Assert an unchanged re-run neither redeployed nor rewrote credentials or units
      ansible.builtin.assert:
        that:
          - docker_compose_service_unchanged_after.stdout == docker_compose_service_unchanged_before.stdout
          - >-
            docker_compose_service_unchanged_stats_after.results | map(attribute='stat.mtime') | list
            == docker_compose_service_unchanged_stats_before.results | map(attribute='stat.mtime') | list

    - name: Reset Healthchecks stub log before the steady-state reconcile
      ansible.builtin.copy:
        dest: "{{ docker_compose_service_test_stub_log }}"
        content: ""
        owner: root
        group: root
        mode: "0644"

    - name: Start homelab-compose-reconcile.service for the already deployed release v2026.10.16-1
      ansible.builtin.systemd_service:
        name: homelab-compose-reconcile.service
        state: started

    - name: Read Healthchecks stub log after the steady-state reconcile
      ansible.builtin.slurp:
        src: "{{ docker_compose_service_test_stub_log }}"
      register: docker_compose_service_stub_after_success

    - name: Assert the steady-state reconcile sent a heartbeat
      ansible.builtin.assert:
        that:
          - "'POST /molecule-compose-check\n' in (docker_compose_service_stub_after_success.content | b64decode)"

    # --- 4b. Changed settings are applied by a redeploy of the current release ------

    - name: Re-apply the role with a changed APP_MARKER
      ansible.builtin.include_role:
        name: docker_compose_service
      vars:
        docker_compose_service_targets:
          gcp:
            env: "{{ docker_compose_service_test_base_env | combine({'APP_MARKER': 'molecule-healthy-v2'}) }}"

    - name: List Compose project containers after the settings redeploy
      ansible.builtin.command:
        argv:
          - docker
          - ps
          - --quiet
          - --filter
          - label=com.docker.compose.project=homelab
      register: docker_compose_service_redeploy_ids
      changed_when: false

    - name: Inspect Compose project containers after the settings redeploy
      ansible.builtin.command:
        argv: "{{ ['docker', 'inspect'] + docker_compose_service_redeploy_ids.stdout_lines }}"
      register: docker_compose_service_redeploy_inspect
      changed_when: false

    - name: Stat previous slot, redeploy marker, quarantine marker and current after the settings redeploy
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ docker_compose_service_test_credstore }}/homelab_compose_env.previous"
        - "{{ docker_compose_service_test_state_dir }}/redeploy-requested"
        - "{{ docker_compose_service_test_state_dir }}/quarantined-release"
        - /opt/containers/current
      register: docker_compose_service_redeploy_stats

    - name: Assert the stack runs with the new marker and nothing is left over or quarantined
      ansible.builtin.assert:
        that:
          - docker_compose_service_redeploy_ids.stdout_lines | length == 1
          - "'APP_MARKER=molecule-healthy-v2' in (docker_compose_service_redeploy_inspect.stdout | from_json | map(attribute='Config.Env') | flatten)"
          - (docker_compose_service_redeploy_inspect.stdout | from_json | map(attribute='State.Health.Status') | list) == ['healthy']
          - not docker_compose_service_redeploy_stats.results[0].stat.exists
          - not docker_compose_service_redeploy_stats.results[1].stat.exists
          - not docker_compose_service_redeploy_stats.results[2].stat.exists
          - docker_compose_service_redeploy_stats.results[3].stat.lnk_source == '/opt/containers/releases/v2026.10.16-1'

    # --- 4b2. A reconciler run in flight on the old credential cannot swallow the redeploy --

    - name: Stop the reconcile timer again after the role restarted it
      ansible.builtin.command:
        argv:
          - systemctl
          - stop
          - homelab-compose-reconcile.timer
      changed_when: true

    # Right after the check unit of the role run below finished, take the reconciler lock for 12 seconds
    # and start the reconciler without blocking: it loads the OLD active credential and waits for the
    # lock, so it is still in flight (and has not looked for a redeploy marker yet) while the role
    # promotes the new settings. A role that wrote the marker and started the unit without waiting
    # for it to be idle would have the old-credential run consume the marker with the old settings.
    - name: Start an old-credential reconciler run behind the lock once the role check is done
      ansible.builtin.shell: |
        n=0
        until [ "$(systemctl show homelab-compose-check.service --property=ActiveState --value)" = activating ] || [ "$n" -ge 1200 ]; do
          sleep 0.2; n=$((n+1))
        done
        n=0
        while [ "$(systemctl show homelab-compose-check.service --property=ActiveState --value)" = activating ] && [ "$n" -lt 1200 ]; do
          sleep 0.1; n=$((n+1))
        done
        flock {{ docker_compose_service_test_state_dir }}/lock sleep 12 &
        holder=$!
        n=0
        until ! flock --nonblock {{ docker_compose_service_test_state_dir }}/lock true || [ "$n" -ge 100 ]; do
          sleep 0.1; n=$((n+1))
        done
        systemctl start --no-block homelab-compose-reconcile.service
        wait "$holder"
      async: 300
      poll: 0
      register: docker_compose_service_race_trigger
      changed_when: false

    - name: Re-apply the role with a changed APP_MARKER while an old-credential run is in flight
      ansible.builtin.include_role:
        name: docker_compose_service
      vars:
        docker_compose_service_targets:
          gcp:
            env: "{{ docker_compose_service_test_base_env | combine({'APP_MARKER': 'molecule-healthy-v3'}) }}"

    - name: Wait for the lock holder and the old-credential trigger to finish
      ansible.builtin.async_status:
        jid: "{{ docker_compose_service_race_trigger.ansible_job_id }}"
      register: docker_compose_service_race_job
      until: docker_compose_service_race_job.finished
      retries: 60
      delay: 2

    - name: Inspect Compose project containers after the redeploy that raced an in-flight run
      ansible.builtin.command:
        argv:
          - sh
          - -c
          - docker inspect $(docker ps --quiet --filter label=com.docker.compose.project=homelab)
      register: docker_compose_service_race_inspect
      changed_when: false

    - name: Stat previous slot and redeploy marker after the raced redeploy
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ docker_compose_service_test_credstore }}/homelab_compose_env.previous"
        - "{{ docker_compose_service_test_state_dir }}/redeploy-requested"
      register: docker_compose_service_race_stats

    - name: Assert the new settings are running and nothing is left over
      ansible.builtin.assert:
        that:
          - "'APP_MARKER=molecule-healthy-v3' in (docker_compose_service_race_inspect.stdout | from_json | map(attribute='Config.Env') | flatten)"
          - "'APP_MARKER=molecule-healthy-v2' not in (docker_compose_service_race_inspect.stdout | from_json | map(attribute='Config.Env') | flatten)"
          - (docker_compose_service_race_inspect.stdout | from_json | map(attribute='State.Health.Status') | list) == ['healthy']
          - not docker_compose_service_race_stats.results[0].stat.exists
          - not docker_compose_service_race_stats.results[1].stat.exists

    # --- 4b3. A leftover previous slot (unfinished apply) forces the redeploy ---------

    - name: Read the reconciler invocation before the pending-apply re-run
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - homelab-compose-reconcile.service
          - --property=InvocationID
          - --value
      register: docker_compose_service_pending_before
      changed_when: false

    - name: Simulate a run that died after the promotion by leaving a previous slot without a marker
      ansible.builtin.copy:
        src: "{{ docker_compose_service_test_credstore }}/homelab_compose_env"
        dest: "{{ docker_compose_service_test_credstore }}/homelab_compose_env.previous"
        remote_src: true
        owner: root
        group: root
        mode: "0400"
      no_log: true
      diff: false

    - name: Re-run the role with the same settings that are already active
      ansible.builtin.include_role:
        name: docker_compose_service
      vars:
        docker_compose_service_targets:
          gcp:
            env: "{{ docker_compose_service_test_base_env | combine({'APP_MARKER': 'molecule-healthy-v3'}) }}"

    - name: Read the reconciler invocation after the pending-apply re-run
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - homelab-compose-reconcile.service
          - --property=InvocationID
          - --value
      register: docker_compose_service_pending_after
      changed_when: false

    - name: Inspect Compose project containers after the pending-apply re-run
      ansible.builtin.command:
        argv:
          - sh
          - -c
          - docker inspect $(docker ps --quiet --filter label=com.docker.compose.project=homelab)
      register: docker_compose_service_pending_inspect
      changed_when: false

    - name: Stat previous slot and redeploy marker after the pending-apply re-run
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ docker_compose_service_test_credstore }}/homelab_compose_env.previous"
        - "{{ docker_compose_service_test_state_dir }}/redeploy-requested"
      register: docker_compose_service_pending_stats

    - name: Assert the leftover previous slot triggered a redeploy and was removed
      ansible.builtin.assert:
        that:
          - docker_compose_service_pending_after.stdout != docker_compose_service_pending_before.stdout
          - "'APP_MARKER=molecule-healthy-v3' in (docker_compose_service_pending_inspect.stdout | from_json | map(attribute='Config.Env') | flatten)"
          - (docker_compose_service_pending_inspect.stdout | from_json | map(attribute='State.Health.Status') | list) == ['healthy']
          - not docker_compose_service_pending_stats.results[0].stat.exists
          - not docker_compose_service_pending_stats.results[1].stat.exists

    - name: Restore the molecule-healthy-v2 settings that the following cases build on
      ansible.builtin.include_role:
        name: docker_compose_service
      vars:
        docker_compose_service_targets:
          gcp:
            env: "{{ docker_compose_service_test_base_env | combine({'APP_MARKER': 'molecule-healthy-v2'}) }}"

    # --- 4c. Settings that make the stack unhealthy are rolled back ------------------

    - name: Reset Healthchecks stub log before the failing settings redeploy
      ansible.builtin.copy:
        dest: "{{ docker_compose_service_test_stub_log }}"
        content: ""
        owner: root
        group: root
        mode: "0644"

    - name: Re-apply the role with settings that fail the stack health check
      block:
        - name: Include role with the unhealthy sentinel APP_MARKER
          ansible.builtin.include_role:
            name: docker_compose_service
          vars:
            docker_compose_service_targets:
              gcp:
                env: "{{ docker_compose_service_test_base_env | combine({'APP_MARKER': 'molecule-unhealthy'}) }}"

        - name: Record that the unhealthy settings were wrongly accepted
          ansible.builtin.set_fact:
            docker_compose_service_unhealthy_accepted: true
      rescue:
        - name: Capture the failure message of the unhealthy settings redeploy
          ansible.builtin.set_fact:
            docker_compose_service_unhealthy_msg: "{{ ansible_failed_result.msg | default('') }}"
            docker_compose_service_unhealthy_accepted: false

    - name: Decrypt the active credential after the failed redeploy
      ansible.builtin.command:
        argv:
          - systemd-creds
          - decrypt
          - --name=homelab_compose_env
          - "{{ docker_compose_service_test_credstore }}/homelab_compose_env"
          - "-"
      register: docker_compose_service_restored_env
      changed_when: false
      no_log: true

    - name: List and inspect Compose project containers after the failed redeploy
      ansible.builtin.command:
        argv:
          - sh
          - -c
          - docker inspect $(docker ps --quiet --filter label=com.docker.compose.project=homelab)
      register: docker_compose_service_restored_inspect
      changed_when: false

    - name: Wait for the OnFailure unit to record the /fail ping of the failed redeploy
      ansible.builtin.wait_for:
        path: "{{ docker_compose_service_test_stub_log }}"
        search_regex: "POST /molecule-compose-check/fail"
        timeout: 15

    - name: Assert the failed redeploy was rolled back without leaking settings
      ansible.builtin.assert:
        that:
          - not docker_compose_service_unhealthy_accepted
          - "'homelab-compose-reconcile.service' in docker_compose_service_unhealthy_msg"
          - "'journalctl -u homelab-compose-reconcile.service' in docker_compose_service_unhealthy_msg"
          - "'restore' in (docker_compose_service_unhealthy_msg | lower)"
          - "'healthy' in (docker_compose_service_unhealthy_msg | lower)"
          - docker_compose_service_test_secret_token not in docker_compose_service_unhealthy_msg
          - "'APP_MARKER=molecule-healthy-v2' in docker_compose_service_restored_env.stdout"
          - "'molecule-unhealthy' not in docker_compose_service_restored_env.stdout"
          - "'APP_MARKER=molecule-healthy-v2' in (docker_compose_service_restored_inspect.stdout | from_json | map(attribute='Config.Env') | flatten)"
          - (docker_compose_service_restored_inspect.stdout | from_json | map(attribute='State.Health.Status') | list) == ['healthy']

    # --- 4d. Settings that fail the release check never reach the active slot -------

    - name: Snapshot the active credential and timer states before a failing check
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - homelab-compose-reconcile.timer
          - homelab-docker-cleanup.timer
      register: docker_compose_service_check_timers_before
      changed_when: false

    - name: Read active credential before a failing check
      ansible.builtin.command:
        argv:
          - systemd-creds
          - decrypt
          - --name=homelab_compose_env
          - "{{ docker_compose_service_test_credstore }}/homelab_compose_env"
          - "-"
      register: docker_compose_service_check_active_before
      changed_when: false
      no_log: true

    - name: Re-apply the role with a staged env that misses the required APP_MARKER
      block:
        - name: Include role with an env lacking a required variable
          ansible.builtin.include_role:
            name: docker_compose_service
          vars:
            docker_compose_service_targets:
              gcp:
                env: "{{ docker_compose_service_test_base_env | dict2items | rejectattr('key', 'equalto', 'APP_MARKER') | items2dict }}"

        - name: Record that the incomplete settings were wrongly accepted
          ansible.builtin.set_fact:
            docker_compose_service_check_accepted: true
      rescue:
        - name: Capture the failure message of the failing check
          ansible.builtin.set_fact:
            docker_compose_service_check_msg: "{{ ansible_failed_result.msg | default('') }}"
            docker_compose_service_check_accepted: false

    - name: Read active credential after a failing check
      ansible.builtin.command:
        argv:
          - systemd-creds
          - decrypt
          - --name=homelab_compose_env
          - "{{ docker_compose_service_test_credstore }}/homelab_compose_env"
          - "-"
      register: docker_compose_service_check_active_after
      changed_when: false
      no_log: true

    - name: Read timer states after a failing check
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - homelab-compose-reconcile.timer
          - homelab-docker-cleanup.timer
      register: docker_compose_service_check_timers_after
      changed_when: false

    - name: Assert the failing check stopped the run before the active slot and timers changed
      ansible.builtin.assert:
        that:
          - not docker_compose_service_check_accepted
          - "'latest release check did not pass' in docker_compose_service_check_msg"
          - "'homelab-compose-check.service' in docker_compose_service_check_msg"
          - "'journalctl -u homelab-compose-check.service' in docker_compose_service_check_msg"
          - docker_compose_service_test_secret_token not in docker_compose_service_check_msg
          - docker_compose_service_check_active_after.stdout == docker_compose_service_check_active_before.stdout
          - docker_compose_service_check_timers_after.stdout == docker_compose_service_check_timers_before.stdout
        quiet: true

    # --- 4e. Stale markers from a killed first deploy do not block the retry --------

    - name: Stop the Compose stack to simulate a host without a successful first deploy
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-name
          - homelab
          - -f
          - /opt/containers/releases/v2026.10.16-1/docker-compose.yaml
          - down
      changed_when: true

    - name: Remove the current symlink and write stale in-flight and quarantine markers
      ansible.builtin.copy:
        dest: "{{ docker_compose_service_test_state_dir }}/{{ item }}"
        content: "v2026.10.16-1\n"
        owner: root
        group: root
        mode: "0600"
      loop:
        - deploying
        - quarantined-release

    - name: Remove the current symlink of the stopped stack
      ansible.builtin.file:
        path: /opt/containers/current
        state: absent

    - name: Re-apply the role so it performs the first-run deploy despite the stale markers
      ansible.builtin.include_role:
        name: docker_compose_service
      vars:
        docker_compose_service_targets:
          gcp:
            env: "{{ docker_compose_service_test_base_env | combine({'APP_MARKER': 'molecule-healthy-v2'}) }}"

    - name: Stat current, markers and previous slot after the retried first deploy
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /opt/containers/current
        - "{{ docker_compose_service_test_state_dir }}/deploying"
        - "{{ docker_compose_service_test_state_dir }}/quarantined-release"
        - "{{ docker_compose_service_test_credstore }}/homelab_compose_env.previous"
      register: docker_compose_service_stale_stats

    - name: Check the stack is healthy after the retried first deploy
      ansible.builtin.command:
        argv:
          - sh
          - -c
          - docker inspect $(docker ps --quiet --filter label=com.docker.compose.project=homelab)
      register: docker_compose_service_stale_inspect
      changed_when: false

    - name: Assert the retried first deploy restored current and cleared the stale markers
      ansible.builtin.assert:
        that:
          - docker_compose_service_stale_stats.results[0].stat.lnk_source == '/opt/containers/releases/v2026.10.16-1'
          - not docker_compose_service_stale_stats.results[1].stat.exists
          - not docker_compose_service_stale_stats.results[2].stat.exists
          - not docker_compose_service_stale_stats.results[3].stat.exists
          - (docker_compose_service_stale_inspect.stdout | from_json | map(attribute='State.Health.Status') | list) == ['healthy']

    # --- 5. End-to-end weekly cleanup under systemd sandbox -------------------------

    - name: Run homelab-docker-cleanup.service via systemd
      ansible.builtin.systemd_service:
        name: homelab-docker-cleanup.service
        state: started

    - name: Read homelab-docker-cleanup.service result
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - homelab-docker-cleanup.service
          - --property=Result
          - --value
      register: docker_compose_service_cleanup_result
      changed_when: false

    - name: Assert weekly cleanup succeeded under systemd sandbox
      ansible.builtin.assert:
        that:
          - docker_compose_service_cleanup_result.stdout == 'success'

    # --- 6. Unhealthy release (v2026.10.16-2): rollback, quarantine, /fail alert ----

    - name: Publish unhealthy release v2026.10.16-2 on mock release server
      ansible.builtin.copy:
        dest: "{{ docker_compose_service_test_fixtures_dir }}/releases/active-tag"
        content: "v2026.10.16-2\n"
        owner: root
        group: root
        mode: "0644"

    - name: Reset Healthchecks stub log before the unhealthy release run
      ansible.builtin.copy:
        dest: "{{ docker_compose_service_test_stub_log }}"
        content: ""
        owner: root
        group: root
        mode: "0644"

    - name: Run reconciler against unhealthy release (expected to fail and roll back)
      ansible.builtin.command:
        argv:
          - systemctl
          - start
          - homelab-compose-reconcile.service
      register: docker_compose_service_unhealthy_run
      failed_when: docker_compose_service_unhealthy_run.rc == 0
      changed_when: true

    - name: Stat /opt/containers/current symlink after rollback
      ansible.builtin.stat:
        path: /opt/containers/current
      register: docker_compose_service_current_after_rollback

    - name: Read /var/lib/homelab-compose/quarantined-release
      ansible.builtin.slurp:
        src: /var/lib/homelab-compose/quarantined-release
      register: docker_compose_service_quarantined_content

    - name: Wait for OnFailure unit to record /fail ping in Healthchecks stub log
      ansible.builtin.wait_for:
        path: "{{ docker_compose_service_test_stub_log }}"
        search_regex: "POST /molecule-compose-check/fail"
        timeout: 15

    - name: Verify rolled-back container is running and healthy
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-name
          - homelab
          - ps
          - --format
          - json
      register: docker_compose_service_rollback_ps
      changed_when: false

    - name: Assert rollback preserved v2026.10.16-1, quarantined v2026.10.16-2, and kept stack healthy
      ansible.builtin.assert:
        that:
          - docker_compose_service_current_after_rollback.stat.islnk
          - docker_compose_service_current_after_rollback.stat.lnk_source == '/opt/containers/releases/v2026.10.16-1'
          - (docker_compose_service_quarantined_content.content | b64decode | trim) == 'v2026.10.16-2'
          - "'healthy' in docker_compose_service_rollback_ps.stdout"

    # --- 7. Negative test: release signed with untrusted key (v2026.10.16-3) --------

    - name: Publish release v2026.10.16-3 signed with untrusted key
      ansible.builtin.copy:
        dest: "{{ docker_compose_service_test_fixtures_dir }}/releases/active-tag"
        content: "v2026.10.16-3\n"
        owner: root
        group: root
        mode: "0644"

    - name: Run reconciler against untrusted-signature release (expected to fail)
      ansible.builtin.command:
        argv:
          - systemctl
          - start
          - homelab-compose-reconcile.service
      register: docker_compose_service_bad_sig_run
      failed_when: docker_compose_service_bad_sig_run.rc == 0
      changed_when: true

    - name: Stat /opt/containers/releases/v2026.10.16-3 and /opt/containers/current
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /opt/containers/releases/v2026.10.16-3
        - /opt/containers/current
      register: docker_compose_service_bad_sig_stats

    - name: Assert untrusted-signature release was rejected without touching current
      ansible.builtin.assert:
        that:
          - not docker_compose_service_bad_sig_stats.results[0].stat.exists
          - docker_compose_service_bad_sig_stats.results[1].stat.lnk_source == '/opt/containers/releases/v2026.10.16-1'

    - name: Restore mock release server to v2026.10.16-1 and remove quarantine file
      ansible.builtin.copy:
        dest: "{{ docker_compose_service_test_fixtures_dir }}/releases/active-tag"
        content: "v2026.10.16-1\n"
        owner: root
        group: root
        mode: "0644"

    - name: Clear quarantined-release file
      ansible.builtin.file:
        path: /var/lib/homelab-compose/quarantined-release
        state: absent

    # --- 8. Reboot simulation: nothing under /run/credentials may be required -------

    - name: Simulate reboot by clearing runtime systemd credentials directory
      ansible.builtin.file:
        path: /run/credentials/homelab-compose-reconcile.service
        state: absent

    - name: Reload systemd daemon after clearing runtime credentials
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Run homelab-compose-reconcile.service after simulated reboot
      ansible.builtin.systemd_service:
        name: homelab-compose-reconcile.service
        state: started

    - name: Read homelab-compose-reconcile.service result after simulated reboot
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - homelab-compose-reconcile.service
          - --property=Result
          - --value
      register: docker_compose_service_reboot_result
      changed_when: false

    - name: Assert reconcile succeeded after simulated reboot using encrypted credstore
      ansible.builtin.assert:
        that:
          - docker_compose_service_reboot_result.stdout == 'success'

    # --- 9. Negative role input assertions (duplicate target & missing host) --------

    - name: Verify role rejects duplicate targets across compose.hosts (STD-AN-62)
      block:
        - name: Include role with duplicate target assignment across two hosts
          ansible.builtin.include_role:
            name: docker_compose_service
          vars:
            docker_compose_service_enabled: true
            docker_compose_service_hosts:
              - host: "{{ inventory_hostname }}"
                target: gcp
              - host: "duplicate-host.example.test"
                target: gcp

        - name: Fail if duplicate target was not rejected
          ansible.builtin.fail:
            msg: "Expected docker_compose_service to fail when two hosts share a target"
      rescue:
        - name: Record expected failure for duplicate target test
          ansible.builtin.assert:
            that:
              - ansible_failed_result is defined

    - name: Verify role rejects missing host entry in compose.hosts (STD-AN-62)
      block:
        - name: Include role with no matching inventory_hostname entry
          ansible.builtin.include_role:
            name: docker_compose_service
          vars:
            docker_compose_service_enabled: true
            docker_compose_service_hosts:
              - host: "other-host.example.test"
                target: gcp

        - name: Fail if missing host entry was not rejected
          ansible.builtin.fail:
            msg: "Expected docker_compose_service to fail when inventory_hostname is absent from compose.hosts"
      rescue:
        - name: Record expected failure for missing host entry test
          ansible.builtin.assert:
            that:
              - ansible_failed_result is defined

    - name: Stat the staged slot before the empty ping URL case
      ansible.builtin.stat:
        path: "{{ docker_compose_service_test_credstore }}/homelab_compose_env.staged"
      register: docker_compose_service_ping_guard_before

    - name: Verify role fails closed on an empty Healthchecks ping URL
      block:
        - name: Include role enabled with an empty ping URL
          ansible.builtin.include_role:
            name: docker_compose_service
          vars:
            docker_compose_service_enabled: true
            docker_compose_service_healthchecks_ping_url: ""

        - name: Record that the empty ping URL was wrongly accepted
          ansible.builtin.set_fact:
            docker_compose_service_ping_guard_accepted: true
      rescue:
        - name: Capture the failure message of the empty ping URL case
          ansible.builtin.set_fact:
            docker_compose_service_ping_guard_msg: "{{ ansible_failed_result.msg | default('') }}"
            docker_compose_service_ping_guard_accepted: false

    - name: Stat the staged slot after the empty ping URL case
      ansible.builtin.stat:
        path: "{{ docker_compose_service_test_credstore }}/homelab_compose_env.staged"
      register: docker_compose_service_ping_guard_after

    - name: Assert the empty ping URL failed closed before any credential was written
      ansible.builtin.assert:
        that:
          - not docker_compose_service_ping_guard_accepted
          - "'infrastructure/monitoring' in docker_compose_service_ping_guard_msg"
          - docker_compose_service_ping_guard_after.stat.mtime == docker_compose_service_ping_guard_before.stat.mtime

    # --- 10. Disablement (STD-AN-29) and re-enablement ------------------------------

    - name: Leave a previous slot and a redeploy marker behind to prove disable removes them
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        remote_src: true
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - src: "{{ docker_compose_service_test_credstore }}/homelab_compose_env.staged"
          dest: "{{ docker_compose_service_test_credstore }}/homelab_compose_env.previous"
          mode: "0400"
        - src: "{{ docker_compose_service_test_credstore }}/homelab_compose_env.staged"
          dest: "{{ docker_compose_service_test_state_dir }}/redeploy-requested"
          mode: "0600"
      loop_control:
        label: "{{ item.dest | basename }}"
      no_log: true

    - name: Apply docker_compose_service with enabled=false
      ansible.builtin.include_role:
        name: docker_compose_service
      vars:
        docker_compose_service_enabled: false

    - name: Stat units, scripts, credential slots and marker that disable removes
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/systemd/system/homelab-compose-check.service
        - /etc/systemd/system/homelab-compose-reconcile.service
        - /etc/systemd/system/homelab-compose-reconcile.timer
        - /etc/systemd/system/homelab-compose-failure@.service
        - /etc/systemd/system/homelab-docker-cleanup.service
        - /etc/systemd/system/homelab-docker-cleanup.timer
        - /usr/local/libexec/homelab-compose-reconcile
        - /usr/local/libexec/homelab-compose-notify
        - /usr/local/libexec/homelab-compose-credential-sync
        - /usr/local/libexec/homelab-docker-cleanup
        - /etc/default/homelab-compose
        - /etc/containers/cosign.pub
        - "{{ docker_compose_service_test_credstore }}/homelab_compose_env"
        - "{{ docker_compose_service_test_credstore }}/compose_healthchecks_ping_url"
        - "{{ docker_compose_service_test_credstore }}/homelab_compose_env.staged"
        - "{{ docker_compose_service_test_credstore }}/homelab_compose_env.previous"
        - "{{ docker_compose_service_test_state_dir }}/redeploy-requested"
      register: docker_compose_service_disable_removed_stats

    - name: Stat release directory and state directory that disable preserves
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /opt/containers/releases/v2026.10.16-1
        - "{{ docker_compose_service_test_state_dir }}"
      register: docker_compose_service_disable_kept_stats

    - name: Check running Compose containers after role disablement
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-name
          - homelab
          - ps
          - --format
          - json
      register: docker_compose_service_disable_ps
      changed_when: false

    - name: Assert units, scripts, credentials and marker are removed while containers and releases remain
      ansible.builtin.assert:
        that:
          - docker_compose_service_disable_removed_stats.results | selectattr('stat.exists') | list | length == 0
          - docker_compose_service_disable_kept_stats.results | selectattr('stat.isdir') | list | length == 2
          - "'running' in docker_compose_service_disable_ps.stdout"

    - name: Re-enable with an env that misses the required APP_MARKER
      block:
        - name: Include role enabled with an env lacking a required variable
          ansible.builtin.include_role:
            name: docker_compose_service
          vars:
            docker_compose_service_enabled: true
            docker_compose_service_targets:
              gcp:
                env: "{{ docker_compose_service_test_base_env | dict2items | rejectattr('key', 'equalto', 'APP_MARKER') | items2dict }}"

        - name: Record that the incomplete settings were wrongly accepted on re-enable
          ansible.builtin.set_fact:
            docker_compose_service_reenable_bad_accepted: true
      rescue:
        - name: Capture the failure message of the failing re-enable
          ansible.builtin.set_fact:
            docker_compose_service_reenable_bad_msg: "{{ ansible_failed_result.msg | default('') }}"
            docker_compose_service_reenable_bad_accepted: false

    - name: Read timer enablement after the failing re-enable
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - homelab-compose-reconcile.timer
          - homelab-docker-cleanup.timer
      register: docker_compose_service_reenable_bad_timers
      changed_when: false
      failed_when: false

    - name: Assert the failing re-enable left the timers disabled
      ansible.builtin.assert:
        that:
          - not docker_compose_service_reenable_bad_accepted
          - "'homelab-compose-check.service' in docker_compose_service_reenable_bad_msg"
          - "'enabled' not in docker_compose_service_reenable_bad_timers.stdout_lines"
          - docker_compose_service_reenable_bad_timers.rc != 0

    - name: Re-enable docker_compose_service and verify restoration
      ansible.builtin.include_role:
        name: docker_compose_service
      vars:
        docker_compose_service_enabled: true

    - name: Stat credential slots, marker and timers after re-enable
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ docker_compose_service_test_credstore }}/homelab_compose_env"
        - "{{ docker_compose_service_test_credstore }}/homelab_compose_env.staged"
        - "{{ docker_compose_service_test_credstore }}/homelab_compose_env.previous"
        - "{{ docker_compose_service_test_state_dir }}/redeploy-requested"
        - /etc/systemd/system/homelab-compose-check.service
        - /opt/containers/current
      register: docker_compose_service_reenable_stats

    - name: Verify timers are enabled and started after re-enable
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      check_mode: true
      loop:
        - homelab-compose-reconcile.timer
        - homelab-docker-cleanup.timer
      register: docker_compose_service_reenable_timer_checks
      failed_when: docker_compose_service_reenable_timer_checks.changed

    - name: Assert re-enable restored the slots without leftovers and kept the deployed release
      ansible.builtin.assert:
        that:
          - docker_compose_service_reenable_stats.results[0].stat.exists
          - docker_compose_service_reenable_stats.results[1].stat.exists
          - not docker_compose_service_reenable_stats.results[2].stat.exists
          - not docker_compose_service_reenable_stats.results[3].stat.exists
          - docker_compose_service_reenable_stats.results[4].stat.exists
          - docker_compose_service_reenable_stats.results[5].stat.lnk_source == '/opt/containers/releases/v2026.10.16-1'

    - name: Verify homelab-compose-reconcile.service succeeds after re-enable
      ansible.builtin.systemd_service:
        name: homelab-compose-reconcile.service
        state: started
