---
# Default variables for base_ubuntu_server role.
# Sensitive values (SSH keys, passwords) are loaded via community.sops vars plugin
# from secrets/credentials.ci.sops.yaml (CI) or secrets/credentials.sops.yaml (prod).

base_ubuntu_server_timezone: "UTC"
base_ubuntu_server_manage_hosts: true

# Firewall settings (UFW & Docker chain isolation)
base_ubuntu_server_firewall_enabled: true
base_ubuntu_server_firewall_default_incoming: "deny"
base_ubuntu_server_firewall_default_outgoing: "allow"
base_ubuntu_server_firewall_allow_tailscale: true
base_ubuntu_server_firewall_tailscale_interface: "tailscale0"
base_ubuntu_server_firewall_external_interface: ""
base_ubuntu_server_firewall_allow_openssh: false
base_ubuntu_server_firewall_docker_isolation: true

# Optional host-alive and disk-space Healthchecks.io ping URL
base_ubuntu_server_healthchecks_ping_url: ""

# SSH daemon state verification
base_ubuntu_server_verify_ssh_running: false
