---
# In-memory secrets delivery via OCI Vault and systemd

- name: Deploy OCI secrets fetcher script
  ansible.builtin.copy:
    src: oci-fetch-secrets.sh
    dest: /usr/local/bin/oci-fetch-secrets.sh
    owner: root
    group: root
    mode: "0750"
  become: true

- name: Configure systemd-tmpfiles for in-memory secrets directory
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/run-secrets.conf
    content: |
      # Managed by Ansible - base_ubuntu_server role
      d {{ base_ubuntu_server_oci_secrets_dest_dir }} 0700 root root -
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Ensure in-memory secrets directory exists with restricted permissions
  ansible.builtin.file:
    path: "{{ base_ubuntu_server_oci_secrets_dest_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true

- name: Deploy oci-secrets-fetch systemd service unit
  ansible.builtin.template:
    src: oci-secrets-fetch.service.j2
    dest: /etc/systemd/system/oci-secrets-fetch.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd daemon

- name: Flush handlers to reload systemd daemon if unit changed
  ansible.builtin.meta: flush_handlers

- name: Manage oci-secrets-fetch systemd service
  ansible.builtin.systemd_service:
    name: oci-secrets-fetch.service
    enabled: "{{ (base_ubuntu_server_oci_secrets_fetch_enabled | default(false)) | bool }}"
    state: "{{ 'started' if ((base_ubuntu_server_oci_secrets_fetch_enabled | default(false)) | bool) else omit }}"
  become: true
  when:
    - (ansible_facts['service_mgr'] | default('')) == 'systemd'
    - not (ansible_facts['virtualization_type'] | default('') in ['docker', 'container', 'containerd'])
    - (base_ubuntu_server_oci_secrets_fetch_enabled | default(false)) | bool
