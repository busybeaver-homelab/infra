---
# Base hardening tasks for Ubuntu Server 26.04.

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - jq
      - unzip
      - ca-certificates
      - gnupg
      - python3-pip
      - tzdata
    state: present
  become: true

- name: Set timezone
  community.general.timezone:
    name: "{{ base_ubuntu_server_timezone }}"
  become: true

- name: Configure host firewall and Docker chain isolation
  ansible.builtin.include_tasks: firewall.yml
  when: base_ubuntu_server_firewall_enabled | bool

- name: Remove the retired OCI Vault secrets fetcher
  ansible.builtin.include_tasks: legacy_secrets_fetch_cleanup.yml

- name: Configure host-alive and disk-space healthcheck timer
  ansible.builtin.include_tasks: healthcheck.yml
  when: (base_ubuntu_server_healthchecks_ping_url | default('') | length) > 0

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Verify SSH service is running when enabled
  ansible.builtin.assert:
    that:
      - >-
        (ansible_facts.services['ssh.service']['state'] | default('')) == 'running' or
        (ansible_facts.services['sshd.service']['state'] | default('')) == 'running'
    fail_msg: "SSH service is expected to be running on base Ubuntu servers"
  when: base_ubuntu_server_verify_ssh_running | bool
