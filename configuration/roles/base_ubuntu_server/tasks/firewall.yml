---
# Firewall configuration: UFW and Docker chain isolation

- name: Install ufw and iptables packages
  ansible.builtin.apt:
    name:
      - ufw
      - iptables
    state: present
  become: true

- name: Configure UFW default incoming policy
  community.general.ufw:
    direction: incoming
    default: "{{ base_ubuntu_server_firewall_default_incoming }}"
  become: true

- name: Configure UFW default outgoing policy
  community.general.ufw:
    direction: outgoing
    default: "{{ base_ubuntu_server_firewall_default_outgoing }}"
  become: true

- name: Allow all incoming traffic on Tailscale interface in UFW
  community.general.ufw:
    rule: allow
    interface: "{{ base_ubuntu_server_firewall_tailscale_interface }}"
    direction: in
  when: base_ubuntu_server_firewall_allow_tailscale | bool
  become: true

- name: Allow OpenSSH in UFW if explicitly enabled
  community.general.ufw:
    rule: allow
    name: OpenSSH
  when: base_ubuntu_server_firewall_allow_openssh | bool
  become: true

- name: Resolve effective external interface for DOCKER-USER chain
  ansible.builtin.set_fact:
    _base_ubuntu_server_ext_iface: >-
      {{
        base_ubuntu_server_firewall_external_interface
        | default(
            (ansible_facts.default_ipv4.interface | default('eth0', true))
            if (ansible_facts.default_ipv4 is defined)
            else 'eth0',
            true
          )
      }}
  when: base_ubuntu_server_firewall_docker_isolation | bool

- name: Configure DOCKER-USER chain in /etc/ufw/after.rules
  ansible.builtin.blockinfile:
    path: /etc/ufw/after.rules
    insertbefore: "^COMMIT"
    marker: "# {mark} ANSIBLE MANAGED DOCKER-USER ISOLATION"
    block: |
      :DOCKER-USER - [0:0]
      -A DOCKER-USER -d 169.254.169.254/32 -j DROP
      -A DOCKER-USER -m conntrack --ctstate RELATED,ESTABLISHED -j RETURN
      -A DOCKER-USER -i lo -j RETURN
      -A DOCKER-USER -i {{ base_ubuntu_server_firewall_tailscale_interface }} -j RETURN
      -A DOCKER-USER -i {{ _base_ubuntu_server_ext_iface | trim }} -m conntrack --ctstate NEW -j DROP
      -A DOCKER-USER -j RETURN
  register: base_ubuntu_server_ufw_after_rules
  when: base_ubuntu_server_firewall_docker_isolation | bool
  become: true
  notify: Reload ufw for base_ubuntu_server

- name: Enable UFW service
  community.general.ufw:
    state: enabled
  when: base_ubuntu_server_firewall_enabled | bool
  become: true

- name: Ensure DOCKER-USER chain exists in active iptables
  ansible.builtin.command: iptables -N DOCKER-USER
  register: base_ubuntu_server_iptables_docker_user_create
  failed_when: false
  changed_when: base_ubuntu_server_iptables_docker_user_create.rc == 0
  when: base_ubuntu_server_firewall_docker_isolation | bool
  become: true

- name: Flush DOCKER-USER chain when UFW after.rules block is updated # noqa: no-handler
  ansible.builtin.iptables:
    chain: DOCKER-USER
    flush: true
  when:
    - base_ubuntu_server_firewall_docker_isolation | bool
    - base_ubuntu_server_ufw_after_rules.changed
  become: true

- name: Drop traffic to cloud metadata endpoint in DOCKER-USER chain
  ansible.builtin.iptables:
    chain: DOCKER-USER
    destination: 169.254.169.254/32
    jump: DROP
    action: append
  when: base_ubuntu_server_firewall_docker_isolation | bool
  become: true

- name: Return related and established connections in DOCKER-USER chain
  ansible.builtin.iptables:
    chain: DOCKER-USER
    ctstate:
      - RELATED
      - ESTABLISHED
    jump: RETURN
    action: append
  when: base_ubuntu_server_firewall_docker_isolation | bool
  become: true

- name: Return loopback in DOCKER-USER chain
  ansible.builtin.iptables:
    chain: DOCKER-USER
    in_interface: lo
    jump: RETURN
    action: append
  when: base_ubuntu_server_firewall_docker_isolation | bool
  become: true

- name: Return tailscale0 in DOCKER-USER chain
  ansible.builtin.iptables:
    chain: DOCKER-USER
    in_interface: "{{ base_ubuntu_server_firewall_tailscale_interface }}"
    jump: RETURN
    action: append
  when: base_ubuntu_server_firewall_docker_isolation | bool
  become: true

- name: Drop unsolicited inbound NEW connections on external interface in DOCKER-USER chain
  ansible.builtin.iptables:
    chain: DOCKER-USER
    in_interface: "{{ _base_ubuntu_server_ext_iface | trim }}"
    ctstate:
      - NEW
    jump: DROP
    action: append
  when: base_ubuntu_server_firewall_docker_isolation | bool
  become: true

- name: Return remaining traffic in DOCKER-USER chain
  ansible.builtin.iptables:
    chain: DOCKER-USER
    jump: RETURN
    action: append
  when: base_ubuntu_server_firewall_docker_isolation | bool
  become: true
