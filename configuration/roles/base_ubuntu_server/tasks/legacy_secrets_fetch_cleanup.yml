---
# The OCI Vault boot-time secrets fetcher was retired in favour of systemd
# encrypted credentials (restic_backup role). Remove anything an earlier release
# of this role may have installed, so disabled features converge to absent.

- name: Stat retired oci-secrets-fetch unit
  ansible.builtin.stat:
    path: /etc/systemd/system/oci-secrets-fetch.service
  register: base_ubuntu_server_legacy_fetch_unit

- name: Stop and disable retired oci-secrets-fetch unit
  ansible.builtin.systemd_service:
    name: oci-secrets-fetch.service
    state: stopped
    enabled: false
  when: base_ubuntu_server_legacy_fetch_unit.stat.exists
  become: true

- name: Remove retired secrets fetcher artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/oci-secrets-fetch.service
    - /usr/local/bin/oci-fetch-secrets.sh
    - /etc/tmpfiles.d/run-secrets.conf
  notify: Reload systemd for base_ubuntu_server units
  become: true
