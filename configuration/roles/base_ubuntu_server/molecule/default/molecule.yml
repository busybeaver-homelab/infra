---
dependency:
  name: galaxy
  enabled: false

driver:
  name: docker

platforms:
  - name: base-ubuntu-server-26
    image: geerlingguy/docker-ubuntu2604-ansible:latest@sha256:f588e42eff0a028a431f95d9cbb5a942bc6ccddae6289f494f73fa191700d44f
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ${MOLECULE_PROJECT_DIRECTORY}/.cache/apt/archives:/var/cache/apt/archives:rw
    cgroupns_mode: host
    command: /lib/systemd/systemd

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../..:~/.ansible/roles
  config_options:
    defaults:
      callbacks_enabled: profile_tasks
      remote_tmp: /tmp
      roles_path: ../../..:~/.ansible/roles
    connection:
      pipelining: true

scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy

verifier:
  name: ansible
