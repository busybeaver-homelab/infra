---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify base packages are installed
      ansible.builtin.package:
        name:
          - curl
          - wget
          - jq
          - unzip
          - ca-certificates
        state: present
      check_mode: true
      register: base_ubuntu_server_pkg_check
      failed_when: base_ubuntu_server_pkg_check.changed

    - name: Verify UFW is installed and active
      ansible.builtin.command: ufw status verbose
      register: base_ubuntu_server_ufw_status
      changed_when: false
      failed_when: "'Status: active' not in base_ubuntu_server_ufw_status.stdout"

    - name: Verify UFW allows traffic on tailscale0
      ansible.builtin.assert:
        that:
          - "'tailscale0' in base_ubuntu_server_ufw_status.stdout"
          - "'ALLOW IN' in base_ubuntu_server_ufw_status.stdout"

    - name: Check DOCKER-USER iptables chain
      ansible.builtin.command: iptables -L DOCKER-USER -n -v
      register: base_ubuntu_server_iptables_docker_user
      changed_when: false

    - name: Verify DOCKER-USER chain isolates external traffic
      ansible.builtin.assert:
        that:
          - "'tailscale0' in base_ubuntu_server_iptables_docker_user.stdout"
          - "'DROP' in base_ubuntu_server_iptables_docker_user.stdout"

    - name: Verify SSH service is inactive and disabled # noqa: command-instead-of-module
      ansible.builtin.command: systemctl is-active ssh
      register: base_ubuntu_server_ssh_service_status
      failed_when: base_ubuntu_server_ssh_service_status.rc == 0
      changed_when: false

    - name: Attempt to start ssh service and assert failure or rejection # noqa: command-instead-of-module
      ansible.builtin.command: systemctl start ssh
      register: base_ubuntu_server_ssh_start_attempt
      failed_when: base_ubuntu_server_ssh_start_attempt.rc == 0
      changed_when: false

    - name: Verify port 22 is not listening
      ansible.builtin.shell: |
        set -o pipefail
        ss -tulpn | grep ':22\b'
      args:
        executable: /bin/bash
      register: base_ubuntu_server_ssh_port_check
      failed_when: base_ubuntu_server_ssh_port_check.rc == 0
      changed_when: false

    - name: Trigger firewall reload
      ansible.builtin.command: ufw reload
      register: base_ubuntu_server_ufw_reload_result
      changed_when: false

    - name: Verify DOCKER-USER chain isolation persists after reload
      ansible.builtin.command: iptables -L DOCKER-USER -n -v
      register: base_ubuntu_server_iptables_after_reload
      changed_when: false

    - name: Assert DROP rule persists on DOCKER-USER chain
      ansible.builtin.assert:
        that:
          - "'tailscale0' in base_ubuntu_server_iptables_after_reload.stdout"
          - "'DROP' in base_ubuntu_server_iptables_after_reload.stdout"

    - name: Stat /etc/ufw/after.rules configuration file
      ansible.builtin.stat:
        path: /etc/ufw/after.rules
      register: base_ubuntu_server_ufw_rules_stat

    - name: Assert /etc/ufw/after.rules file exists with root ownership
      ansible.builtin.assert:
        that:
          - base_ubuntu_server_ufw_rules_stat.stat.exists
          - base_ubuntu_server_ufw_rules_stat.stat.pw_name == 'root'
          - base_ubuntu_server_ufw_rules_stat.stat.gr_name == 'root'

    - name: Verify timezone configuration file
      ansible.builtin.stat:
        path: /etc/localtime
      register: base_ubuntu_server_timezone_stat

    - name: Assert timezone configuration exists
      ansible.builtin.assert:
        that:
          - base_ubuntu_server_timezone_stat.stat.exists

    - name: Stat /usr/local/bin/oci-fetch-secrets.sh
      ansible.builtin.stat:
        path: /usr/local/bin/oci-fetch-secrets.sh
      register: base_ubuntu_server_fetch_script_stat

    - name: Assert oci-fetch-secrets.sh is deployed with restricted executable permissions
      ansible.builtin.assert:
        that:
          - base_ubuntu_server_fetch_script_stat.stat.exists
          - base_ubuntu_server_fetch_script_stat.stat.mode == '0750'
          - base_ubuntu_server_fetch_script_stat.stat.pw_name == 'root'
          - base_ubuntu_server_fetch_script_stat.stat.gr_name == 'root'

    - name: Stat in-memory /run/secrets directory
      ansible.builtin.stat:
        path: /run/secrets
      register: base_ubuntu_server_run_secrets_stat

    - name: Assert /run/secrets exists with 0700 root permissions
      ansible.builtin.assert:
        that:
          - base_ubuntu_server_run_secrets_stat.stat.exists
          - base_ubuntu_server_run_secrets_stat.stat.isdir
          - base_ubuntu_server_run_secrets_stat.stat.mode == '0700'
          - base_ubuntu_server_run_secrets_stat.stat.pw_name == 'root'
          - base_ubuntu_server_run_secrets_stat.stat.gr_name == 'root'

    - name: Stat /etc/tmpfiles.d/run-secrets.conf
      ansible.builtin.stat:
        path: /etc/tmpfiles.d/run-secrets.conf
      register: base_ubuntu_server_tmpfiles_stat

    - name: Assert /etc/tmpfiles.d/run-secrets.conf exists
      ansible.builtin.assert:
        that:
          - base_ubuntu_server_tmpfiles_stat.stat.exists
          - base_ubuntu_server_tmpfiles_stat.stat.mode == '0644'

    - name: Stat /etc/systemd/system/oci-secrets-fetch.service
      ansible.builtin.stat:
        path: /etc/systemd/system/oci-secrets-fetch.service
      register: base_ubuntu_server_service_stat

    - name: Assert oci-secrets-fetch.service exists
      ansible.builtin.assert:
        that:
          - base_ubuntu_server_service_stat.stat.exists
          - base_ubuntu_server_service_stat.stat.mode == '0644'

    - name: Read oci-secrets-fetch.service contents
      ansible.builtin.slurp:
        src: /etc/systemd/system/oci-secrets-fetch.service
      register: base_ubuntu_server_service_unit

    - name: Assert oci-secrets-fetch.service sandboxing and paths
      ansible.builtin.assert:
        that:
          - "'ProtectSystem=strict' in (base_ubuntu_server_service_unit.content | b64decode)"
          - "'ExecStart=/usr/local/bin/oci-fetch-secrets.sh' in (base_ubuntu_server_service_unit.content | b64decode)"
          - "'ReadWritePaths=/run/secrets' in (base_ubuntu_server_service_unit.content | b64decode)"

    - name: Verify systemd unit configuration
      ansible.builtin.command: systemd-analyze verify /etc/systemd/system/oci-secrets-fetch.service
      changed_when: false
