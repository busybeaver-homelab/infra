---
# Tasks for valetudo_robot role. The robot runs BusyBox without Python, so
# robot-side work uses ansible.builtin.raw and byte transfers go through the
# controller-side robot-transport.sh helper.

- name: Run valetudo_robot preflight checks
  ansible.builtin.import_tasks: preflight.yml
  tags: [preflight, always]

- name: Capture valetudo_robot calibration backup
  ansible.builtin.import_tasks: backup.yml
  tags: [backup]

- name: Install valetudo_robot binaries and the postboot hook
  ansible.builtin.import_tasks: install.yml
  tags: [install]

- name: Submit valetudo_robot Wi-Fi configuration when off the home network
  ansible.builtin.import_tasks: wifi.yml
  tags: [wifi]

- name: Configure Valetudo through its REST API
  ansible.builtin.import_tasks: configure.yml
  tags: [configure]
