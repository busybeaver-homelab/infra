---
prerun: false
dependency:
  name: galaxy
  enabled: false

driver:
  name: docker

# BusyBox stands in for the robot: no Python, no systemd, no SFTP. The role
# reaches it with raw and with robot-transport.sh in docker transport mode.
platforms:
  - name: valetudo-robot
    image: busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    pre_build_image: true
    command: sleep infinity

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/..:${MOLECULE_PROJECT_DIRECTORY}/../../.galaxy/roles"
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../../.galaxy/collections"
  config_options:
    defaults:
      callbacks_enabled: profile_tasks
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/..:${MOLECULE_PROJECT_DIRECTORY}/../../.galaxy/roles
      collections_path: ${MOLECULE_PROJECT_DIRECTORY}/../../.galaxy/collections
  inventory:
    group_vars:
      all:
        valetudo_robot_transport: docker
        valetudo_robot_container: valetudo-robot
        valetudo_robot_reboot_enabled: false
        valetudo_robot_tailscale_enabled: false

scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

verifier:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/..:${MOLECULE_PROJECT_DIRECTORY}/../../.galaxy/roles"
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../../.galaxy/collections"
