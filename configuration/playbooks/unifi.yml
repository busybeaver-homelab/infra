---
- name: Preflight — assert non-empty unifi inventory
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
    - preflight
  tasks:
    - name: Assert inventory contains at least one unifi host
      ansible.builtin.assert:
        that:
          - (groups['unifi'] | default([])) | length > 0
        fail_msg: >-
          STD-AN-29 / STD-AN-49: Inventory resolved zero target hosts in groups['unifi'].
          Populate unifi hosts in configuration/inventories/hosts.generated.yml or pass
          -e allow_empty_inventory=true for syntax/dry checks.
      when:
        - not ansible_check_mode
        - not (allow_empty_inventory | default(false) | bool)

- name: Configure UniFi devices and networks
  hosts: unifi
  gather_facts: false
  tasks:
    - name: Ping UniFi controller
      ansible.builtin.ping:
