---
- name: Preflight — assert non-empty target inventory
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Assert inventory contains at least one target host
      ansible.builtin.assert:
        that:
          - groups['all'] | default([]) | length > 0
        fail_msg: >-
          Inventory resolved zero target hosts. Populate Tailscale MagicDNS
          hostnames in SOPS or pass -e allow_empty_inventory=true for syntax/dry checks.
      when:
        - not ansible_check_mode
        - not (allow_empty_inventory | default(false) | bool)

- name: Configure Cloud Instances (OCI and GCP)
  hosts: "{{ cloud_target_hosts | default('cloud:oci:gcp') }}"
  become: true
  module_defaults:
    ansible.builtin.template:
      unsafe_writes: "{{ molecule_unsafe_writes | default(false) | bool }}"
  pre_tasks:
    - name: Load SOPS credentials
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../../secrets/{{ custom_sops_secrets_file | default('credentials.sops.yaml') }}"

    - name: Validate environment sentinel
      ansible.builtin.assert:
        that:
          - (custom_sops_secrets_file | default('credentials.sops.yaml')) in ['credentials.sops.yaml', 'credentials.ci.sops.yaml']
          - (is_production | default(false) | bool) != (is_ci_environment | default(false) | bool)
          - not (is_ci_environment | default(false) | bool) or (ansible_connection | default('ssh')) in ['docker', 'local', 'community.docker.docker']
        fail_msg: >-
          Refusing to execute playbook: custom_sops_secrets_file must be one of the two canonical files,
          exactly one of is_production or is_ci_environment must be true (XOR), and CI mode is restricted
          to container/local test connections.
        success_msg: "Environment sentinel verified successfully."

    - name: Load Restic backup variables from OpenTofu outputs
      when: not (is_ci_environment | default(false) | bool)
      block:
        - name: Run get-tofu-restic-vars.sh on the controller
          ansible.builtin.command:
            argv:
              - "{{ playbook_dir }}/../../scripts/get-tofu-restic-vars.sh"
          delegate_to: localhost
          become: false
          run_once: true
          changed_when: false
          check_mode: false
          no_log: true
          register: _tofu_restic_vars_raw
      rescue:
        # Surfaced without stderr (no_log above); stderr can name backend endpoints.
        - name: Fail with a pointer to the hidden helper error
          ansible.builtin.fail:
            msg: >-
              scripts/get-tofu-restic-vars.sh exited with rc={{ _tofu_restic_vars_raw.rc | default('unknown') }}.
              Run it manually from the repository root to see the error (output is hidden here),
              then initialise or apply infrastructure/{oci,gcp,cloudflare,monitoring} as reported.
          run_once: true

    # The run_once registration above is applied to every host, so each host parses it.
    - name: Set OpenTofu Restic backup facts from helper output
      ansible.builtin.set_fact:
        tofu_oci_restic: "{{ (_tofu_restic_vars_raw.stdout | from_json).tofu_oci_restic }}"
        tofu_gcp_restic: "{{ (_tofu_restic_vars_raw.stdout | from_json).tofu_gcp_restic }}"
        tofu_cloudflare_restic: "{{ (_tofu_restic_vars_raw.stdout | from_json).tofu_cloudflare_restic }}"
        tofu_host_backup_ping_urls: "{{ (_tofu_restic_vars_raw.stdout | from_json).tofu_host_backup_ping_urls }}"
        tofu_host_alive_ping_urls: "{{ (_tofu_restic_vars_raw.stdout | from_json).tofu_host_alive_ping_urls }}"
      no_log: true
      when: not (is_ci_environment | default(false) | bool)

    - name: Validate OpenTofu Restic backup variables are populated
      ansible.builtin.assert:
        that:
          - tofu_oci_restic is defined
          - tofu_oci_restic.s3_endpoint | default('') | length > 0
          - tofu_oci_restic.bucket | default('') | length > 0
          - tofu_oci_restic.s3_access_key_id | default('') | length > 0
          - tofu_oci_restic.s3_secret_access_key | default('') | length > 0
          - tofu_gcp_restic is defined
          - tofu_gcp_restic.s3_endpoint | default('') | length > 0
          - tofu_gcp_restic.bucket | default('') | length > 0
          - tofu_gcp_restic.s3_access_key_id | default('') | length > 0
          - tofu_gcp_restic.s3_secret_access_key | default('') | length > 0
          - tofu_cloudflare_restic is defined
          - tofu_cloudflare_restic.s3_endpoint | default('') | length > 0
          - tofu_cloudflare_restic.bucket | default('') | length > 0
          - tofu_cloudflare_restic.s3_access_key_id | default('') | length > 0
          - tofu_cloudflare_restic.s3_secret_access_key | default('') | length > 0
          - tofu_host_backup_ping_urls is defined
          - tofu_host_backup_ping_urls[inventory_hostname] is defined
          - tofu_host_backup_ping_urls[inventory_hostname] | string | length > 0
          - tofu_host_alive_ping_urls is defined
          - tofu_host_alive_ping_urls[inventory_hostname] is defined
          - tofu_host_alive_ping_urls[inventory_hostname] | string | length > 0
        fail_msg: >-
          OpenTofu Restic backup and per-host monitoring variables (tofu_oci_restic, tofu_gcp_restic,
          tofu_cloudflare_restic, tofu_host_backup_ping_urls[{{ inventory_hostname }}],
          tofu_host_alive_ping_urls[{{ inventory_hostname }}]) are missing or incomplete.
          Ensure infrastructure/oci, infrastructure/gcp, infrastructure/cloudflare, and
          infrastructure/monitoring have been applied.
        quiet: true
      no_log: true

    - name: Set active cloud provider configuration dictionary
      ansible.builtin.set_fact:
        cloud_provider_config: >-
          {{
            lookup(
              'ansible.builtin.vars',
              cloud_provider_secret_key | default('gcp' if ('gcp' in group_names) else 'oci')
            )
          }}
      no_log: true

    - name: Assert breakglass user credentials are defined and non-empty
      ansible.builtin.assert:
        that:
          - cloud_provider_config is defined
          - cloud_provider_config.breakglass_user is defined
          - cloud_provider_config.breakglass_user | string | length > 0
          - cloud_provider_config.breakglass_password_hash is defined
          - cloud_provider_config.breakglass_password_hash | string | length > 0
        fail_msg: "Breakglass user credentials (breakglass_user, breakglass_password_hash) are missing or empty in SOPS."
        quiet: true
      no_log: true

    - name: Ensure breakglass user exists with active shadow password
      ansible.builtin.user:
        name: "{{ cloud_provider_config.breakglass_user }}"
        password: "{{ cloud_provider_config.breakglass_password_hash }}"
        update_password: always
        groups:
          - sudo
        append: true
        shell: /bin/bash
        state: present
      no_log: true

  roles:
    - role: base_ubuntu_server
      tags: [base]
    - role: geerlingguy.swap
      tags: [swap]
    - role: geerlingguy.ntp
      tags: [ntp]
    - role: devsec.hardening.os_hardening
      tags: [hardening]
    - role: geerlingguy.security
      tags: [security, hardening]
    - role: geerlingguy.firewall
      tags: [firewall]
    - role: geerlingguy.docker
      tags: [docker]
    - role: restic_backup
      tags: [backup]
    - role: docker_compose_service
      tags: [compose]

  post_tasks:
    - name: Stop, disable, and mask OpenSSH socket and service
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
        daemon_reload: true
      loop:
        - ssh.socket
        - ssh.service
      when: not (ssh_server_enabled | default(true) | bool)

    - name: Gather service facts after masking OpenSSH
      ansible.builtin.service_facts:
      when: not (ssh_server_enabled | default(true) | bool)

    - name: Assert OpenSSH service and socket are not running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['ssh.service']['state'] | default('stopped') != 'running'
          - ansible_facts.services['ssh.socket']['state'] | default('stopped') != 'running'
        fail_msg: "OpenSSH service or socket is unexpectedly still running"
      when: not (ssh_server_enabled | default(true) | bool)

    - name: Verify port 22 is closed when OpenSSH is disabled
      ansible.builtin.wait_for:
        port: 22
        state: stopped
        timeout: 5
      when: not (ssh_server_enabled | default(true) | bool)
