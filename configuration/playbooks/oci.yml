---
- name: Configure OCI Instances
  hosts: oci
  become: true
  pre_tasks:
    - name: Load SOPS credentials
      when: oci is not defined
      block:
        - name: Load production SOPS credentials
          community.sops.load_vars:
            file: "{{ playbook_dir }}/../../secrets/credentials.sops.yaml"
      rescue:
        - name: Fallback to CI decoy SOPS credentials
          community.sops.load_vars:
            file: "{{ playbook_dir }}/../../secrets/credentials.ci.sops.yaml"

    - name: Ensure breakglass user exists with active shadow password
      ansible.builtin.user:
        name: "{{ oci.breakglass_user }}"
        password: "{{ oci.breakglass_password_hash }}"
        update_password: always
        groups:
          - sudo
        append: true
        shell: /bin/bash
        state: present
      no_log: true
      when:
        - oci is defined
        - oci.breakglass_user is defined
        - oci.breakglass_password_hash is defined

  roles:
    - ajsalminen.hosts
    - base-ubuntu-server
    - geerlingguy.swap
    - geerlingguy.ntp
    - dev-sec.os-hardening
    - dev-sec.ssh-hardening
    - geerlingguy.security
    - geerlingguy.firewall
    - geerlingguy.docker
    - singleplatform-eng.users

  post_tasks:
    - name: Ensure OpenSSH server service and socket are stopped and disabled
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - ssh.service
        - ssh.socket
      failed_when: false
      when: not (ssh_server_enabled | default(true) | bool)
