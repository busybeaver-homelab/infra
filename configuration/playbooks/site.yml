---
# Master Playbook Entrypoint
- name: Preflight — assert non-empty target inventory
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
    - preflight
  tasks:
    - name: Assert inventory contains at least one target host
      ansible.builtin.assert:
        that:
          - ((groups['oci'] | default([])) + (groups['gcp'] | default([]))) | length > 0
        fail_msg: >-
          STD-AN-29 / STD-AN-49: Inventory resolved zero cloud target hosts in groups['oci']
          or groups['gcp']. Run scripts/generate-inventory.sh (mise run ansible:inventory) to
          materialize configuration/inventories/hosts.generated.yml or pass
          -e allow_empty_inventory=true for syntax/dry checks.
      when:
        - not ansible_check_mode
        - not (allow_empty_inventory | default(false) | bool)

- name: Apply base hardening to all managed hosts
  ansible.builtin.import_playbook: base.yml

- name: Import common playbooks
  ansible.builtin.import_playbook: common.yml

- name: Import homelab playbooks
  ansible.builtin.import_playbook: homelab.yml
  vars:
    allow_empty_inventory: true

- name: Import unifi playbooks
  ansible.builtin.import_playbook: unifi.yml
  vars:
    allow_empty_inventory: true

- name: Import cloud playbooks (OCI and GCP)
  ansible.builtin.import_playbook: cloud.yml
