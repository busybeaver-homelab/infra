---
# Shared group variables for all cloud compute instances (OCI and GCP)

# Firewall settings (geerlingguy.firewall)
# Disable base_ubuntu_server UFW firewall because geerlingguy.firewall manages iptables directly on cloud instances
base_ubuntu_server_firewall_enabled: false
firewall_enabled: true
firewall_flush_rules_and_chains: false
firewall_allowed_tcp_ports: []
firewall_allowed_udp_ports:
  # Tailscale WireGuard direct peer-to-peer port
  - "41641"
firewall_additional_rules:
  # Allow all incoming traffic on Tailscale WireGuard overlay interface
  - "iptables -A INPUT -i tailscale0 -j ACCEPT"
firewall_ip6_additional_rules:
  # Allow all incoming IPv6 traffic on Tailscale WireGuard overlay interface
  - "ip6tables -A INPUT -i tailscale0 -j ACCEPT"

# SSH Configuration
# OpenSSH server daemon (sshd) and socket are completely stopped, disabled, and masked
# at the host level (port 22 closed) to reduce the attack surface to zero listening OpenSSH ports.
# Primary administrative access is handled exclusively by Tailscale SSH running inside the
# tailscaled daemon over the encrypted WireGuard overlay interface (tailscale0).
# Emergency break-glass access is out-of-band via Cloud Serial Console.
ssh_server_enabled: false

# Security settings (geerlingguy.security)
# Disable geerlingguy.security SSH hardening because OpenSSH server is stopped and masked.
security_ssh_hardening: false
security_sshd_state: stopped
security_fail2ban_enabled: true
security_autoupdate_enabled: true

# OS Hardening settings (devsec.hardening.os_hardening)
# Explicit ordered list of CIS-recommended unused filesystems to blacklist in /etc/modprobe.d/dev-sec.conf
# (avoiding devsec.hardening's internal unordered set difference while preserving CIS kernel module hardening).
os_unused_filesystems:
  - cramfs
  - freevxfs
  - hfs
  - hfsplus
  - jffs2
  - udf
sysctl_overwrite:
  # Enable IPv4 traffic forwarding - required for Docker bridge networking
  net.ipv4.ip_forward: 1

# Swap settings (geerlingguy.swap)
# Allocate 2GB swap file (crucial for 1GB RAM micro instances on OCI and GCP)
swap_file_size_mb: 2048
swap_swappiness: "10"

# NTP settings (geerlingguy.ntp)
ntp_timezone: "UTC"
ntp_package: ntpsec
ntp_daemon: ntpsec
ntp_config_file: /etc/ntpsec/ntp.conf
ntp_driftfile: /var/lib/ntpsec/ntp.drift

# Docker daemon configuration (geerlingguy.docker)
docker_daemon_options:
  log-driver: "json-file"
  log-opts:
    max-size: "10m"
    max-file: "3"
  live-restore: true

# GitOps Docker Compose Reconciler (docker_compose_service)
# Disabled by default until first signed release exists for each target;
# enable per-group or per-host once homelab-services vX.Y.Z is published.
docker_compose_service_enabled: false
docker_compose_service_manage_daemon_json: false
docker_compose_service_hosts: "{{ compose.hosts | default([]) }}"
docker_compose_service_targets: "{{ compose.targets | default({}) }}"
