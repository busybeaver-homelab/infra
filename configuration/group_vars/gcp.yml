---
# Group variables for GCP compute instances (inherits shared baseline from group_vars/cloud.yml)

# Primary GCP Cloud Storage Backup (US-Central1 Always Free Regional Bucket via S3 HMAC Interop)
restic_backup_repository: "s3:{{ tofu_gcp_restic.s3_endpoint }}/{{ tofu_gcp_restic.bucket }}/{{ inventory_hostname }}"
restic_backup_s3_access_key: "{{ tofu_gcp_restic.s3_access_key_id }}"
restic_backup_s3_secret_key: "{{ tofu_gcp_restic.s3_secret_access_key }}"
restic_backup_password: "{{ gcp_restic.password }}"
restic_backup_healthchecks_ping_url: "{{ tofu_host_backup_ping_urls[inventory_hostname] | default('') }}"
base_ubuntu_server_healthchecks_ping_url: "{{ tofu_host_alive_ping_urls[inventory_hostname] | default('') }}"

# Bind systemd encrypted credentials on GCP Shielded VMs to both host secret and vTPM2
restic_backup_credential_key: "host+tpm2"
docker_compose_service_credential_key: "host+tpm2"
