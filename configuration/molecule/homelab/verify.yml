---
- name: Verify homelab and common configuration
  hosts: homelab
  become: true
  gather_facts: false
  tasks:
    - name: Verify common packages are installed
      ansible.builtin.package:
        name:
          - curl
          - tmux
        state: present
      check_mode: true
      register: pkg_check
      failed_when: pkg_check.changed

    - name: Verify common binaries are executable
      ansible.builtin.command: which {{ item }}
      loop:
        - curl
        - tmux
      register: binary_which
      changed_when: false
      failed_when: binary_which.rc != 0

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert Docker service is active
      ansible.builtin.assert:
        that:
          - ansible_facts.services['docker.service']['state'] | default('') == 'running'
        fail_msg: "Docker service (docker.service) should be running"

    - name: Check systemd status of Docker service # noqa: command-instead-of-module
      ansible.builtin.command: systemctl is-active docker
      register: docker_is_active
      changed_when: false
      failed_when: docker_is_active.rc != 0

    - name: Slurp /etc/ufw/after.rules
      ansible.builtin.slurp:
        src: /etc/ufw/after.rules
      register: homelab_ufw_after_rules

    - name: Assert DOCKER-USER isolation block is present in /etc/ufw/after.rules
      ansible.builtin.assert:
        that:
          - "'-A DOCKER-USER -d 169.254.169.254/32 -j DROP' in (homelab_ufw_after_rules.content | b64decode)"
          - "'-A DOCKER-USER -m conntrack --ctstate RELATED,ESTABLISHED -j RETURN' in (homelab_ufw_after_rules.content | b64decode)"
          - "'-A DOCKER-USER -i tailscale0 -j RETURN' in (homelab_ufw_after_rules.content | b64decode)"
          - "'-m conntrack --ctstate NEW -j DROP' in (homelab_ufw_after_rules.content | b64decode)"
          - "'-A DOCKER-USER -j RETURN' in (homelab_ufw_after_rules.content | b64decode)"
        fail_msg: "DOCKER-USER isolation rules missing from /etc/ufw/after.rules"

    - name: Read active DOCKER-USER iptables rules
      ansible.builtin.command: iptables -S DOCKER-USER
      register: homelab_docker_user_rules
      changed_when: false

    - name: Assert DOCKER-USER chain rules are active in iptables
      ansible.builtin.assert:
        that:
          - "'-A DOCKER-USER -d 169.254.169.254/32 -j DROP' in homelab_docker_user_rules.stdout"
          - "'-A DOCKER-USER -i tailscale0 -j RETURN' in homelab_docker_user_rules.stdout"
          - "'--ctstate NEW -j DROP' in homelab_docker_user_rules.stdout"
          - "'-A DOCKER-USER -j RETURN' in homelab_docker_user_rules.stdout"
        fail_msg: "Active iptables DOCKER-USER chain does not match expected rules"

    - name: Check systemd enabled state of compose timers # noqa: command-instead-of-module
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - "{{ item }}"
      loop:
        - homelab-compose-reconcile.timer
        - homelab-docker-cleanup.timer
      register: homelab_compose_timers_enabled
      changed_when: false

    - name: Assert compose reconciler and cleanup timers are enabled
      ansible.builtin.assert:
        that:
          - item.stdout | trim == 'enabled'
        fail_msg: "Expected {{ item.item }} to be enabled, got '{{ item.stdout | trim }}'"
      loop: "{{ homelab_compose_timers_enabled.results }}"

    - name: Stat /etc/containers/cosign.pub
      ansible.builtin.stat:
        path: /etc/containers/cosign.pub
      register: homelab_cosign_pub

    - name: Assert /etc/containers/cosign.pub exists
      ansible.builtin.assert:
        that:
          - homelab_cosign_pub.stat.exists
          - homelab_cosign_pub.stat.mode == '0444'
        fail_msg: "/etc/containers/cosign.pub is missing or has unexpected permissions"

    - name: Read /etc/docker/daemon.json
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: homelab_daemon_json

    - name: Assert /etc/docker/daemon.json configures json-file log rotation and live-restore
      vars:
        daemon_cfg: "{{ homelab_daemon_json.content | b64decode | from_json }}"
      ansible.builtin.assert:
        that:
          - daemon_cfg['log-driver'] == 'json-file'
          - daemon_cfg['log-opts']['max-size'] == '10m'
          - daemon_cfg['log-opts']['max-file'] == '3'
          - daemon_cfg['live-restore'] == true
        fail_msg: "/etc/docker/daemon.json does not contain expected log rotation and live-restore options"
