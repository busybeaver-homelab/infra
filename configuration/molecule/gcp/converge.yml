---
- name: Converge GCP Instance Base Configuration
  ansible.builtin.import_playbook: ../../playbooks/gcp.yml
  vars:
    is_ci_environment: true
    molecule_unsafe_writes: true
    custom_sops_secrets_file: credentials.ci.sops.yaml
    restic_backup_auto_init: true
    swap_test_mode: true
    swap_file_path: /swapfile_molecule
    swap_file_size_mb: 1
    # Docker test containers do not expose a hardware/virtual TPM2 device (/dev/tpmrm0),
    # so override the GCP Shielded VM default (host+tpm2) with host-only binding in Molecule.
    restic_backup_credential_key: "host"
    tofu_oci_restic:
      s3_endpoint: "https://objectstorage.eu-frankfurt-1.example.test"
      bucket: "molecule-oci-backups"
      s3_access_key_id: "molecule-oci-access-key-id"
      s3_secret_access_key: "molecule-oci-secret-access-key"
      healthcheck_url: "https://hc-ping.example.test/00000000-0000-0000-0000-000000000001"
    tofu_gcp_restic:
      s3_endpoint: "https://storage.example.test"
      bucket: "molecule-gcp-backups"
      s3_access_key_id: "GOOG1EMOLECULEKEYID"
      s3_secret_access_key: "molecule-gcp-hmac-secret-key"
      healthcheck_url: "https://hc-ping.example.test/00000000-0000-0000-0000-000000000002"
    tofu_cloudflare_restic:
      s3_endpoint: "https://00000000000000000000000000000000.r2.example.test"
      bucket: "molecule-r2-backups-dr"
      s3_access_key_id: "molecule-r2-access-key-id"
      s3_secret_access_key: "molecule-r2-secret-access-key"
    docker_compose_service_enabled: true
    docker_compose_service_reconcile_on_converge: false
    docker_compose_service_credential_key: "host"
    docker_compose_service_hosts:
      - host: "gcp-ubuntu-server-26"
        target: "gcp"
        healthchecks_ping_url: "https://hc-ping.com/00000000-0000-4000-8000-000000009002"
