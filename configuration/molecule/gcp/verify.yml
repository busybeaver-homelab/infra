---
- name: Verify GCP Instance Configuration
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Verify base packages are installed
      ansible.builtin.package:
        name:
          - curl
          - wget
          - jq
          - unzip
          - ca-certificates
        state: present
      check_mode: true
      register: pkg_check
      failed_when: pkg_check.changed

    - name: Verify /etc/hosts is managed and resolves localhost and inventory hostname
      ansible.builtin.slurp:
        src: /etc/hosts
      register: gcp_hosts_content

    - name: Assert /etc/hosts contains managed header, localhost, and hostname entries
      ansible.builtin.assert:
        that:
          - "'Ansible managed' in (gcp_hosts_content.content | b64decode)"
          - "'127.0.0.1 localhost' in (gcp_hosts_content.content | b64decode)"
          - "inventory_hostname in (gcp_hosts_content.content | b64decode)"
        fail_msg: "/etc/hosts was not rendered as expected by base_ubuntu_server"

    - name: Check IPv4 forwarding sysctl set by devsec.hardening.os_hardening
      ansible.builtin.command:
        argv:
          - sysctl
          - -n
          - net.ipv4.ip_forward
      register: gcp_ip_forward_sysctl
      changed_when: false

    - name: Assert net.ipv4.ip_forward is enabled
      ansible.builtin.assert:
        that:
          - gcp_ip_forward_sysctl.stdout | trim == '1'
        fail_msg: "Expected net.ipv4.ip_forward to be 1, got '{{ gcp_ip_forward_sysctl.stdout | trim }}'"

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert OpenSSH service is not active
      ansible.builtin.assert:
        that:
          - ansible_facts.services['ssh.service']['state'] | default('stopped') != 'running'
        fail_msg: "OpenSSH service (ssh.service) should not be active"

    - name: Assert OpenSSH socket is not active
      ansible.builtin.assert:
        that:
          - ansible_facts.services['ssh.socket']['state'] | default('stopped') != 'running'
        fail_msg: "OpenSSH socket (ssh.socket) should not be active"

    - name: Check systemd enabled state of ssh.socket and ssh.service # noqa: command-instead-of-module
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - "{{ item }}"
      loop:
        - ssh.socket
        - ssh.service
      register: ssh_unit_enabled
      changed_when: false
      failed_when: false

    - name: Assert ssh.socket and ssh.service are masked
      ansible.builtin.assert:
        that:
          - item.stdout | trim == 'masked'
        fail_msg: "Expected {{ item.item }} to be masked, got '{{ item.stdout | trim }}'"
      loop: "{{ ssh_unit_enabled.results }}"

    - name: Verify port 22 is not listening
      ansible.builtin.wait_for:
        port: 22
        state: stopped
        timeout: 5

    - name: Check /etc/firewall.bash exists
      ansible.builtin.stat:
        path: /etc/firewall.bash
      register: firewall_script

    - name: Assert firewall script exists and is executable
      ansible.builtin.assert:
        that:
          - firewall_script.stat.exists
          - firewall_script.stat.executable
        fail_msg: "/etc/firewall.bash does not exist or is not executable"

    - name: Read iptables rules
      ansible.builtin.command: iptables -S
      register: iptables_rules
      changed_when: false

    - name: Assert iptables contains Tailscale UDP 41641 and tailscale0 interface rules
      ansible.builtin.assert:
        that:
          - "'-p udp -m udp --dport 41641 -j ACCEPT' in iptables_rules.stdout"
          - "'-i tailscale0 -j ACCEPT' in iptables_rules.stdout"
          - "'--dport 22 -j ACCEPT' not in iptables_rules.stdout"
        fail_msg: "Firewall rules do not match expected Tailscale and SSH restrictions"

    - name: Load SOPS credentials for verification
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../../../secrets/credentials.ci.sops.yaml"
      no_log: true

    - name: Read primary restic backup environment file
      ansible.builtin.slurp:
        src: /etc/restic/primary.env
      register: gcp_primary_env

    - name: Assert primary restic backup points to GCP Cloud Storage S3 endpoint
      ansible.builtin.assert:
        that:
          - "'s3:https://storage.example.test/molecule-gcp-backups/' in (gcp_primary_env.content | b64decode)"
        fail_msg: "Primary restic backup environment does not point to GCP Cloud Storage"

    - name: Stat host-side secondary DR files and credentials (must not exist on host)
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/restic/secondary.env
        - /etc/credstore.encrypted/restic_secondary_password
        - /etc/credstore.encrypted/cloudflare_s3_secret_key
      register: gcp_secondary_stats

    - name: Assert no Cloudflare R2 or secondary DR credentials are deployed on GCP hosts
      ansible.builtin.assert:
        that:
          - not item.stat.exists
        fail_msg: "Host-side DR file {{ item.item }} must not exist (DR copy is pulled by CI)"
      loop: "{{ gcp_secondary_stats.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Stat encrypted primary S3 secret key credential
      ansible.builtin.stat:
        path: /etc/credstore.encrypted/primary_s3_secret_key
      register: gcp_primary_s3_cred

    - name: Assert encrypted primary_s3_secret_key exists in credstore
      ansible.builtin.assert:
        that:
          - gcp_primary_s3_cred.stat.exists
          - gcp_primary_s3_cred.stat.mode == '0400'
        fail_msg: "/etc/credstore.encrypted/primary_s3_secret_key does not exist with mode 0400"

    - name: Verify breakglass user exists in passwd database
      ansible.builtin.getent:
        database: passwd
        key: "{{ gcp.breakglass_user }}"
      no_log: true

    - name: Verify breakglass user has shadow entry
      ansible.builtin.getent:
        database: shadow
        key: "{{ gcp.breakglass_user }}"
      no_log: true

    - name: Assert breakglass user shadow entry is active SHA-512 hash matching SOPS
      ansible.builtin.assert:
        that:
          - ansible_facts.getent_shadow[gcp.breakglass_user][0] is defined
          - ansible_facts.getent_shadow[gcp.breakglass_user][0].startswith('$6$')
          - ansible_facts.getent_shadow[gcp.breakglass_user][0] == gcp.breakglass_password_hash
        fail_msg: "Breakglass user password hash in /etc/shadow does not match expected SHA-512 hash"
        quiet: true
      no_log: true

    - name: Check systemd enabled state of compose timers # noqa: command-instead-of-module
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - "{{ item }}"
      loop:
        - homelab-compose-reconcile.timer
        - homelab-docker-cleanup.timer
      register: gcp_compose_timers_enabled
      changed_when: false

    - name: Assert compose reconciler and cleanup timers are enabled
      ansible.builtin.assert:
        that:
          - item.stdout | trim == 'enabled'
        fail_msg: "Expected {{ item.item }} to be enabled, got '{{ item.stdout | trim }}'"
      loop: "{{ gcp_compose_timers_enabled.results }}"

    - name: Stat /etc/containers/cosign.pub
      ansible.builtin.stat:
        path: /etc/containers/cosign.pub
      register: gcp_cosign_pub

    - name: Assert /etc/containers/cosign.pub exists
      ansible.builtin.assert:
        that:
          - gcp_cosign_pub.stat.exists
          - gcp_cosign_pub.stat.mode == '0444'
        fail_msg: "/etc/containers/cosign.pub is missing or has unexpected permissions"

    - name: Read /etc/docker/daemon.json
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: gcp_daemon_json

    - name: Assert /etc/docker/daemon.json configures json-file log rotation and live-restore
      vars:
        daemon_cfg: "{{ gcp_daemon_json.content | b64decode | from_json }}"
      ansible.builtin.assert:
        that:
          - daemon_cfg['log-driver'] == 'json-file'
          - daemon_cfg['log-opts']['max-size'] == '10m'
          - daemon_cfg['log-opts']['max-file'] == '3'
          - daemon_cfg['live-restore'] == true
        fail_msg: "/etc/docker/daemon.json does not contain expected log rotation and live-restore options"
