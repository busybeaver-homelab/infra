---
- name: Verify OCI Instance Configuration
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Verify base packages are installed
      ansible.builtin.package:
        name:
          - curl
          - wget
          - jq
          - unzip
          - ca-certificates
        state: present
      check_mode: true
      register: pkg_check
      failed_when: pkg_check.changed

    - name: Verify dedicated docker service user was created
      ansible.builtin.user:
        name: dockerapp
        state: present
      check_mode: true
      register: user_check
      failed_when: user_check.changed

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert OpenSSH service is not active
      ansible.builtin.assert:
        that:
          - ansible_facts.services['ssh.service']['state'] | default('stopped') != 'running'
        fail_msg: "OpenSSH service (ssh.service) should not be active"

    - name: Assert OpenSSH socket is not active
      ansible.builtin.assert:
        that:
          - ansible_facts.services['ssh.socket']['state'] | default('stopped') != 'running'
        fail_msg: "OpenSSH socket (ssh.socket) should not be active"

    - name: Check systemd enabled state of ssh.socket and ssh.service # noqa: command-instead-of-module
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - "{{ item }}"
      loop:
        - ssh.socket
        - ssh.service
      register: ssh_unit_enabled
      changed_when: false
      failed_when: false

    - name: Assert ssh.socket and ssh.service are masked
      ansible.builtin.assert:
        that:
          - item.stdout | trim == 'masked'
        fail_msg: "Expected {{ item.item }} to be masked, got '{{ item.stdout | trim }}'"
      loop: "{{ ssh_unit_enabled.results }}"

    - name: Verify port 22 is not listening
      ansible.builtin.wait_for:
        port: 22
        state: stopped
        timeout: 5

    - name: Check /etc/firewall.bash exists
      ansible.builtin.stat:
        path: /etc/firewall.bash
      register: firewall_script

    - name: Assert firewall script exists and is executable
      ansible.builtin.assert:
        that:
          - firewall_script.stat.exists
          - firewall_script.stat.executable
        fail_msg: "/etc/firewall.bash does not exist or is not executable"

    - name: Read iptables rules
      ansible.builtin.command: iptables -S
      register: iptables_rules
      changed_when: false

    - name: Assert iptables contains Tailscale UDP 41641 and tailscale0 interface rules
      ansible.builtin.assert:
        that:
          - "'-p udp -m udp --dport 41641 -j ACCEPT' in iptables_rules.stdout"
          - "'-i tailscale0 -j ACCEPT' in iptables_rules.stdout"
          - "'--dport 22 -j ACCEPT' not in iptables_rules.stdout"
        fail_msg: "Firewall rules do not match expected Tailscale and SSH restrictions"

    - name: Load SOPS credentials for breakglass verification
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../../../secrets/credentials.ci.sops.yaml"
      no_log: true

    - name: Read primary restic backup environment file
      ansible.builtin.slurp:
        src: /etc/restic/primary.env
      register: oci_primary_env

    - name: Assert primary restic backup points to synthetic OCI Object Storage S3 endpoint
      ansible.builtin.assert:
        that:
          - "'s3:https://objectstorage.eu-frankfurt-1.example.test/molecule-oci-backups/' in (oci_primary_env.content | b64decode)"
        fail_msg: "Primary restic backup environment does not point to expected OCI Object Storage repository"

    - name: Read secondary restic backup environment file
      ansible.builtin.slurp:
        src: /etc/restic/secondary.env
      register: oci_secondary_env

    - name: Assert secondary restic backup points to synthetic Cloudflare R2 S3 endpoint
      ansible.builtin.assert:
        that:
          - "'s3:https://00000000000000000000000000000000.r2.example.test/molecule-r2-backups-dr/' in (oci_secondary_env.content | b64decode)"
        fail_msg: "Secondary restic backup environment does not point to expected Cloudflare R2 repository"

    - name: Verify breakglass user exists in passwd database
      ansible.builtin.getent:
        database: passwd
        key: "{{ oci.breakglass_user }}"
      no_log: true

    - name: Verify breakglass user has shadow entry
      ansible.builtin.getent:
        database: shadow
        key: "{{ oci.breakglass_user }}"
      no_log: true

    - name: Assert breakglass user shadow entry is active SHA-512 hash matching SOPS
      ansible.builtin.assert:
        that:
          - ansible_facts.getent_shadow[oci.breakglass_user][0] is defined
          - ansible_facts.getent_shadow[oci.breakglass_user][0].startswith('$6$')
          - ansible_facts.getent_shadow[oci.breakglass_user][0] == oci.breakglass_password_hash
        fail_msg: "Breakglass user password hash in /etc/shadow does not match expected SHA-512 hash"
        quiet: true
      no_log: true

    - name: Check systemd enabled state of compose timers # noqa: command-instead-of-module
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - "{{ item }}"
      loop:
        - homelab-compose-reconcile.timer
        - homelab-docker-cleanup.timer
      register: oci_compose_timers_enabled
      changed_when: false

    - name: Assert compose reconciler and cleanup timers are enabled
      ansible.builtin.assert:
        that:
          - item.stdout | trim == 'enabled'
        fail_msg: "Expected {{ item.item }} to be enabled, got '{{ item.stdout | trim }}'"
      loop: "{{ oci_compose_timers_enabled.results }}"

    - name: Stat /etc/containers/cosign.pub
      ansible.builtin.stat:
        path: /etc/containers/cosign.pub
      register: oci_cosign_pub

    - name: Assert /etc/containers/cosign.pub exists
      ansible.builtin.assert:
        that:
          - oci_cosign_pub.stat.exists
          - oci_cosign_pub.stat.mode == '0444'
        fail_msg: "/etc/containers/cosign.pub is missing or has unexpected permissions"

    - name: Read /etc/docker/daemon.json
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: oci_daemon_json

    - name: Assert /etc/docker/daemon.json configures json-file log rotation and live-restore
      vars:
        daemon_cfg: "{{ oci_daemon_json.content | b64decode | from_json }}"
      ansible.builtin.assert:
        that:
          - daemon_cfg['log-driver'] == 'json-file'
          - daemon_cfg['log-opts']['max-size'] == '10m'
          - daemon_cfg['log-opts']['max-file'] == '3'
          - daemon_cfg['live-restore'] == true
        fail_msg: "/etc/docker/daemon.json does not contain expected log rotation and live-restore options"
