---
dependency:
  name: galaxy
  enabled: false
  options:
    role-file: ${MOLECULE_PROJECT_DIRECTORY}/roles/requirements.yml
    roles-path: ~/.ansible/roles

driver:
  name: docker

platforms:
  - name: oci-ubuntu-server-26
    groups:
      - oci
    image: geerlingguy/docker-ubuntu2604-ansible:latest@sha256:f588e42eff0a028a431f95d9cbb5a942bc6ccddae6289f494f73fa191700d44f
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ${MOLECULE_PROJECT_DIRECTORY}/.cache/apt/archives:/var/cache/apt/archives:rw
    cgroupns_mode: host
    command: /lib/systemd/systemd

provisioner:
  name: ansible
  inventory:
    links:
      group_vars: ../../group_vars
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles:~/.ansible/roles"
    SOPS_AGE_KEY_FILE: "${HOME}/.config/sops/age/keys.txt"
  config_options:
    defaults:
      callbacks_enabled: profile_tasks
      remote_tmp: /tmp
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/roles:~/.ansible/roles
    connection:
      pipelining: true
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml

scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

verifier:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles:~/.ansible/roles"
    SOPS_AGE_KEY_FILE: "${HOME}/.config/sops/age/keys.txt"
