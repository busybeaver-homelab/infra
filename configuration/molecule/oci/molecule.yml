---
dependency:
  name: galaxy
  options:
    role-file: ${MOLECULE_PROJECT_DIRECTORY}/roles/requirements.yml
    roles-path: ~/.ansible/roles

driver:
  name: docker

platforms:
  - name: oci-ubuntu-server-26
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /lib/systemd/systemd

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles:~/.ansible/roles"
    SOPS_AGE_KEY: "AGE-SECRET-KEY-REDACTED-LEAKED-AGE-KEY"
  config_options:
    defaults:
      callbacks_enabled: profile_tasks
      remote_tmp: /tmp
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/roles:~/.ansible/roles
  playbooks:
    converge: converge.yml
    verify: verify.yml

verifier:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles:~/.ansible/roles"
    SOPS_AGE_KEY: "AGE-SECRET-KEY-REDACTED-LEAKED-AGE-KEY"
