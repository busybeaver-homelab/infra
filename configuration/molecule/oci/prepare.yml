---
- name: Prepare OCI test container
  hosts: all
  become: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install openssh-server for test environment
      ansible.builtin.apt:
        name: openssh-server
        state: present

    - name: Ensure ssh.socket is enabled to mirror Ubuntu 26.04 cloud image
      ansible.builtin.systemd_service:
        name: ssh.socket
        masked: false
        enabled: true
        daemon_reload: true
