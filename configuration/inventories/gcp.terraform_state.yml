---
# Ansible Dynamic Inventory — reads GCP compute instances from Cloudflare R2 OpenTofu state.
# OpenTofu state is stored in Cloudflare R2 (EU jurisdiction) and encrypted with AES-GCM.
# The TOFU_STATE_PASSPHRASE env var must be set for state decryption in RAM.

plugin: cloud.terraform.terraform_state
binary_path: tofu

backend_type: s3
backend_config:
  endpoint: "https://<account_id>.r2.cloudflarestorage.com"
  bucket: "homelab-infra-tfstate"
  key: "homelab-infra/state/gcp/tofu.tfstate"
  region: "auto"
  force_path_style: true
  skip_credentials_validation: true
  skip_region_validation: true
  skip_requesting_account_id: true
  skip_s3_checksum: true

provider_mapping:
  - provider_name: registry.terraform.io/oracle/oci
    types:
      - oci_core_instance
  - provider_name: registry.terraform.io/hashicorp/google
    types:
      - google_compute_instance

hostnames:
  - name
  - display_name
  - id

compose:
  ansible_host: (display_name | default(name)) ~ '.' ~ (tailnet_domain | default('example')) ~ '.ts.net'
  tailscale_ip: private_ip if (private_ip is defined) else network_interface[0].network_ip

groups:
  oci: display_name is defined
  gcp: machine_type is defined
  cloud: display_name is defined or machine_type is defined

keyed_groups:
  - prefix: tag
    key: freeform_tags
  - prefix: tag
    key: labels
