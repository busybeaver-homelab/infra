---
# Ansible Dynamic Inventory — reads hosts from local OpenTofu state files.
# OpenTofu state is stored encrypted (AES-GCM) in each module directory.
# The TOFU_ENCRYPTION_PASSPHRASE env var must be set for decryption to succeed.

plugin: cloud.terraform.terraform_state

# Use the OpenTofu binary
binary_path: tofu

# Read from local state file — homelab module provisions SSH-accessible hosts
backend_type: local
backend_config:
  path: "infrastructure/homelab/terraform.tfstate"

# Map OpenTofu output values to Ansible inventory variables
hostname_from_provider: true
compose:
  ansible_host: ip_address
