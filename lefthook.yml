# Lefthook Configuration File
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    # OpenTofu Formatter
    tofu-fmt:
      root: "infrastructure/"
      glob: "*.tf"
      run: tofu fmt -recursive {staged_files}
      stage_fixed: true

    # OpenTofu Linter
    tofu-lint:
      root: "infrastructure/"
      glob: "*.tf"
      run: tflint --recursive

    # Auto-generate OpenTofu documentation
    terraform-docs:
      glob: "*.tf"
      exclude: '(^|/)(\.agent|\.agents|\.ruff_cache|\.venv|\.worktrees)(/|$)'
      run: bash scripts/generate-tf-docs.sh {staged_files} && git add "infrastructure/**/README.md"

    # Oxc Formatter (JSON, YAML, Markdown, JS)
    oxfmt:
      glob: "*.{js,json,md,yml,yaml}"
      exclude: '(^|/)(\.agent|\.agents|\.ruff_cache|\.venv|\.worktrees)(/|$)'
      run: bash scripts/run-oxfmt.sh {staged_files}
      stage_fixed: true

    # Oxc Linter (Frontend/Apps)
    oxlint:
      glob: "apps/**/*.{js,ts,jsx,tsx}"
      run: oxlint -c .oxlintrc.json {staged_files}

    # Shell Script Formatter (shfmt)
    shfmt:
      glob: "*.sh"
      exclude: '(^|/)(\.agent|\.agents|\.ruff_cache|\.venv|\.worktrees)(/|$)'
      run: shfmt -w -i 2 -ci {staged_files}
      stage_fixed: true

    # Python Linter and Formatter (Ruff)
    ruff-format:
      glob: "*.py"
      exclude: '(^|/)(\.agent|\.agents|\.ruff_cache|\.venv|\.worktrees)(/|$)'
      run: ruff format --check {staged_files}
      stage_fixed: true
    ruff-lint:
      glob: "*.py"
      exclude: '(^|/)(\.agent|\.agents|\.ruff_cache|\.venv|\.worktrees)(/|$)'
      run: ruff check {staged_files}

    # Shell Linter (Shellcheck)
    shellcheck:
      glob: "*.sh"
      exclude: '(^|/)(\.agent|\.agents|\.ruff_cache|\.venv|\.worktrees)(/|$)'
      run: shellcheck {staged_files}

    # Cloudflare module guards: lifecycle protections + identifying-value leak guards
    cloudflare-guards:
      glob: "{infrastructure/cloudflare/**,tests/scripts/cloudflare-guards.bats}"
      run: bats tests/scripts/cloudflare-guards.bats

    # NextDNS module guards: lifecycle protections + identifying-value leak guards
    dns-guards:
      glob: "{infrastructure/dns/**,tests/scripts/dns-guards.bats}"
      run: bats tests/scripts/dns-guards.bats

    # Secrets Scanner (Trufflehog)
    trufflehog:
      exclude: '(^|/)(\.agent|\.agents|\.ruff_cache|\.venv|\.worktrees)(/|$)'
      run: trufflehog filesystem {staged_files} --results=verified,unknown --fail

    # GitHub Actions Workflow Linter (actionlint)
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      exclude: '(^|/)(\.agent|\.agents|\.ruff_cache|\.venv|\.worktrees)(/|$)'
      run: actionlint {staged_files}

    # Ansible Linter
    ansible-lint:
      glob: "configuration/**/*.{yml,yaml}"
      exclude: '(^|/)(\.agent|\.agents|\.ruff_cache|\.venv|\.worktrees)(/|$)'
      run: ansible-lint {staged_files}

    # Custom SOPS Metadata Verification (P2-4)
    # Checks that all committed *.sops.yaml files and YAML/JSON files under secrets/ are actually encrypted
    verify-sops-encryption:
      glob: "{*.sops.{yml,yaml,json},secrets/**/*.{yml,yaml,json}}"
      exclude: '(^|/)(\.agent|\.agents|\.ruff_cache|\.venv|\.worktrees)(/|$)'
      run: bash scripts/verify-sops-encryption.sh {staged_files}

    # Custom Ansible Vault Prevention (P2-5)
    # Blocks any commits containing files with $ANSIBLE_VAULT to enforce SOPS usage
    block-ansible-vault:
      exclude: '(^|/)(\.agent|\.agents|\.ruff_cache|\.venv|\.worktrees)(/|$)'
      run: bash scripts/block-ansible-vault.sh {staged_files}

    # Custom Private Key Detector (P0-TASK-5)
    # Scans staged files for raw Age keys and PEM/SSH private key headers
    detect-private-keys:
      exclude: '(^|/)(\.agent|\.agents|\.ruff_cache|\.venv|\.worktrees)(/|$)'
      run: bash scripts/detect-private-keys.sh {staged_files}

    # Custom Network Masking Guard (P2-7)
    # Scans staged files for unencrypted RFC1918 and CGNAT IPv4 addresses
    network-masking:
      exclude: '(^|/)(\.agent|\.agents|\.ruff_cache|\.venv|\.worktrees)(/|$)'
      run: bash scripts/check-network-masking.sh {staged_files}

    # Secrets Schema Parity Check (P2-8)
    # Verifies key hierarchy parity between production and CI SOPS credentials files
    secrets-schema-parity:
      glob: "secrets/credentials*.sops.{yml,yaml}"
      exclude: '(^|/)(\.agent|\.agents|\.ruff_cache|\.venv|\.worktrees)(/|$)'
      run: bash scripts/check-secrets-schema-parity.sh secrets/credentials.sops.yaml secrets/credentials.ci.sops.yaml

    # SOPS Secret Leak Detector
    # Scans staged plaintext files (including .bats, .tftest.hcl, Molecule) for decrypted SOPS secret values
    sops-secret-leaks:
      exclude: '(^|/)(\.ruff_cache|\.venv|\.worktrees)(/|$)'
      run: bash scripts/check-sops-secret-leaks.sh --check-files {staged_files}

    # SOPS recipient allowlist: the canonical files and .sops.yaml may only use active
    # recipients from .sops-recipients.allowlist (R2-SEC-01). History: bats test.
    sops-recipients:
      run: bash scripts/check-sops-recipients.sh

    # SOPS Prod-vs-CI Value Disjointness & Full-Repo Leak Check
    # Ensures secrets/credentials.ci.sops.yaml never shares secret values with secrets/credentials.sops.yaml
    # and scans all tracked repo files against the updated SOPS files in a single pass
    sops-disjointness:
      glob: "secrets/credentials*.sops.{yml,yaml}"
      exclude: '(^|/)(\.agent|\.agents|\.ruff_cache|\.venv|\.worktrees)(/|$)'
      run: bash scripts/check-sops-secret-leaks.sh --check-disjointness --all-files

    # Mise Lockfile Synchronization Check
    mise-lock-check:
      glob: "mise.{toml,lock}"
      exclude: '(^|/)(\.agent|\.agents|\.ruff_cache|\.venv|\.worktrees)(/|$)'
      run: mise lock --dry-run

commit-msg:
  commands:
    conventional-commits:
      run: bash scripts/verify-commit-msg.sh {1}

pre-push:
  commands:
    guard-main-push:
      use_stdin: true
      run: bash scripts/guard-main-push.sh
