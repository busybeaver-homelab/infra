# Lefthook Configuration File
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    # OpenTofu Formatter
    tofu-fmt:
      root: "infrastructure/"
      glob: "*.tf"
      run: tofu fmt -recursive {staged_files}
      stage_fixed: true

    # OpenTofu Linter
    tofu-lint:
      root: "infrastructure/"
      glob: "*.tf"
      run: tflint --recursive

    # Auto-generate OpenTofu documentation
    terraform-docs:
      glob: "*.tf"
      exclude: '(^|/)(\.agent|\.agents|\.ruff_cache|\.venv|\.worktrees)(/|$)'
      run: bash scripts/generate-tf-docs.sh && git add "infrastructure/**/README.md"

    # Oxc Formatter (JSON, YAML, Markdown, JS)
    oxfmt:
      glob: "*.{js,json,md,yml,yaml}"
      exclude: '(^|/)(\.agent|\.agents|\.ruff_cache|\.venv|\.worktrees)(/|$)'
      run: oxfmt -c .oxfmtrc.json --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    # Oxc Linter (Frontend/Apps)
    oxlint:
      glob: "apps/**/*.{js,ts,jsx,tsx}"
      run: oxlint -c .oxlintrc.json {staged_files}

    # Shell Script Formatter (shfmt)
    shfmt:
      glob: "*.sh"
      exclude: '(^|/)(\.agent|\.agents|\.ruff_cache|\.venv|\.worktrees)(/|$)'
      run: shfmt -w -i 2 -ci {staged_files}
      stage_fixed: true

    # Python Linter and Formatter (Ruff)
    ruff-format:
      glob: "*.py"
      exclude: '(^|/)(\.agent|\.agents|\.ruff_cache|\.venv|\.worktrees)(/|$)'
      run: ruff format --check {staged_files}
      stage_fixed: true
    ruff-lint:
      glob: "*.py"
      exclude: '(^|/)(\.agent|\.agents|\.ruff_cache|\.venv|\.worktrees)(/|$)'
      run: ruff check {staged_files}

    # Shell Linter (Shellcheck)
    shellcheck:
      glob: "*.sh"
      exclude: '(^|/)(\.agent|\.agents|\.ruff_cache|\.venv|\.worktrees)(/|$)'
      run: shellcheck {staged_files}

    # Secrets Scanner (Trufflehog)
    trufflehog:
      exclude: '(^|/)(\.agent|\.agents|\.ruff_cache|\.venv|\.worktrees)(/|$)'
      run: trufflehog filesystem {staged_files} --results=verified,unknown --fail

    # Ansible Linter
    ansible-lint:
      glob: "configuration/**/*.{yml,yaml}"
      exclude: '(^|/)(\.agent|\.agents|\.ruff_cache|\.venv|\.worktrees)(/|$)'
      run: ansible-lint {staged_files}

    # Custom SOPS Metadata Verification (P2-4)
    # Checks that all committed *.sops.yaml files are actually encrypted
    verify-sops-encryption:
      glob: "*.sops.{yml,yaml,json}"
      exclude: '(^|/)(\.agent|\.agents|\.ruff_cache|\.venv|\.worktrees)(/|$)'
      run: bash scripts/verify-sops-encryption.sh {staged_files}

    # Custom Ansible Vault Prevention (P2-5)
    # Blocks any commits containing files with $ANSIBLE_VAULT to enforce SOPS usage
    block-ansible-vault:
      exclude: '(^|/)(\.agent|\.agents|\.ruff_cache|\.venv|\.worktrees)(/|$)'
      run: bash scripts/block-ansible-vault.sh {staged_files}

    # Custom Private Key Detector (P0-TASK-5)
    # Scans staged files for raw Age keys and PEM/SSH private key headers
    detect-private-keys:
      exclude: '(^|/)(\.agent|\.agents|\.ruff_cache|\.venv|\.worktrees)(/|$)'
      run: bash scripts/detect-private-keys.sh {staged_files}

commit-msg:
  commands:
    conventional-commits:
      run: bash scripts/verify-commit-msg.sh {1}
