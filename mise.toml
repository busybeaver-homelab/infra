[tasks."test:infra"]
description = "Run native OpenTofu tests across all infrastructure modules"
run = '''
#!/usr/bin/env bash
set -euo pipefail
modules=(oci cloudflare gcp azure github homelab monitoring)
for mod in "${modules[@]}"; do
  echo "==> Running tofu test in infrastructure/$mod..."
  (cd "infrastructure/$mod" && tofu test -test-directory=tests)
done
'''

[settings]
lockfile = true