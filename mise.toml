min_version = "2026.10.8" # renovate: datasource=github-releases depName=jdx/mise

[tools]
opentofu = "1.13"
tflint = "0.64"
sops = "3.13"
age = "1.3"
lefthook = "2.1"
python = "3.14"
uv = "0.13"
ruff = "0.16"
shellcheck = "0.11"
"terraform-docs" = "0.24"
act            = "0.2"
trufflehog     = "3"
bats           = "1.14"
go             = "1.27"
oxlint         = "1.84"
oxfmt          = "0.71"
shfmt          = "3.14"
yq             = "4"
node           = "lts"
actionlint     = "1.7"
trivy          = "0.75"
gh             = "2.102"
"aqua:shenwei356/rush" = "0.11.0"


[env]
_.python.venv = ".venv"
TF_PLUGIN_CACHE_DIR = "{{config_root}}/.cache/tofu/plugins"

[tasks.lint]
description = "Run all pre-commit hooks for linting and formatting"
run = "lefthook run pre-commit --all-files"

[tasks."fmt:tofu"]
description = "Format OpenTofu configurations"
run = "tofu fmt -recursive"

[tasks.fmt]
description = "Run all formatters"
depends = ["fmt:tofu", "fmt:python", "fmt:ansible", "fmt:general", "fmt:shell"]

[tasks."fmt:ansible"]
description = "Format Ansible Playbooks & Roles"
run = "ansible-lint --write"

[tasks."fmt:general"]
description = "Format JSON, Markdown, YAML, and JS files"
run = "oxfmt -c .oxfmtrc.json apps/"

[tasks."fmt:shell"]
description = "Format shell scripts"
run = "shfmt -w -i 2 -ci scripts/ tests/scripts/"

[tasks."fmt:python"]
description = "Format Python code"
run = "ruff format"

[tasks.check]
description = "Run all linters and static checks"
depends = ["check:python", "check:ansible", "check:shell", "check:general"]


[tasks."check:ansible"]
description = "Lint Ansible configurations"
run = "ansible-lint configuration/"

[tasks."check:shell"]
description = "Check shell scripts"
run = "shellcheck scripts/*.sh"



[tasks."check:python"]
description = "Check Python code"
run = "ruff check"

[tasks."check:general"]
description = "Check general files (JS/TS) with oxlint"
run = "oxlint -c .oxlintrc.json --no-error-on-unmatched-pattern apps/"

[tasks."check:security:trivy"]
description = "Scan repository files and configurations for security vulnerabilities with Trivy"
run = "trivy fs --exit-code 0 --severity HIGH,CRITICAL --ignore-unfixed . && trivy config --exit-code 0 infrastructure/ configuration/"

[tasks."check:security:checkov"]
description = "Scan OpenTofu and Ansible configurations with Checkov"
run = "uvx checkov -d infrastructure -d configuration --framework terraform,ansible"

[tasks."check:security:kics"]
description = "Scan OpenTofu and Ansible configurations with Checkmarx KICS"
run = "scripts/run-kics.sh"

[tasks."check:security"]
description = "Run full static analysis and IaC security scan matrix (Trivy, Checkov, KICS)"
depends = ["check:security:trivy", "check:security:checkov", "check:security:kics"]


[tasks.test]
description = "Run all test suites"
depends = ["test:infra", "test:ansible", "test:scripts"]

[tasks."test:all"]
description = "Run all test suites (infrastructure, child modules, mutations, ansible molecule matrix, bats scripts)"
depends = ["test:infra", "test:tofu:children", "test:tofu:mutations", "test:ansible", "test:scripts"]

[tasks."test:ansible:base"]
description = "Run Molecule tests for base_ubuntu_server role"
dir = "configuration/roles/base_ubuntu_server"
run = "molecule test"

[tasks."test:ansible:restic"]
description = "Run Molecule tests for restic_backup role"
dir = "configuration/roles/restic_backup"
run = "molecule test"

[tasks."test:ansible:oci"]
description = "Run Molecule tests for OCI scenario"
dir = "configuration"
run = "molecule test -s oci"

[tasks."test:ansible:homelab"]
description = "Run Molecule tests for homelab scenario"
dir = "configuration"
run = "molecule test -s homelab"

[tasks."test:ansible"]
description = "Run full Molecule test matrix concurrently across all Ansible roles and scenarios"
run = '''
#!/usr/bin/env bash
set -euo pipefail

scenarios=(
  "base:configuration/roles/base_ubuntu_server:molecule test"
  "restic:configuration/roles/restic_backup:molecule test"
  "oci:configuration:molecule test -s oci"
  "homelab:configuration:molecule test -s homelab"
)

tmp_dir=$(mktemp -d)
trap 'rm -rf "$tmp_dir"' EXIT

pids=()
for item in "${scenarios[@]}"; do
  IFS=':' read -r name dir cmd <<< "$item"
  (
    set +e
    (cd "$dir" && eval "$cmd") >"$tmp_dir/$name.log" 2>&1
    echo $? >"$tmp_dir/$name.exit"
  ) &
  pids+=($!)
done

for pid in "${pids[@]}"; do
  wait "$pid" 2>/dev/null || true
done

failed=0
for item in "${scenarios[@]}"; do
  IFS=':' read -r name dir cmd <<< "$item"
  exit_val=$(cat "$tmp_dir/$name.exit" 2>/dev/null || echo 1)
  if [ "$exit_val" -eq 0 ]; then
    echo "==> [PASS] Molecule scenario: $name"
  else
    echo "==> [FAIL] Molecule scenario: $name (exit code: $exit_val)"
    cat "$tmp_dir/$name.log"
    failed=1
  fi
done

if [ "$failed" -ne 0 ]; then
  exit 1
fi
'''

[tasks."test:ansible:serial"]
description = "Run all Molecule test scenarios sequentially"
depends = ["test:ansible:base", "test:ansible:restic", "test:ansible:oci", "test:ansible:homelab"]

[tasks."test:molecule"]
description = "Run full Molecule test matrix across all Ansible roles and scenarios (alias for test:ansible)"
depends = ["test:ansible"]

[tasks."test:ansible:fast:base"]
description = "Fast iterate on base_ubuntu_server role (converge and verify)"
dir = "configuration/roles/base_ubuntu_server"
run = "molecule converge && molecule verify"

[tasks."test:ansible:fast:restic"]
description = "Fast iterate on restic_backup role (converge and verify)"
dir = "configuration/roles/restic_backup"
run = "molecule converge && molecule verify"

[tasks."test:ansible:fast:oci"]
description = "Fast iterate on OCI scenario (converge and verify)"
dir = "configuration"
run = "molecule converge -s oci && molecule verify -s oci"

[tasks."test:ansible:fast:homelab"]
description = "Fast iterate on homelab scenario (converge and verify)"
dir = "configuration"
run = "molecule converge -s homelab && molecule verify -s homelab"

[tasks."test:ansible:fast"]
description = "Fast iterate concurrently across all Ansible roles and scenarios (converge and verify without rebuild)"
run = '''
#!/usr/bin/env bash
set -euo pipefail

scenarios=(
  "base:configuration/roles/base_ubuntu_server:molecule converge && molecule verify"
  "restic:configuration/roles/restic_backup:molecule converge && molecule verify"
  "oci:configuration:molecule converge -s oci && molecule verify -s oci"
  "homelab:configuration:molecule converge -s homelab && molecule verify -s homelab"
)

tmp_dir=$(mktemp -d)
trap 'rm -rf "$tmp_dir"' EXIT

pids=()
for item in "${scenarios[@]}"; do
  IFS=':' read -r name dir cmd <<< "$item"
  (
    set +e
    (cd "$dir" && eval "$cmd") >"$tmp_dir/$name.log" 2>&1
    echo $? >"$tmp_dir/$name.exit"
  ) &
  pids+=($!)
done

for pid in "${pids[@]}"; do
  wait "$pid" 2>/dev/null || true
done

failed=0
for item in "${scenarios[@]}"; do
  IFS=':' read -r name dir cmd <<< "$item"
  exit_val=$(cat "$tmp_dir/$name.exit" 2>/dev/null || echo 1)
  if [ "$exit_val" -eq 0 ]; then
    echo "==> [PASS] Fast iterate scenario: $name"
  else
    echo "==> [FAIL] Fast iterate scenario: $name (exit code: $exit_val)"
    cat "$tmp_dir/$name.log"
    failed=1
  fi
done

if [ "$failed" -ne 0 ]; then
  exit 1
fi
'''

[tasks."test:ansible:clean:base"]
description = "Destroy Molecule test containers for base_ubuntu_server role"
dir = "configuration/roles/base_ubuntu_server"
run = "molecule destroy"

[tasks."test:ansible:clean:restic"]
description = "Destroy Molecule test containers for restic_backup role"
dir = "configuration/roles/restic_backup"
run = "molecule destroy"

[tasks."test:ansible:clean:oci"]
description = "Destroy Molecule test containers for OCI scenario"
dir = "configuration"
run = "molecule destroy -s oci"

[tasks."test:ansible:clean:homelab"]
description = "Destroy Molecule test containers for homelab scenario"
dir = "configuration"
run = "molecule destroy -s homelab"

[tasks."test:ansible:clean"]
description = "Destroy all Molecule test containers across all roles and scenarios"
depends = ["test:ansible:clean:base", "test:ansible:clean:restic", "test:ansible:clean:oci", "test:ansible:clean:homelab"]

[tasks."test:scripts"]
description = "Run Bats tests for scripts"
run = "bats tests/scripts/"

[tasks."ci:local"]
description = "Run GitHub Actions workflows locally"
run = "act -W .github/workflows/"

[tasks."drift:cloudflare"]
description = "Detect drift in infrastructure/cloudflare locally (needs production SOPS; summary-only output)"
run = "bash scripts/drift-cloudflare.sh"

[tasks."docs:generate"]
description = "Generate OpenTofu module documentation"
run = "terraform-docs markdown table --output-file README.md --output-mode inject infrastructure/"

[tasks."secret:prod:set"]
description = "Set or override a production secret"
usage = '''
arg "<key>" help="Name of the secret to set"
arg "[file]" help="File containing the secret value (if omitted, clipboard is used)"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
KEY="${usage_key}"
FILE="${usage_file}"

if [ -n "$FILE" ]; then
  VAL=$(cat "$FILE")
else
  VAL=$(pbpaste)
fi

# Convert value to JSON string for sops
JSON_VAL=$(echo -n "$VAL" | python -c 'import sys, json; print(json.dumps(sys.stdin.read()))')

sops set secrets/credentials.sops.yaml "[\"$KEY\"]" "$JSON_VAL"
echo "Set secret $KEY in secrets/credentials.sops.yaml"
'''

[tasks."secret:prod:get"]
description = "Get a production secret"
usage = 'arg "<key>" help="Name of the secret to get"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
sops -d --extract "[\"${usage_key}\"]" secrets/credentials.sops.yaml
'''

[tasks."secret:prod:delete"]
description = "Delete a production secret"
usage = 'arg "<key>" help="Name of the secret to delete"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
sops unset secrets/credentials.sops.yaml "[\"${usage_key}\"]"
echo "Deleted secret ${usage_key} from secrets/credentials.sops.yaml"
'''

[tasks."secret:ci:set"]
description = "Set or override a CI secret"
usage = '''
arg "<key>" help="Name of the secret to set"
arg "[file]" help="File containing the secret value (if omitted, clipboard is used)"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
KEY="${usage_key}"
FILE="${usage_file}"

if [ -n "$FILE" ]; then
  VAL=$(cat "$FILE")
else
  VAL=$(pbpaste)
fi

# Convert value to JSON string for sops
JSON_VAL=$(echo -n "$VAL" | python -c 'import sys, json; print(json.dumps(sys.stdin.read()))')

sops set secrets/credentials.ci.sops.yaml "[\"$KEY\"]" "$JSON_VAL"
echo "Set secret $KEY in secrets/credentials.ci.sops.yaml"
'''

[tasks."secret:ci:get"]
description = "Get a CI secret"
usage = 'arg "<key>" help="Name of the secret to get"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
sops -d --extract "[\"${usage_key}\"]" secrets/credentials.ci.sops.yaml
'''

[tasks."secret:ci:delete"]
description = "Delete a CI secret"
usage = 'arg "<key>" help="Name of the secret to delete"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
sops unset secrets/credentials.ci.sops.yaml "[\"${usage_key}\"]"
echo "Deleted secret ${usage_key} from secrets/credentials.ci.sops.yaml"
'''

[tasks."secret:verify"]
description = "Verify that canonical SOPS files contain only encrypted values"
run = "bash scripts/verify-sops-encryption.sh"

[tasks."github:sync"]
description = "Sync non-Terraform repository settings (immutable releases, retention, contributor approval) via GitHub API"
run = "scripts/sync-github-repo-settings.sh"

[tasks."sync:cloudflare:budget"]
description = "Sync Cloudflare live billing budget alert to minimum threshold ($1 USD)"
run = "scripts/sync-cloudflare-budget-alert.sh"

[tasks."skills:update"]
description = "Update AI agent skills and synchronize skills-lock.json"
run = "npx skills update -p -y"

[tasks."test:infra"]
description = "Run native OpenTofu tests concurrently across all infrastructure modules"
run = '''
mkdir -p "${TF_PLUGIN_CACHE_DIR:-.cache/tofu/plugins}"
printf "%s\n" oci cloudflare gcp azure github homelab monitoring tailscale | \
  rush -k 'tofu -chdir="infrastructure/{}" test -test-directory=tests'
'''

[tasks."test:tofu:children"]
description = "Run unit tests on isolated child modules concurrently"
run = '''
mkdir -p "${TF_PLUGIN_CACHE_DIR:-.cache/tofu/plugins}"
printf "%s\n" cloudflare/modules/zone github/modules/repository | \
  rush -k 'tofu -chdir="infrastructure/{}" test'
'''

[tasks."test:tofu:mutations"]
description = "Run OpenTofu lifecycle mutation tests across all modules concurrently"
run = '''
mkdir -p "${TF_PLUGIN_CACHE_DIR:-.cache/tofu/plugins}"
printf "%s\n" cloudflare gcp github oci tailscale | \
  rush -k 'tofu -chdir="infrastructure/{}" test -filter=tests/mutation.tftest.hcl'
'''

[tasks."test:tofu:checks"]
description = "Verify that native OpenTofu policy check blocks evaluate cleanly across all modules"
run = "mise run test:infra"

[tasks."test:inventory:matrix"]
description = "Run dynamic inventory topology matrix tests"
run = "bats tests/scripts/dynamic-inventory.bats"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]