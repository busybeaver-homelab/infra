[tasks."secret:verify"]
description = "Verify that canonical SOPS files contain only encrypted values"
run = "bash scripts/verify-sops-encryption.sh"

[tasks."github:sync"]
description = "Sync non-Terraform repository settings (immutable releases, retention, contributor approval) via GitHub API"
run = "scripts/sync-github-repo-settings.sh"

[tasks."github:sync:ops"]
description = "Sync OpenTofu backup prune credentials and SOPS restic passwords to GitHub ops environment"
run = "bash scripts/sync-ops-secrets.sh"

[tasks."sync:cloudflare:budget"]
description = "Sync Cloudflare live billing budget alert to minimum threshold ($1 USD)"
run = "scripts/sync-cloudflare-budget-alert.sh"

[tasks."skills:update"]
description = "Update AI agent skills and synchronize skills-lock.json"
# renovate: datasource=npm depName=skills
run = "npx --yes skills@1.7.2 update -p -y"

[tasks."tofu:init"]
description = "Initialize all OpenTofu root modules with -backend=false -lockfile=readonly"
run = '''
mkdir -p "${TF_PLUGIN_CACHE_DIR:-.cache/tofu/plugins}"
for m in infrastructure/*/; do
  [ -f "${m}main.tf" ] || continue
  tofu -chdir="$m" init -backend=false -lockfile=readonly
done
'''

[tasks."test:infra"]
description = "Run native OpenTofu tests concurrently across all infrastructure modules"
run = '''
mkdir -p "${TF_PLUGIN_CACHE_DIR:-.cache/tofu/plugins}"
printf "%s\n" oci cloudflare gcp azure github homelab monitoring mesh dns | \
  rush -k 'tofu -chdir="infrastructure/{}" init -backend=false -lockfile=readonly >/dev/null && tofu -chdir="infrastructure/{}" test -test-directory=tests'
'''

[tasks."test:tofu:children"]
description = "Run unit tests on isolated child modules concurrently"
run = '''
mkdir -p "${TF_PLUGIN_CACHE_DIR:-.cache/tofu/plugins}"
printf "%s\n" cloudflare/modules/zone github/modules/repository dns/modules/profile | \
  rush -k 'tofu -chdir="infrastructure/{}" init -backend=false >/dev/null && tofu -chdir="infrastructure/{}" test'
'''

[tasks."test:tofu:mutations"]
description = "Run OpenTofu lifecycle mutation tests across all modules concurrently"
run = '''
mkdir -p "${TF_PLUGIN_CACHE_DIR:-.cache/tofu/plugins}"
printf "%s\n" cloudflare gcp github oci mesh dns | \
  rush -k 'tofu -chdir="infrastructure/{}" init -backend=false -lockfile=readonly >/dev/null && tofu -chdir="infrastructure/{}" test -filter=tests/mutation.tftest.hcl'
'''

[tasks."test:inventory:matrix"]
description = "Run dynamic inventory topology matrix tests"
run = "bats tests/scripts/dynamic-inventory.bats"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]
disable_backends = ["asdf", "vfox", "cargo", "dotnet", "gem", "go", "npm", "pipx", "spm"]

[settings.aqua]
baked_registry = false