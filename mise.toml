min_version = "2026.10.8" # renovate: datasource=github-releases depName=jdx/mise

[tools]
"aqua:opentofu/opentofu" = "1.13"
"aqua:terraform-linters/tflint" = "0.64"
"aqua:getsops/sops" = "3.13"
"aqua:FiloSottile/age" = "1.3"
"aqua:evilmartians/lefthook" = "2.1"
"core:python" = "3.14"
"aqua:astral-sh/uv" = "0.13"
"aqua:koalaman/shellcheck" = "0.11"
"aqua:terraform-docs/terraform-docs" = "0.24"
"aqua:nektos/act" = "0.2"
"aqua:trufflesecurity/trufflehog" = "3.97"
"aqua:bats-core/bats-core" = "1.14"
"aqua:oxc-project/oxc/oxlint" = "1.84"
"aqua:oxc-project/oxc/oxfmt" = "0.73"
"aqua:mvdan/sh" = "3.14" # shfmt
"aqua:mikefarah/yq" = "4.54"
"core:node" = "24"
"aqua:rhysd/actionlint" = "1.7"
"aqua:aquasecurity/trivy" = "0.75"
"aqua:cli/cli" = "2.102" # gh
"aqua:restic/restic" = "0.18"
"aqua:shenwei356/rush" = "0.11.0"


[env]
_.python.venv = ".venv"
TF_PLUGIN_CACHE_DIR = "{{config_root}}/.cache/tofu/plugins"

[tasks.lint]
description = "Run all pre-commit hooks for linting and formatting"
run = "lefthook run pre-commit --all-files"

[tasks."fmt:tofu"]
description = "Format OpenTofu configurations"
run = "tofu fmt -recursive"

[tasks.fmt]
description = "Run all formatters"
depends = ["fmt:tofu", "fmt:python", "fmt:ansible", "fmt:general", "fmt:shell"]

[tasks."fmt:ansible"]
description = "Format Ansible Playbooks & Roles"
run = "ansible-lint --write"

[tasks."fmt:general"]
description = "Format JSON, Markdown, YAML, and JS files"
run = "oxfmt -c .oxfmtrc.json ."

[tasks."fmt:shell"]
description = "Format shell scripts"
run = "shfmt -w -i 2 -ci scripts/ tests/scripts/"

[tasks."fmt:python"]
description = "Format Python code"
run = "uv run --locked ruff format"

[tasks.check]
description = "Run all linters and static checks"
depends = ["check:python", "check:ansible", "check:shell", "check:general"]

[tasks."deps:galaxy"]
description = "Install pinned Ansible Galaxy roles and collections into configuration/.galaxy"
run = """
ansible-galaxy role install -r configuration/roles/requirements.yml --force -p configuration/.galaxy/roles
ansible-galaxy collection install -r configuration/roles/requirements.yml --force --no-cache -p configuration/.galaxy/collections
"""

[tasks."check:ansible"]
description = "Lint Ansible configurations"
depends = ["deps:galaxy"]
run = "ansible-lint configuration/"

[tasks."check:shell"]
description = "Check shell scripts"
run = "shellcheck scripts/*.sh"



[tasks."check:python"]
description = "Check Python code"
run = "uv run --locked ruff check"

[tasks."check:general"]
description = "Check general files (JS/TS) with oxlint"
run = "oxlint -c .oxlintrc.json --no-error-on-unmatched-pattern ."

[tasks."check:security:trivy"]
description = "Run Trivy IaC, secret, and vulnerability scans (matches CI)"
run = """
trivy config --severity HIGH,CRITICAL --exit-code 1 infrastructure/
trivy fs --skip-dirs .venv,.worktrees --scanners vuln,secret --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 .
"""

[tasks."check:security:checkov"]
description = "Run Checkov static analysis against OpenTofu and Ansible (matches CI)"
run = "uv run --locked checkov -d infrastructure -d configuration --skip-path molecule --framework terraform,ansible --compact --quiet"

[tasks."check:security:zizmor"]
description = "Run zizmor GitHub Actions security audit (auditor persona, matches CI)"
run = "uv run --locked zizmor --persona=auditor ."

[tasks."check:security:kics"]
description = "Scan OpenTofu and Ansible configurations with Checkmarx KICS"
run = "bash scripts/run-kics.sh --format console"

[tasks."check:security"]
description = "Run all local security scanners (Trivy, Checkov, Zizmor, and KICS if Docker is available)"
run = """
mise run check:security:trivy
mise run check:security:checkov
mise run check:security:zizmor
if bash scripts/run-kics.sh --check-docker >/dev/null 2>&1; then
  mise run check:security:kics
else
  echo "⚠️  Skipping KICS scan: Docker daemon is not running."
fi
"""


[tasks.test]
description = "Run all test suites"
depends = ["test:infra", "test:ansible", "test:scripts"]

[tasks."test:all"]
description = "Run all test suites (infrastructure, child modules, mutations, ansible molecule matrix, bats scripts)"
depends = ["test:infra", "test:tofu:children", "test:tofu:mutations", "test:ansible", "test:scripts"]

[tasks."test:ansible:base"]
description = "Run Molecule tests for base_ubuntu_server role"
dir = "configuration/roles/base_ubuntu_server"
run = "molecule test"

[tasks."test:ansible:restic"]
description = "Run Molecule tests for restic_backup role"
dir = "configuration/roles/restic_backup"
run = "molecule test"

[tasks."test:ansible:compose"]
description = "Run Molecule tests for docker_compose_service role"
dir = "configuration/roles/docker_compose_service"
run = "molecule test"

[tasks."test:ansible:oci"]
description = "Run Molecule tests for OCI scenario"
dir = "configuration"
run = "molecule test -s oci"

[tasks."test:ansible:gcp"]
description = "Run Molecule tests for GCP scenario"
dir = "configuration"
run = "molecule test -s gcp"

[tasks."test:ansible:homelab"]
description = "Run Molecule tests for homelab scenario"
dir = "configuration"
run = "molecule test -s homelab"

[tasks."test:ansible"]
description = "Run full Molecule test matrix concurrently across all Ansible roles and scenarios via rush"
run = '''
printf "%s\n" \
  "base:configuration/roles/base_ubuntu_server:molecule test" \
  "restic:configuration/roles/restic_backup:molecule test" \
  "compose:configuration/roles/docker_compose_service:molecule test" \
  "oci:configuration:molecule test -s oci" \
  "gcp:configuration:molecule test -s gcp" \
  "homelab:configuration:molecule test -s homelab" | \
  rush -k -d ':' '(cd "{2}" && eval "{3}")'
'''

[tasks."test:ansible:serial"]
description = "Run all Molecule test scenarios sequentially"
depends = ["test:ansible:base", "test:ansible:restic", "test:ansible:compose", "test:ansible:oci", "test:ansible:gcp", "test:ansible:homelab"]

[tasks."test:molecule"]
description = "Run full Molecule test matrix across all Ansible roles and scenarios (alias for test:ansible)"
depends = ["test:ansible"]

[tasks."test:ansible:fast:base"]
description = "Fast iterate on base_ubuntu_server role (converge and verify)"
dir = "configuration/roles/base_ubuntu_server"
run = "molecule converge && molecule verify"

[tasks."test:ansible:fast:restic"]
description = "Fast iterate on restic_backup role (converge and verify)"
dir = "configuration/roles/restic_backup"
run = "molecule converge && molecule verify"

[tasks."test:ansible:fast:compose"]
description = "Fast iterate on docker_compose_service role (converge and verify)"
dir = "configuration/roles/docker_compose_service"
run = "molecule converge && molecule verify"

[tasks."test:ansible:fast:oci"]
description = "Fast iterate on OCI scenario (converge and verify)"
dir = "configuration"
run = "molecule converge -s oci && molecule verify -s oci"

[tasks."test:ansible:fast:gcp"]
description = "Fast iterate on GCP scenario (converge and verify)"
dir = "configuration"
run = "molecule converge -s gcp && molecule verify -s gcp"

[tasks."test:ansible:fast:homelab"]
description = "Fast iterate on homelab scenario (converge and verify)"
dir = "configuration"
run = "molecule converge -s homelab && molecule verify -s homelab"

[tasks."test:ansible:fast"]
description = "Fast iterate concurrently across all Ansible roles and scenarios (converge and verify without rebuild) via rush"
run = '''
printf "%s\n" \
  "base:configuration/roles/base_ubuntu_server:molecule converge && molecule verify" \
  "restic:configuration/roles/restic_backup:molecule converge && molecule verify" \
  "compose:configuration/roles/docker_compose_service:molecule converge && molecule verify" \
  "oci:configuration:molecule converge -s oci && molecule verify -s oci" \
  "gcp:configuration:molecule converge -s gcp && molecule verify -s gcp" \
  "homelab:configuration:molecule converge -s homelab && molecule verify -s homelab" | \
  rush -k -d ':' '(cd "{2}" && eval "{3}")'
'''

[tasks."test:ansible:clean:base"]
description = "Destroy Molecule test containers for base_ubuntu_server role"
dir = "configuration/roles/base_ubuntu_server"
run = "molecule destroy"

[tasks."test:ansible:clean:restic"]
description = "Destroy Molecule test containers for restic_backup role"
dir = "configuration/roles/restic_backup"
run = "molecule destroy"

[tasks."test:ansible:clean:compose"]
description = "Destroy Molecule test containers for docker_compose_service role"
dir = "configuration/roles/docker_compose_service"
run = "molecule destroy"

[tasks."test:ansible:clean:oci"]
description = "Destroy Molecule test containers for OCI scenario"
dir = "configuration"
run = "molecule destroy -s oci"

[tasks."test:ansible:clean:gcp"]
description = "Destroy Molecule test containers for GCP scenario"
dir = "configuration"
run = "molecule destroy -s gcp"

[tasks."test:ansible:clean:homelab"]
description = "Destroy Molecule test containers for homelab scenario"
dir = "configuration"
run = "molecule destroy -s homelab"

[tasks."test:ansible:clean"]
description = "Destroy all Molecule test containers across all roles and scenarios"
depends = ["test:ansible:clean:base", "test:ansible:clean:restic", "test:ansible:clean:compose", "test:ansible:clean:oci", "test:ansible:clean:gcp", "test:ansible:clean:homelab"]

[tasks."test:scripts"]
description = "Run Bats tests for scripts concurrently via rush"
env = { BATS_PARALLEL_BINARY_NAME = "rush" }
run = "bats --parallel-binary-name rush -j 4 tests/scripts/"

[tasks."ci:local"]
description = "Run the full non-Docker local CI gate (linters, script tests, OpenTofu tests, Ansible lint)"
depends = ["lint", "test:scripts", "test:infra", "check:ansible"]

[tasks."drift:cloudflare"]
description = "Detect drift in infrastructure/cloudflare locally (needs production SOPS; summary-only output)"
run = "bash scripts/drift-cloudflare.sh"

[tasks."drift:dns"]
description = "Detect drift in infrastructure/dns locally (needs production SOPS; summary-only output)"
run = "bash scripts/drift-dns.sh"

[tasks."drift:all"]
description = "Detect drift across all OpenTofu modules locally (needs production SOPS; summary-only output)"
run = "bash scripts/drift.sh --all"

[tasks."state:snapshot"]
description = "Snapshot OpenTofu remote state from R2 to homelab-infra/snapshots/<module>/<timestamp>.tfstate"
run = "bash scripts/snapshot-state.sh"

[tasks."ansible:inventory"]
description = "Generate static Ansible YAML inventory from OpenTofu ansible_inventory outputs"
run = "bash scripts/generate-inventory.sh"

[tasks."docs:generate"]
description = "Generate OpenTofu module documentation"
run = "terraform-docs markdown table --output-file README.md --output-mode inject infrastructure/"

[tasks."secret:prod:set"]
description = "Set or override a production secret"
usage = '''
arg "<key>" help="Name of the secret to set (supports dotted paths, e.g. a.b.c)"
arg "[file]" help="File containing the secret value (if omitted, clipboard or stdin is used)"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
KEY="${usage_key:-${1:-}}"
FILE="${usage_file:-${2:-}}"
TARGET_FILE="${SOPS_PROD_FILE:-secrets/credentials.sops.yaml}"

if [[ -z "$KEY" ]] || ! [[ "$KEY" =~ ^[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*$ ]]; then
  echo "Error: Invalid secret key '$KEY'. Keys must match ^[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*$" >&2
  exit 1
fi

sops_path=""
IFS='.' read -ra parts <<< "$KEY"
for part in "${parts[@]}"; do
  sops_path+="[\"${part}\"]"
done

if [[ -n "$FILE" ]]; then
  VAL=$(cat "$FILE")
elif [[ -p /dev/stdin || -s /dev/stdin ]]; then
  VAL=$(cat)
elif command -v pbpaste >/dev/null 2>&1; then
  VAL=$(pbpaste)
elif command -v wl-paste >/dev/null 2>&1 && [[ -n "${WAYLAND_DISPLAY:-}" ]]; then
  VAL=$(wl-paste --no-newline)
elif command -v xclip >/dev/null 2>&1 && [[ -n "${DISPLAY:-}" ]]; then
  VAL=$(xclip -selection clipboard -o)
elif [[ ! -t 0 ]]; then
  VAL=$(cat)
else
  echo "Error: No clipboard utility (pbpaste/wl-paste/xclip) found and stdin is a TTY." >&2
  exit 1
fi

if [[ -z "$VAL" ]]; then
  echo "Error: Secret value is empty." >&2
  exit 1
fi

printf '%s' "$VAL" | jq -Rs . | sops set --value-stdin "$TARGET_FILE" "$sops_path"
echo "Set secret $KEY in $TARGET_FILE"
'''

[tasks."secret:prod:get"]
description = "Get a production secret"
usage = 'arg "<key>" help="Name of the secret to get (supports dotted paths, e.g. a.b.c)"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
KEY="${usage_key:-${1:-}}"
TARGET_FILE="${SOPS_PROD_FILE:-secrets/credentials.sops.yaml}"

if [[ -z "$KEY" ]] || ! [[ "$KEY" =~ ^[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*$ ]]; then
  echo "Error: Invalid secret key '$KEY'. Keys must match ^[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*$" >&2
  exit 1
fi

sops_path=""
IFS='.' read -ra parts <<< "$KEY"
for part in "${parts[@]}"; do
  sops_path+="[\"${part}\"]"
done

sops -d --extract "$sops_path" "$TARGET_FILE"
'''

[tasks."secret:prod:delete"]
description = "Delete a production secret"
usage = 'arg "<key>" help="Name of the secret to delete (supports dotted paths, e.g. a.b.c)"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
KEY="${usage_key:-${1:-}}"
TARGET_FILE="${SOPS_PROD_FILE:-secrets/credentials.sops.yaml}"

if [[ -z "$KEY" ]] || ! [[ "$KEY" =~ ^[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*$ ]]; then
  echo "Error: Invalid secret key '$KEY'. Keys must match ^[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*$" >&2
  exit 1
fi

yq_path=""
IFS='.' read -ra parts <<< "$KEY"
for part in "${parts[@]}"; do
  yq_path+=".\"${part}\""
done

EDITOR="yq -i 'del(${yq_path})'" sops "$TARGET_FILE"
echo "Deleted secret $KEY from $TARGET_FILE"
'''

