[tools]
opentofu = "1.8"
tflint = "0.55"
ansible = "10"
sops = "3.9"
age = "1.2"
lefthook = "1.10"
python = "3.12"
ruff = "0.9"
shellcheck = "0.10"
"terraform-docs" = "0.19"
act            = "0.2"
trufflehog     = "3"
bats           = "1.11"
go             = "1.26"

[env]
_.python.venv = ".venv"

[tasks.lint]
description = "Run all pre-commit hooks for linting and formatting"
run = "lefthook run pre-commit"

[tasks."fmt:tofu"]
description = "Format OpenTofu configurations"
run = "tofu fmt -recursive"

[tasks."fmt:python"]
description = "Format Python code"
run = "ruff format"

[tasks."check:python"]
description = "Check Python code"
run = "ruff check"

[tasks."test:infra"]
description = "Run Terratest for infrastructure"
dir = "infrastructure/tests"
run = "go test ./... -v -timeout 10m"
