name: "Setup Homelab Environment"
description: "Install and cache mise toolchain, Python venv, TFLint, and Ansible Galaxy dependencies"

inputs:
  python:
    description: "Setup Python virtualenv with uv sync --locked"
    required: false
    default: "false"
  tflint:
    description: "Cache and initialize TFLint plugins"
    required: false
    default: "false"
  galaxy:
    description: "Cache and install Ansible Galaxy requirements"
    required: false
    default: "false"
  tools:
    description: "Optional space-separated subset of mise tools to install (empty installs all tools in mise.toml)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install Mise
      uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      with:
        version: "2026.10.21" # renovate: datasource=github-releases depName=jdx/mise
        cache: true
        install_args: ${{ inputs.tools }}

    - name: Cache uv packages
      if: inputs.python == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-

    - name: Setup Python Virtual Environment
      if: inputs.python == 'true'
      shell: bash
      run: mise exec -- uv sync --locked

    - name: Cache TFLint Plugins
      id: cache-tflint
      if: inputs.tflint == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.tflint.d/plugins
        key: tflint-${{ runner.os }}-${{ hashFiles('.tflint.hcl') }}

    - name: Initialize TFLint
      if: inputs.tflint == 'true' && steps.cache-tflint.outputs.cache-hit != 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
      run: |
        mise exec -- tflint --init --config "$PWD/.tflint.hcl"

    - name: Cache Ansible Galaxy
      id: cache-galaxy
      if: inputs.galaxy == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: configuration/.galaxy
        key: galaxy-${{ runner.os }}-${{ hashFiles('configuration/roles/requirements.yml') }}

    - name: Install Ansible Galaxy requirements
      if: inputs.galaxy == 'true' && steps.cache-galaxy.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mise exec -- ansible-galaxy role install -r configuration/roles/requirements.yml --force -p configuration/.galaxy/roles
        mise exec -- ansible-galaxy collection install -r configuration/roles/requirements.yml --force --no-cache -p configuration/.galaxy/collections
