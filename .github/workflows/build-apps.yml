name: Build and Package Applications

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/**'
      - '.github/workflows/build-apps.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/**'
      - '.github/workflows/build-apps.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build & Zip Applications
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js (or appropriate build runtime)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build applications
        run: |
          echo "Building sample-app..."
          cd apps/sample-app
          npm install
          npm test
          
      - name: Package Applications (Zip)
        run: |
          mkdir -p dist
          cd apps/sample-app
          zip -r ../../dist/sample-app.zip . -x "node_modules/*"
          echo "Successfully packaged sample-app.zip to dist/"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-packages
          path: dist/
          retention-days: 5
