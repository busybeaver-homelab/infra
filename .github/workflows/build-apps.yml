name: Build and Package Applications

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/**'
      - '.github/workflows/build-apps.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/**'
      - '.github/workflows/build-apps.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Zip Applications
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js (or appropriate build runtime)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fedd5a4 # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/sample-app/package-lock.json'

      - name: Build applications
        run: |
          echo "Building sample-app..."
          cd apps/sample-app
          npm install
          npm test
          
      - name: Package Applications (Zip)
        run: |
          mkdir -p dist
          cd apps/sample-app
          zip -r ../../dist/sample-app.zip . -x "node_modules/*"
          echo "Successfully packaged sample-app.zip to dist/"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea2ffd6fb66b502a35368a4f0 # v4.4.3
        with:
          name: app-packages
          path: dist/
          retention-days: 5
