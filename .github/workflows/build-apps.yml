name: Build and Package Applications

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/**'
      - '.github/workflows/build-apps.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/**'
      - '.github/workflows/build-apps.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build & Zip Applications
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js (or appropriate build runtime)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build applications
        run: |
          # Create apps/ directory if it doesn't exist, though we will scaffold it in P6-7
          mkdir -p apps
          echo "Building applications..."
          # Placeholder for compilation/build steps (e.g. npm ci && npm run build)
          
      - name: Package Applications (Zip)
        run: |
          mkdir -p dist
          # Create structured zip package of apps
          # zip -r dist/app.zip apps/
          echo "Packaging application artifacts to dist/"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-packages
          path: dist/
          retention-days: 5
