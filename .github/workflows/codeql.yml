name: CodeQL Analysis & Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # Every Monday at 04:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze-codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04 # pinned; bump deliberately via PR together with Molecule/host OS
    environment: code_quality
    timeout-minutes: 360
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ["actions", "python"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"

  analyze-iac-and-scripts:
    name: Multi-Engine Security (IaC, Actions & Shell)
    runs-on: ubuntu-24.04 # pinned; bump deliberately via PR together with Molecule/host OS
    environment: code_quality
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: $/.github/actions/setup-environment

      - name: Run Checkov IaC & Configuration Scanner
        shell: bash
        run: |
          mise exec -- uvx checkov -d infrastructure -d configuration --framework terraform,ansible -o sarif --output-file-path .
        continue-on-error: true

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: results_sarif.sarif
          category: checkov
        continue-on-error: true

      - name: Run KICS IaC Scanner
        shell: bash
        run: |
          ./scripts/run-kics.sh --output-dir kics-results --output-name kics.sarif
        continue-on-error: true

      - name: Upload KICS SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: kics-results/kics.sarif
          category: kics
        continue-on-error: true

      - name: Run Trivy IaC Scan
        shell: bash
        run: |
          mise exec -- trivy config --skip-dirs .venv,.worktrees --format sarif --output trivy-iac.sarif .
        continue-on-error: true

      - name: Upload Trivy IaC Scan Results
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac
        continue-on-error: true

      - name: Run Trivy Filesystem Vulnerability Scanner
        shell: bash
        run: |
          mise exec -- trivy fs --format sarif --output trivy-fs.sarif --exit-code 0 --ignore-unfixed --severity CRITICAL,HIGH .
        continue-on-error: true

      - name: Upload Trivy Filesystem Scan Results
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
        continue-on-error: true

      - name: Run Zizmor Workflow Security Audit
        shell: bash
        run: |
          mise exec -- uvx zizmor --format sarif . > zizmor.sarif
        continue-on-error: true

      - name: Upload Zizmor SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: zizmor.sarif
          category: zizmor
        continue-on-error: true

      - name: Run ShellCheck Analysis
        shell: bash
        run: |
          mise exec -- shellcheck -f json scripts/*.sh > shellcheck-raw.json || true
          python3 scripts/format-shellcheck-sarif.py shellcheck-raw.json > shellcheck-results.sarif
        continue-on-error: true

      - name: Upload ShellCheck Scan Results
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: shellcheck-results.sarif
          category: shellcheck
        continue-on-error: true
