name: CodeQL Analysis & Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # Every Monday at 04:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze-codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ["actions", "python"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          category: "/language:${{ matrix.language }}"

  analyze-iac-and-scripts:
    name: Multi-Ecosystem Security (IaC & Shell)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Mise
        uses: jdx/mise-action@5083fe46898c414b2475087cc79da59e7da859e8 # v2.1.11
        with:
          cache: true

      - name: Run Trivy IaC Scan
        shell: bash
        run: |
          mise exec -- trivy config --skip-dirs .venv,.worktrees --format sarif --output trivy-results.sarif .

      - name: Upload Trivy IaC Scan Results
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-iac

      - name: Run ShellCheck Analysis
        shell: bash
        run: |
          mise exec -- shellcheck -f json scripts/*.sh > shellcheck-raw.json || true
          python3 scripts/format-shellcheck-sarif.py shellcheck-raw.json > shellcheck-results.sarif

      - name: Upload ShellCheck Scan Results
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        if: always()
        with:
          sarif_file: shellcheck-results.sarif
          category: shellcheck
