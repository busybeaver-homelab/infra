---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # Every Monday at 03:00 UTC

# Each merge queue entry gets a unique gh-readonly-queue/main/pr-<N>-<sha> ref, so
# merge_group runs never share a group; runs for invalidated entries are not
# cancelled here and run to completion (STD-CI-44).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  pr-metadata:
    name: Verify PR Metadata
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04 # pinned to the host and Molecule OS; bump deliberately via PR
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify PR title follows Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/verify-commit-msg.sh --subject "$PR_TITLE"

      - name: Verify PR branch name convention
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if ! [[ "$HEAD_REF" =~ ^(renovate/.+|(feat|fix|chore|docs|refactor|test|ci|perf|style|build)/[a-z0-9-]+/[a-z0-9._-]+)$ ]]; then
            echo "Error: Branch '$HEAD_REF' does not match <type>/<scope>/<short-desc> or renovate/*" >&2
            exit 1
          fi

  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-26.04 # pinned to the host and Molecule OS; bump deliberately via PR
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      shell: ${{ steps.filter.outputs.shell }}
      tofu: ${{ steps.filter.outputs.tofu }}
      ansible: ${{ steps.filter.outputs.ansible }}
      molecule: ${{ steps.filter.outputs.molecule }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name != 'merge_group' && 1 || 0 }}
          persist-credentials: false

      - name: Detect Changed Paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            toolchain: &toolchain
              - 'mise.toml'
              - 'mise.lock'
              - '.mise/locks/**'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
              - 'pyproject.toml'
              - 'uv.lock'
            lint:
              - *toolchain
              - '**/*.{yml,yaml,json,md,py,sh,tf,hcl,toml}'
              - '.tflint.hcl'
              - 'lefthook.yml'
              - '.github/**'
            shell:
              - *toolchain
              - 'scripts/**'
              - 'tests/scripts/**'
              - 'configuration/roles/docker_compose_service/files/**'
              - 'infrastructure/cloudflare/**'
              - 'infrastructure/dns/**'
              - '.github/**'
            tofu:
              - *toolchain
              - 'infrastructure/**'
              - '.tflint.hcl'
            ansible:
              # Includes *toolchain (pyproject.toml, uv.lock, mise.toml, mise.lock, .mise/locks/**)
              - *toolchain
              - 'configuration/**'
              - 'secrets/credentials.ci.sops.yaml'
              - 'ansible.cfg'
            molecule:
              # Includes *toolchain (pyproject.toml, uv.lock, mise.toml, mise.lock, .mise/locks/**)
              - *toolchain
              - 'configuration/**'
              - 'secrets/credentials.ci.sops.yaml'
              - 'ansible.cfg'

  lint-format:
    name: Code Quality and Lint Checks
    needs: changes
    if: (github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-26.04 # pinned to the host and Molecule OS; bump deliberately via PR
    environment: ci # synthetic-only CI age key for the SOPS leak backstop (STD-CI-23)
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Environment
        uses: $/.github/actions/setup-environment
        with:
          python: "true"
          galaxy: "true"
          tflint: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The SOPS hooks need the CI age key; they run in their own step below so the
      # key never reaches the other hooks' tools (STD-CI-28).
      - name: Run Lefthook Linters
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          LEFTHOOK_EXCLUDE: sops-secret-leaks,sops-disjointness
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            echo "Pull request detected. Fetching base branch for comparison..."
            git fetch origin "${BASE_REF}" --depth=1
            echo "Running Lefthook on changed files..."
            git diff --name-only --diff-filter=d -z "origin/${BASE_REF}...HEAD" | mise exec -- lefthook run pre-commit --files-from-stdin
          elif [ "${EVENT_NAME}" = "merge_group" ]; then
            echo "Merge group detected. Running Lefthook on changed files..."
            git diff --name-only --diff-filter=d -z "${MERGE_GROUP_BASE_SHA}...HEAD" | mise exec -- lefthook run pre-commit --files-from-stdin
          else
            echo "Push or Scheduled run detected. Running Lefthook on all files..."
            mise exec -- lefthook run pre-commit --all-files
          fi

      # Backstop for the sops-secret-leaks / sops-disjointness hooks (STD-CI-48).
      # Only CI values can be checked here; production values and prod/CI
      # disjointness are enforced by the local hook (the GPG key never reaches CI).
      - name: Scan for SOPS secret leaks
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_CI }}
        run: mise exec -- bash scripts/check-sops-secret-leaks.sh --check-disjointness --all-files

      - name: Verify SOPS secrets schema parity
        run: mise exec -- bash scripts/check-secrets-schema-parity.sh secrets/credentials.sops.yaml secrets/credentials.ci.sops.yaml

      - name: Verify git-crypt Encryption
        run: mise exec -- bash scripts/verify-git-crypt.sh --all

      - name: Verify mise.lock is in sync with mise.toml
        run: mise exec -- mise lock --dry-run

      - name: Verify OpenTofu README docs are up to date
        run: git ls-files 'infrastructure/**/*.tf' | xargs bash scripts/generate-tf-docs.sh

      - name: Verify zero formatting / generated-docs drift
        run: |
          if ! git diff --no-textconv --exit-code HEAD; then
            echo "::error::Formatting or generated-docs drift detected. Run 'mise run fmt' and 'scripts/generate-tf-docs.sh' locally and commit the changes."
            exit 1
          fi

  shell-bats:
    name: Script Tests (Bats-core)
    needs: changes
    if: (github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-26.04 # pinned to the host and Molecule OS; bump deliberately via PR
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: $/.github/actions/setup-environment
        with:
          python: "true"
          galaxy: "true"

      - name: Run Bats tests
        run: mise run test:scripts

  tofu-validate:
    name: OpenTofu Validation & Tests
    needs: changes
    if: (github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.changes.outputs.tofu == 'true'
    runs-on: ubuntu-26.04 # pinned to the host and Molecule OS; bump deliberately via PR
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      # Validate/test never touch real state: a fixed throwaway value, never the production passphrase.
      TF_VAR_state_encryption_passphrase: ci-validation-dummy-passphrase-32ch
      TOFU_STATE_PASSPHRASE: ci-validation-dummy-passphrase-32ch
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: $/.github/actions/setup-environment
        with:
          tflint: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache OpenTofu Plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tofu/plugins
          key: tofu-plugins-${{ runner.os }}-${{ hashFiles('infrastructure/**/.terraform.lock.hcl') }}
          restore-keys: |
            tofu-plugins-${{ runner.os }}-

      - name: Check OpenTofu Formatting
        run: mise exec -- tofu fmt -check -recursive infrastructure/

      - name: Run TFLint
        run: mise exec -- tflint --recursive --config "$PWD/.tflint.hcl"

      - name: Validate OpenTofu Modules
        run: |
          for module in gcp cloudflare homelab oci azure github monitoring mesh dns; do
            echo "=== Validating module: $module ==="
            (cd "infrastructure/$module" && mise exec -- tofu init -backend=false && mise exec -- tofu validate)
          done

      - name: Run Native OpenTofu Tests
        run: mise run test:infra

      - name: Run OpenTofu child-module unit tests
        run: mise run test:tofu:children

      - name: Verify OpenTofu provider lockfiles cover linux_amd64 and darwin_arm64
        run: |
          for lock in infrastructure/*/.terraform.lock.hcl; do
            echo "Checking $lock"
            grep -q 'zh:' "$lock" || { echo "::error::$lock is missing zh: hashes (run 'mise run tofu:lock')"; exit 1; }
          done

  ansible-check:
    name: Ansible Lint & Syntax Check
    needs: changes
    if: (github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.changes.outputs.ansible == 'true'
    runs-on: ubuntu-26.04 # pinned to the host and Molecule OS; bump deliberately via PR
    environment: ci
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: $/.github/actions/setup-environment
        with:
          python: "true"
          galaxy: "true"

      - name: Decrypt CI secrets (scoped permissions)
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_CI }}
        run: |
          (umask 077 && mise exec -- sops --decrypt secrets/credentials.ci.sops.yaml > "${RUNNER_TEMP}/credentials.ci.yaml")

      - name: Run ansible-lint
        run: mise exec -- ansible-lint configuration/

      - name: Test Dynamic Ansible Inventory parsing
        run: |
          cp configuration/inventories/fixtures/oci_state.json /tmp/homelab_test_oci_state.json
          cp configuration/inventories/fixtures/gcp_state.json /tmp/homelab_test_gcp_state.json
          mise exec -- ansible-inventory -i configuration/inventories/test.terraform_state.yml --graph
          mise exec -- ansible-inventory -i configuration/inventories/test.terraform_state.yml --host oci-amd-1
          mise exec -- ansible-inventory -i configuration/inventories/test_gcp.terraform_state.yml --graph
          mise exec -- ansible-inventory -i configuration/inventories/test_gcp.terraform_state.yml --host gcp-default-vm

      - name: Syntax check all playbooks
        run: |
          mise exec -- ansible-playbook --syntax-check \
            -i configuration/inventories/ \
            configuration/playbooks/site.yml
          mise exec -- ansible-playbook --syntax-check \
            -i configuration/inventories/ \
            configuration/playbooks/oci.yml
          mise exec -- ansible-playbook --syntax-check \
            -i configuration/inventories/ \
            configuration/playbooks/gcp.yml

      - name: Dry-run (check mode) against ephemeral target
        run: |
          mise exec -- ansible-playbook --check \
            -i "localhost," \
            -c local \
            -e @"${RUNNER_TEMP}/credentials.ci.yaml" \
            configuration/playbooks/site.yml

      - name: Remove decrypted secrets
        if: always()
        run: rm -f "${RUNNER_TEMP}/credentials.ci.yaml"

  molecule:
    name: Molecule (${{ matrix.scenario }})
    needs: changes
    if: (github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.changes.outputs.molecule == 'true'
    runs-on: ubuntu-26.04 # pinned to the host and Molecule OS; bump deliberately via PR
    environment: ci
    permissions:
      contents: read
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - base_ubuntu_server
          - restic_backup
          - docker_compose_service
          - oci
          - gcp
          - homelab
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: $/.github/actions/setup-environment
        with:
          python: "true"
          galaxy: "true"

      - name: Cache Molecule APT Archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            configuration/roles/base_ubuntu_server/.cache/apt/archives
            configuration/roles/restic_backup/.cache/apt/archives
            configuration/roles/docker_compose_service/.cache/apt/archives
            configuration/.cache/apt/oci/archives
            configuration/.cache/apt/gcp/archives
            configuration/.cache/apt/homelab/archives
          key: molecule-apt-${{ matrix.scenario }}-${{ hashFiles('configuration/roles/requirements.yml') }}
          restore-keys: |
            molecule-apt-${{ matrix.scenario }}-

      - name: Run Molecule test (base_ubuntu_server)
        if: matrix.scenario == 'base_ubuntu_server'
        run: |
          cd configuration/roles/base_ubuntu_server
          mise exec -- molecule test
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_CI }}

      - name: Run Molecule test (restic_backup)
        if: matrix.scenario == 'restic_backup'
        run: |
          cd configuration/roles/restic_backup
          mise exec -- molecule test
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_CI }}

      - name: Run Molecule test (docker_compose_service)
        if: matrix.scenario == 'docker_compose_service'
        run: |
          cd configuration/roles/docker_compose_service
          mise exec -- molecule test
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_CI }}

      - name: Run Molecule test (oci)
        if: matrix.scenario == 'oci'
        run: |
          cd configuration
          mise exec -- molecule test -s oci
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_CI }}

      - name: Run Molecule test (gcp)
        if: matrix.scenario == 'gcp'
        run: |
          cd configuration
          mise exec -- molecule test -s gcp
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_CI }}

      - name: Run Molecule test (homelab)
        if: matrix.scenario == 'homelab'
        run: |
          cd configuration
          mise exec -- molecule test -s homelab
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_CI }}

      - name: Prepare Molecule APT Cache for Saving
        if: always()
        run: |
          sudo find configuration -type f -name lock -path "*/.cache/apt/*" -delete 2>/dev/null || true
          sudo find configuration -type d -name partial -path "*/.cache/apt/*" -prune -exec rm -rf {} + 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" configuration 2>/dev/null || true
          sudo chmod -R u+rwX,go+rX configuration 2>/dev/null || true

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - pr-metadata
      - changes
      - lint-format
      - shell-bats
      - tofu-validate
      - ansible-check
      - molecule
    runs-on: ubuntu-26.04 # pinned to the host and Molecule OS; bump deliberately via PR
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Aggregate CI Status
        env:
          EVENT_NAME: ${{ github.event_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "=== Evaluating CI Job Results ==="
          echo "${NEEDS_JSON}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            pr_meta_result=$(echo "${NEEDS_JSON}" | jq -r '.["pr-metadata"].result // "missing"')
            if [ "${pr_meta_result}" != "success" ]; then
              echo "Error: pr-metadata must succeed on pull_request events (got: ${pr_meta_result})."
              exit 1
            fi
          fi

          failed_jobs=$(echo "${NEEDS_JSON}" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')

          if [ -n "${failed_jobs}" ]; then
            echo "Error: The following required jobs did not succeed:"
            echo "${failed_jobs}"
            exit 1
          fi
          echo "All CI jobs succeeded or were cleanly skipped. Gate passed."
