---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # Every Monday at 03:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-26.04 # pinned to the host and Molecule OS; bump deliberately via PR
    permissions:
      contents: read
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      shell: ${{ steps.filter.outputs.shell }}
      tofu: ${{ steps.filter.outputs.tofu }}
      ansible: ${{ steps.filter.outputs.ansible }}
      molecule: ${{ steps.filter.outputs.molecule }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect Changed Paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            lint:
              - '**/*.{yml,yaml,json,md,py,sh,tf,hcl,toml}'
              - '.python-version'
              - '.tflint.hcl'
              - 'lefthook.yml'
              - 'mise.lock'
              - 'uv.lock'
              - '.github/**'
            shell:
              - 'scripts/**'
              - 'tests/scripts/**'
              - 'infrastructure/cloudflare/**'
              - '.github/**'
              - 'mise.toml'
              - 'mise.lock'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
            tofu:
              - 'infrastructure/**'
              - '.github/workflows/ci.yml'
            ansible:
              - 'configuration/**'
              - 'secrets/credentials.ci.sops.yaml'
              - '.github/workflows/ci.yml'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
            molecule:
              - 'configuration/**'
              - 'secrets/credentials.ci.sops.yaml'
              - '.github/workflows/ci.yml'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'

  lint-format:
    name: Code Quality and Lint Checks
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-26.04 # pinned to the host and Molecule OS; bump deliberately via PR
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Environment
        uses: $/.github/actions/setup-environment
        with:
          python: "true"
          galaxy: "true"
          tflint: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Lefthook Linters
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Pull request detected. Fetching base branch for comparison..."
            git fetch origin "${BASE_REF}" --depth=1
            echo "Running Lefthook on changed files..."
            git diff --name-only --diff-filter=d -z "origin/${BASE_REF}...HEAD" | mise exec -- lefthook run pre-commit --files-from-stdin
          else
            echo "Push or Scheduled run detected. Running Lefthook on all files..."
            mise exec -- lefthook run pre-commit --all-files
          fi

      - name: Verify SOPS secrets schema parity
        run: mise exec -- bash scripts/check-secrets-schema-parity.sh secrets/credentials.sops.yaml secrets/credentials.ci.sops.yaml

      - name: Verify zero uncommitted formatting diff
        run: git diff --no-textconv --exit-code

  shell-bats:
    name: Script Tests (Bats-core)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-26.04 # pinned to the host and Molecule OS; bump deliberately via PR
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: $/.github/actions/setup-environment
        with:
          python: "true"
          galaxy: "true"

      - name: Run Bats tests
        run: mise run test:scripts

  tofu-validate:
    name: OpenTofu Validation & Tests
    needs: changes
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.tofu == 'true')
    runs-on: ubuntu-26.04 # pinned to the host and Molecule OS; bump deliberately via PR
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      # Validate/test never touch real state: a fixed throwaway value, never the production passphrase.
      TF_VAR_state_encryption_passphrase: ci-validation-dummy-passphrase-32ch
      TOFU_STATE_PASSPHRASE: ci-validation-dummy-passphrase-32ch
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: $/.github/actions/setup-environment
        with:
          tflint: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache OpenTofu Plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tofu/plugins
          key: tofu-plugins-${{ runner.os }}-${{ hashFiles('infrastructure/**/.terraform.lock.hcl') }}
          restore-keys: |
            tofu-plugins-${{ runner.os }}-

      - name: Check OpenTofu Formatting
        run: mise exec -- tofu fmt -check -recursive infrastructure/

      - name: Run TFLint
        run: mise exec -- tflint --recursive

      - name: Validate OpenTofu Modules
        run: |
          for module in gcp cloudflare homelab oci azure github monitoring mesh; do
            echo "=== Validating module: $module ==="
            (cd "infrastructure/$module" && mise exec -- tofu init -backend=false && mise exec -- tofu validate)
          done

      - name: Run Native OpenTofu Tests
        run: |
          mise run test:infra

  ansible-check:
    name: Ansible Lint & Syntax Check
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.ansible == 'true'
    runs-on: ubuntu-26.04 # pinned to the host and Molecule OS; bump deliberately via PR
    environment: ci
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: $/.github/actions/setup-environment
        with:
          python: "true"
          galaxy: "true"

      - name: Decrypt CI secrets (scoped permissions)
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_CI }}
        run: |
          (umask 077 && mise exec -- sops --decrypt secrets/credentials.ci.sops.yaml > "${RUNNER_TEMP}/credentials.ci.yaml")

      - name: Run ansible-lint
        run: mise exec -- ansible-lint configuration/

      - name: Test Dynamic Ansible Inventory parsing
        run: |
          cp configuration/inventories/fixtures/oci_state.json /tmp/homelab_test_oci_state.json
          mise exec -- ansible-inventory -i configuration/inventories/test.terraform_state.yml --graph
          mise exec -- ansible-inventory -i configuration/inventories/test.terraform_state.yml --host oci-amd-1

      - name: Syntax check all playbooks
        run: |
          mise exec -- ansible-playbook --syntax-check \
            -i configuration/inventories/ \
            configuration/playbooks/site.yml
          mise exec -- ansible-playbook --syntax-check \
            -i configuration/inventories/ \
            configuration/playbooks/oci.yml

      - name: Dry-run (check mode) against ephemeral target
        run: |
          mise exec -- ansible-playbook --check \
            -i "localhost," \
            -c local \
            -e @"${RUNNER_TEMP}/credentials.ci.yaml" \
            configuration/playbooks/site.yml

      - name: Remove decrypted secrets
        if: always()
        run: rm -f "${RUNNER_TEMP}/credentials.ci.yaml"

  molecule:
    name: Molecule (${{ matrix.scenario }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.molecule == 'true'
    runs-on: ubuntu-26.04 # pinned to the host and Molecule OS; bump deliberately via PR
    environment: ci
    permissions:
      contents: read
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - base_ubuntu_server
          - restic_backup
          - oci
          - homelab
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: $/.github/actions/setup-environment
        with:
          python: "true"
          galaxy: "true"

      - name: Cache Molecule APT Archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            configuration/roles/base_ubuntu_server/.cache/apt/archives
            configuration/roles/restic_backup/.cache/apt/archives
            configuration/.cache/apt/oci/archives
            configuration/.cache/apt/homelab/archives
          key: molecule-apt-${{ matrix.scenario }}-${{ hashFiles('configuration/roles/requirements.yml') }}
          restore-keys: |
            molecule-apt-${{ matrix.scenario }}-

      - name: Setup SOPS Age Key for Molecule
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_CI }}
        run: |
          mkdir -p "${HOME}/.config/sops/age"
          (umask 077 && echo "${SOPS_AGE_KEY}" > "${HOME}/.config/sops/age/keys.txt")

      - name: Run Molecule test (base_ubuntu_server)
        if: matrix.scenario == 'base_ubuntu_server'
        run: |
          cd configuration/roles/base_ubuntu_server
          mise exec -- molecule test
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

      - name: Run Molecule test (restic_backup)
        if: matrix.scenario == 'restic_backup'
        run: |
          cd configuration/roles/restic_backup
          mise exec -- molecule test
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

      - name: Run Molecule test (oci)
        if: matrix.scenario == 'oci'
        run: |
          cd configuration
          mise exec -- molecule test -s oci
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

      - name: Run Molecule test (homelab)
        if: matrix.scenario == 'homelab'
        run: |
          cd configuration
          mise exec -- molecule test -s homelab
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

      - name: Cleanup SOPS Age Key
        if: always()
        run: rm -f "${HOME}/.config/sops/age/keys.txt"

      - name: Prepare Molecule APT Cache for Saving
        if: always()
        run: |
          sudo find configuration -type f -name lock -path "*/.cache/apt/*" -delete 2>/dev/null || true
          sudo find configuration -type d -name partial -path "*/.cache/apt/*" -prune -exec rm -rf {} + 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" configuration 2>/dev/null || true
          sudo chmod -R u+rwX,go+rX configuration 2>/dev/null || true

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - changes
      - lint-format
      - shell-bats
      - tofu-validate
      - ansible-check
      - molecule
    runs-on: ubuntu-26.04 # pinned to the host and Molecule OS; bump deliberately via PR
    permissions:
      contents: read
    steps:
      - name: Aggregate CI Status
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "=== Evaluating CI Job Results ==="
          echo "${NEEDS_JSON}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'

          failed_jobs=$(echo "${NEEDS_JSON}" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')

          if [ -n "${failed_jobs}" ]; then
            echo "Error: The following required jobs did not succeed:"
            echo "${failed_jobs}"
            exit 1
          fi
          echo "All CI jobs succeeded or were cleanly skipped. Gate passed."
