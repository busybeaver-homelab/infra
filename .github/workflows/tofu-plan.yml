name: OpenTofu Plan

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/**"
      - ".github/workflows/tofu-plan.yml"
  pull_request:
    branches: [main]
    paths:
      - "infrastructure/**"
      - ".github/workflows/tofu-plan.yml"
  schedule:
    - cron: "0 3 * * 1" # Every Monday at 03:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: OpenTofu Validation and Plan
    runs-on: ubuntu-latest
    environment: ci
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      TF_VAR_state_encryption_passphrase: ${{ secrets.TOFU_ENCRYPTION_PASSPHRASE }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@ae80549da5ee748e640f13a02d4a22b315519323 # v1.0.8
        with:
          tofu_version: "1.8"

      - name: Download Build Artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372ec807db5 # v4.1.8
        continue-on-error: true
        with:
          name: app-packages
          path: dist/

      - name: Ensure Dist Directory and Packages Exist (Mock if missing)
        run: |
          mkdir -p dist
          if [ ! -f dist/sample-app.zip ]; then
            echo "placeholder" > mock.txt
            zip dist/sample-app.zip mock.txt
            rm mock.txt
          fi

      - name: Initialize and Validate GCP Module
        run: |
          cd infrastructure/gcp
          tofu init -backend=false
          tofu validate

      - name: Initialize and Validate Cloudflare Module
        run: |
          cd infrastructure/cloudflare
          tofu init -backend=false
          tofu validate

      - name: Initialize and Validate Homelab Module
        run: |
          cd infrastructure/homelab
          tofu init -backend=false
          tofu validate

      - name: Initialize and Validate OCI Module
        run: |
          cd infrastructure/oci
          tofu init -backend=false
          tofu validate

      - name: Initialize and Validate GitHub Module
        run: |
          cd infrastructure/github
          tofu init -backend=false
          tofu validate

      - name: Set up Go
        uses: actions/setup-go@3041dec5d691a404719b52867abc1d1a1dd1a182 # v5.2.0
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: infrastructure/tests/go.sum

      - name: Run Terratest (module validation)
        run: |
          mkdir -p dist
          if [ ! -f dist/sample-app.zip ]; then
            echo "placeholder" > mock.txt && zip dist/sample-app.zip mock.txt && rm mock.txt
          fi
          cd infrastructure/tests
          go test ./... -v -timeout 10m
        env:
          TF_VAR_state_encryption_passphrase: ${{ secrets.TOFU_ENCRYPTION_PASSPHRASE }}
