name: OpenTofu Plan

on:
  push:
    branches: [ main ]
    paths:
      - 'infrastructure/**'
      - '.github/workflows/tofu-plan.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'infrastructure/**'
      - '.github/workflows/tofu-plan.yml'
  schedule:
    - cron: '0 3 * * 1' # Every Monday at 03:00 UTC

permissions:
  contents: read

jobs:
  plan:
    name: OpenTofu Validation and Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for secure Google OIDC authentication
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          # In production, these should be stored as repository variables/secrets or configured here
          workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-sa@homelab-infra-project.iam.gserviceaccount.com'

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.8'

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: app-packages
          path: dist/

      - name: Ensure Dist Directory and Packages Exist (Mock if missing)
        run: |
          mkdir -p dist
          if [ ! -f dist/sample-app.zip ]; then
            echo "Creating a mock sample-app.zip for OpenTofu validation..."
            echo "placeholder" > mock.txt
            zip dist/sample-app.zip mock.txt
            rm mock.txt
          fi

      - name: Initialize and Validate GCP Module
        run: |
          cd infrastructure/gcp
          tofu init -backend=false
          tofu validate

      - name: Initialize and Validate Cloudflare Module
        run: |
          cd infrastructure/cloudflare
          tofu init -backend=false
          tofu validate

      - name: Initialize and Validate Homelab Module
        run: |
          cd infrastructure/homelab
          tofu init -backend=false
          tofu validate
