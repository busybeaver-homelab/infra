name: Ansible Check

on:
  push:
    branches: [main]
    paths:
      - "configuration/**"
      - "secrets/credentials.ci.sops.yaml"
      - ".github/workflows/ansible-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "configuration/**"
      - "secrets/credentials.ci.sops.yaml"
      - ".github/workflows/ansible-check.yml"
  schedule:
    - cron: "0 3 * * 1" # Every Monday at 03:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ansible-check:
    name: Ansible Lint and Syntax Check
    runs-on: ubuntu-latest
    environment: ci
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_CI }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@f67e240f2d1852441a790575791491841d4022d2 # v5.3.0
        with:
          python-version-file: ".python-version"

      - name: Install UV
        uses: astral-sh/setup-uv@81414bc91b6f007328bf205c0883b6326cd665b1 # v5.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Mise
        uses: jdx/mise-action@af40da49309fc57bf9e1a1795c643666d933a049 # v2.1.11
        with:
          cache: true

      - name: Install Python dependencies
        run: uv sync

      - name: Decrypt CI secrets
        run: |
          sops --decrypt secrets/credentials.ci.sops.yaml > /tmp/credentials.ci.yaml

      - name: Run ansible-lint
        run: mise exec -- ansible-lint configuration/

      - name: Run Molecule tests
        run: |
          cd configuration/roles/base-ubuntu-server
          molecule test
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

      - name: Syntax check all playbooks
        run: |
          mise exec -- ansible-playbook --syntax-check \
            -i configuration/inventories/ \
            configuration/playbooks/site.yml

      - name: Dry-run (check mode) with CI secrets
        run: |
          mise exec -- ansible-playbook --check \
            -i configuration/inventories/ \
            -e @/tmp/credentials.ci.yaml \
            configuration/playbooks/site.yml
        continue-on-error: true # check mode may fail if hosts unreachable in CI

      - name: Remove decrypted secrets
        if: always()
        run: rm -f /tmp/credentials.ci.yaml
