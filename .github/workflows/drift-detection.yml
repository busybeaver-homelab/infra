name: Infrastructure Drift Detection

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drift-detect:
    name: Drift Detection (${{ matrix.module }})
    runs-on: ubuntu-latest
    environment: ci
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # cloudflare is intentionally excluded: it reads identifying configuration from
        # production SOPS (GPG), which CI cannot decrypt. Run `mise run drift:cloudflare` locally.
        module:
          - oci
          - gcp
          - azure
          - homelab
          - github
          - monitoring
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          cache: true

      - name: Restore OpenTofu Plugin Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: infrastructure/${{ matrix.module }}/.terraform/providers
          key: tofu-plugins-${{ matrix.module }}-${{ hashFiles(format('infrastructure/{0}/.terraform.lock.hcl', matrix.module)) }}
          restore-keys: |
            tofu-plugins-${{ matrix.module }}-

      - name: Decrypt CI secrets (scoped permissions)
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_CI }}
        run: |
          if [ -n "${SOPS_AGE_KEY:-}" ]; then
            (umask 077 && mise exec -- sops --decrypt secrets/credentials.ci.sops.yaml > "${RUNNER_TEMP}/credentials.ci.yaml")
            R2_KEY_ID=$(mise exec -- yq '.opentofu.cloudflare_r2_access_key_id // ""' "${RUNNER_TEMP}/credentials.ci.yaml")
            R2_SECRET=$(mise exec -- yq '.opentofu.cloudflare_r2_secret_access_key // ""' "${RUNNER_TEMP}/credentials.ci.yaml")
            if [ -n "$R2_KEY_ID" ] && [ -n "$R2_SECRET" ]; then
              echo "::add-mask::$R2_KEY_ID"
              echo "::add-mask::$R2_SECRET"
              {
                echo "AWS_ACCESS_KEY_ID=$R2_KEY_ID"
                echo "AWS_SECRET_ACCESS_KEY=$R2_SECRET"
                echo "AWS_DEFAULT_REGION=auto"
              } >> "$GITHUB_ENV"
            fi
            STATE_PASSPHRASE=$(mise exec -- yq '.opentofu.state_encryption_passphrase // ""' "${RUNNER_TEMP}/credentials.ci.yaml")
            if [ -n "$STATE_PASSPHRASE" ]; then
              echo "::add-mask::$STATE_PASSPHRASE"
              echo "TF_VAR_state_encryption_passphrase=$STATE_PASSPHRASE" >> "$GITHUB_ENV"
            fi
          fi

      - name: Initialize OpenTofu Module
        run: |
          cd "infrastructure/${{ matrix.module }}"
          mise exec -- tofu init -lockfile=readonly

      - name: Check Infrastructure Drift
        id: drift
        run: |
          cd "infrastructure/${{ matrix.module }}"
          set +e
          mise exec -- tofu plan -detailed-exitcode -lockfile=readonly -no-color > "${RUNNER_TEMP}/drift_plan.txt" 2>&1
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ No drift detected for ${{ matrix.module }}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          elif [ $EXIT_CODE -eq 2 ]; then
            {
              echo "⚠️ DRIFT DETECTED in ${{ matrix.module }}! Infrastructure has diverged from declarative code."
              echo '```text'
              cat "${RUNNER_TEMP}/drift_plan.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 2
          else
            echo "❌ Error evaluating drift for ${{ matrix.module }} (Exit code $EXIT_CODE)." >> "$GITHUB_STEP_SUMMARY"
            cat "${RUNNER_TEMP}/drift_plan.txt"
            exit $EXIT_CODE
          fi
