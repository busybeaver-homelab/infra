name: Infrastructure Drift Detection

# Manual only (REV2-P0-7). Scheduled drift moves to a local `mise run drift:all` with a
# Healthchecks heartbeat (REV2-P2-7, owner decision D5): the CI SOPS file is synthetic, so
# scheduled CI plans cannot read the real state and only produced failures.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drift-detect:
    name: Drift Detection (${{ matrix.module }})
    runs-on: ubuntu-26.04 # pinned to the host and Molecule OS; bump deliberately via PR
    environment: ci
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # cloudflare and dns read identifying configuration from production SOPS (GPG),
        # which CI cannot decrypt. Run `mise run drift:cloudflare`, `mise run drift:dns`,
        # or `mise run drift:all` (with HEALTHCHECKS_DRIFT_PING_URL) locally.
        module:
          - oci
          - gcp
          - azure
          - homelab
          - github
          - monitoring
          - mesh
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: $/.github/actions/setup-environment

      - name: Restore OpenTofu Plugin Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: infrastructure/${{ matrix.module }}/.terraform/providers
          key: tofu-plugins-${{ matrix.module }}-${{ hashFiles(format('infrastructure/{0}/.terraform.lock.hcl', matrix.module)) }}
          restore-keys: |
            tofu-plugins-${{ matrix.module }}-

      - name: Decrypt CI secrets (scoped permissions)
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_CI }}
        run: |
          if [ -n "${SOPS_AGE_KEY:-}" ]; then
            (umask 077 && mise exec -- sops --decrypt secrets/credentials.ci.sops.yaml > "${RUNNER_TEMP}/credentials.ci.yaml")
            R2_KEY_ID=$(mise exec -- yq '.opentofu.cloudflare_r2_access_key_id // ""' "${RUNNER_TEMP}/credentials.ci.yaml")
            R2_SECRET=$(mise exec -- yq '.opentofu.cloudflare_r2_secret_access_key // ""' "${RUNNER_TEMP}/credentials.ci.yaml")
            if [ -n "$R2_KEY_ID" ] && [ -n "$R2_SECRET" ]; then
              echo "::add-mask::$R2_KEY_ID"
              echo "::add-mask::$R2_SECRET"
              {
                echo "AWS_ACCESS_KEY_ID=$R2_KEY_ID"
                echo "AWS_SECRET_ACCESS_KEY=$R2_SECRET"
                echo "AWS_DEFAULT_REGION=auto"
              } >> "$GITHUB_ENV"
            fi
            STATE_PASSPHRASE=$(mise exec -- yq '.opentofu.state_encryption_passphrase // ""' "${RUNNER_TEMP}/credentials.ci.yaml")
            if [ -n "$STATE_PASSPHRASE" ]; then
              echo "::add-mask::$STATE_PASSPHRASE"
              echo "TF_VAR_state_encryption_passphrase=$STATE_PASSPHRASE" >> "$GITHUB_ENV"
            fi
          fi

      - name: Install Provider Credentials
        env:
          MODULE: ${{ matrix.module }}
        run: |
          if [ -f "${RUNNER_TEMP}/credentials.ci.yaml" ]; then
            case "${MODULE}" in
              mesh)
                TS_CLIENT_ID=$(mise exec -- yq '.tailscale.client_id // ""' "${RUNNER_TEMP}/credentials.ci.yaml")
                TS_CLIENT_SECRET=$(mise exec -- yq '.tailscale.client_secret // ""' "${RUNNER_TEMP}/credentials.ci.yaml")
                if [ -n "${TS_CLIENT_ID}" ] && [ -n "${TS_CLIENT_SECRET}" ]; then
                  echo "::add-mask::${TS_CLIENT_ID}"
                  echo "::add-mask::${TS_CLIENT_SECRET}"
                  {
                    echo "TAILSCALE_OAUTH_CLIENT_ID=${TS_CLIENT_ID}"
                    echo "TAILSCALE_OAUTH_CLIENT_SECRET=${TS_CLIENT_SECRET}"
                  } >> "$GITHUB_ENV"
                fi
                ;;
            esac
          fi

      - name: Initialize OpenTofu Module
        env:
          MODULE: ${{ matrix.module }}
        run: |
          cd "infrastructure/${MODULE}"
          mise exec -- tofu init -input=false -lockfile=readonly > /dev/null

      - name: Check Infrastructure Drift
        id: drift
        env:
          MODULE: ${{ matrix.module }}
        run: |
          # Public-log hygiene (R2-CI-02): plan text, resource addresses and tool output never reach
          # the log or the step summary. Only action counts and error headlines are reported;
          # inspect details locally with `mise run drift:<module>`.
          cd "infrastructure/${MODULE}"
          PLAN="${RUNNER_TEMP}/drift.tfplan"
          LOG="${RUNNER_TEMP}/drift_plan.log"
          set +e
          mise exec -- tofu plan -input=false -lock=false -no-color -detailed-exitcode -out="$PLAN" > "$LOG" 2>&1
          EXIT_CODE=$?
          set -e

          case "$EXIT_CODE" in
            0)
              echo "✅ No drift detected for ${MODULE}." >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              {
                echo "⚠️ Drift detected in ${MODULE} (counts only; inspect locally):"
                mise exec -- tofu show -json "$PLAN" | jq -r '
                  [.resource_changes[] | .change.actions | join("+")]
                  | "- \(map(select(. == "create")) | length) to add, \(map(select(. == "update")) | length) to change, \(map(select(. == "delete+create" or . == "create+delete")) | length) to replace, \(map(select(. == "delete")) | length) to destroy"'
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              {
                echo "❌ Error evaluating drift for ${MODULE} (exit ${EXIT_CODE}):"
                # Headlines only: the detail lines below an error can quote configuration values.
                grep -E '^Error: ' "$LOG" | sort -u | head -5 | sed 's/^/- /'
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac
          rm -f "$PLAN" "$LOG"
          exit "$EXIT_CODE"
