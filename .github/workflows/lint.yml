name: Lint and Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # Every Monday at 03:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trivy:
    name: Security Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@18f259c5e261ebd1660144983293406f5c128cb5 # v0.28.0
        with:
          scan-type: "config"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

  lint:
    name: Code Quality and Lint Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up python (required for uv/ansible-lint)
        uses: actions/setup-python@f67e240f2d1852441a790575791491841d4022d2 # v5.3.0
        with:
          python-version-file: ".python-version"

      - name: Install UV
        uses: astral-sh/setup-uv@81414bc91b6f007328bf205c0883b6326cd665b1 # v5.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Mise
        uses: jdx/mise-action@af40da49309fc57bf9e1a1795c643666d933a049 # v2.1.11
        with:
          cache: true

      - name: Setup environment dependencies
        run: |
          uv sync

      - name: Run Lefthook Linters
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Pull request detected. Fetching base branch for comparison..."
            git fetch origin ${{ github.base_ref }} --depth=1
            echo "Running Lefthook on changed files..."
            git diff --name-only -z origin/${{ github.base_ref }}...HEAD | mise exec -- lefthook run pre-commit --files-from-stdin
          else
            echo "Push or Scheduled run detected. Running Lefthook on all files..."
            mise exec -- lefthook run pre-commit --all-files
          fi

  bats:
    name: Script Tests (Bats-core)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Mise
        uses: jdx/mise-action@af40da49309fc57bf9e1a1795c643666d933a049 # v2.1.11
        with:
          cache: true

      - name: Run Bats tests
        run: mise exec -- bats tests/scripts/
